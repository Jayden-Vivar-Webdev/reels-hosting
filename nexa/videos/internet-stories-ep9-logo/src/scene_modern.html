<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'VT';src:url(fonts/VT323-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#111;background:#1F7A7A}
#bg,#stage,#fx,#crt{position:absolute;inset:0}
#crt{pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,transparent 2px 5px)}
.px{font-family:'VT',monospace}
.win{position:relative;background:#C3C3C3;border:3px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -3px -3px 0 #808080,inset 3px 3px 0 #DFDFDF,14px 16px 0 rgba(0,0,0,.35);padding:5px;text-align:left}
.tb{height:56px;background:linear-gradient(90deg,#150C2B,#6557E8);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font-family:'VT',monospace;font-size:38px;letter-spacing:1px}
.tb i{display:inline-block;width:40px;height:36px;margin-left:5px;background:#C3C3C3;border:3px solid;border-color:#fff #404040 #404040 #fff;color:#111;font-style:normal;font-size:30px;line-height:28px;text-align:center}
.body{background:#fff;border:3px solid;border-color:#808080 #fff #fff #808080;margin-top:6px}
.btn{display:inline-block;background:#C3C3C3;border:3px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -2px -2px 0 #808080;padding:8px 40px;font-family:'VT',monospace;font-size:40px;color:#111}
.sticky{position:absolute;background:#FFE45C;color:#111;font-weight:800;font-size:44px;line-height:1.1;padding:22px 30px;box-shadow:10px 12px 0 rgba(0,0,0,.3);white-space:nowrap}
.h{font-weight:800;letter-spacing:-.04em;line-height:1}
/* modern part */
.card{position:relative;background:#fff;border-radius:34px;box-shadow:0 30px 70px rgba(21,12,43,.16),0 0 0 2px rgba(21,12,43,.06);text-align:left}
.pill{display:inline-block;border-radius:999px;padding:16px 34px;font-weight:700;font-size:40px;white-space:nowrap;background:#ECE8FF;color:#3B2FA8}
.hl{background:#B9A6FF;padding:0 .14em;border-radius:.12em}
#tag{position:absolute;left:60px;top:236px;font-family:'VT',monospace;font-size:40px;letter-spacing:2px;padding:4px 16px;background:#C3C3C3;border:3px solid;border-color:#fff #404040 #404040 #fff;color:#111}
#prog{position:absolute;left:60px;width:860px;top:300px;height:30px;padding:4px;background:#fff;border:3px solid;border-color:#808080 #fff #fff #808080;display:flex;gap:4px;overflow:hidden}
#prog b{display:block;width:20px;height:100%;background:#6557E8;flex:none}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.14;color:#fff}
#cap span{display:inline-block;margin:0 .1em;text-shadow:0 0 0 #000,4px 4px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 5px 0 #000}
#cap span.k{color:#FFE45C}
body.modern #cap span{color:#150C2B;text-shadow:none}
body.modern #cap span.k{color:#fff;background:#6557E8;padding:0 .12em .04em;border-radius:.12em}
body.modern #tag{background:#150C2B;color:#B9A6FF;border-color:#150C2B;border-radius:10px;font-family:'DM Sans';font-weight:700;font-size:26px;letter-spacing:5px;padding:10px 18px}
body.modern #prog{border:none;background:#E4E0F2;height:8px;padding:0;border-radius:6px;top:304px}
body.modern #crt{display:none}
#tag,#prog{display:none!important}
</style></head><body>
<div id="bg"></div><div id="stage"></div><div id="fx"></div><div id="crt"></div>
<div id="tag">INTERNET STORIES · EP.9</div><div id="prog"></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const S=$('stage'),C=$('cap'),BG=$('bg'),FX=$('fx'),PR=$('prog');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6.5*x)*Math.cos(7.5*x)};
const MOD=0; // lines >= MOD are "today" (modern look)
// retro window pop: stepped scale like an old OS opening a window
function pop(p,d,html,x,y,o={}){const q=clamp((p-d)/.06);if(q<=0)return '';const s=q>=1?1:.5+.5*Math.floor(q*4)/4;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},0) scale(${s}) rotate(${o.r||0}deg);transform-origin:50% 0;${o.css||''}">${q<1?`<div style="width:${o.w||600}px;height:${o.h||300}px;border:4px dotted #111"></div>`:html}</div>`}
// modern entrance: soft spring
function at(p,d,html,x,y,o={}){const s=spring((p-d)*3.2),e=ease((p-d)*4);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${(1-s)*60}px) scale(${.9+.1*s}) rotate(${(o.r||0)*(1-s)}deg);opacity:${clamp(e*1.6)}">${html}</div>`}
const win=(title,w,inner,o={})=>`<div class="win" style="width:${w}px"><div class="tb"><span>${title}</span><span><i>_</i><i>□</i><i>×</i></span></div>${o.nobody?inner:`<div class="body" style="${o.bs||''}">${inner}</div>`}</div>`;
const CUR=(x,y,s=1.4)=>`<svg style="position:absolute;left:${x}px;top:${y}px;transform:scale(${s});transform-origin:0 0" width="36" height="52" viewBox="0 0 12 19" shape-rendering="crispEdges"><path d="M0 0h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h-5v1h1v1h1v2h-1v1h-2v-1h-1v-2h-1v-1h-1v1h-1v1h-1z" fill="#000"/><path d="M1 2h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h-4v1h1v1h1v2h-1v-2h-1v-1h-1v-1h-2v1h-1v1h-1z" fill="#fff"/></svg>`;
function banner(w,t,o={}){const h=Math.round(w*60/468),fs=Math.round(h*.3);const blink=Math.floor(t*2.5)%2;
 return `<div style="width:${w}px;height:${h}px;background:linear-gradient(90deg,#000,#1B1450 60%,#3B2A86);border:3px solid #FFE45C;display:flex;align-items:center;justify-content:space-between;padding:0 ${h*.28}px;overflow:hidden">
 <div style="font-family:'DejaVu Sans',sans-serif;font-weight:700;font-size:${fs}px;line-height:1.15;color:#fff;width:${w*.64}px;text-align:left">${o.text??'Have you ever clicked your mouse right here?'}</div>
 <div style="font-family:'DejaVu Sans',sans-serif;font-weight:800;font-size:${fs*1.15}px;color:${blink?'#FFE45C':'#fff'};white-space:nowrap;opacity:${o.will??1}">&#8594; YOU WILL</div></div>`}
const lines=(n,c='#D5D5D5')=>Array(n).fill(0).map((_,k)=>`<div style="height:18px;background:${c};margin:14px 0;width:${[94,86,90,62,80][k%5]}%"></div>`).join('');
function browser(url,w,slot){return win('Netsite - '+url,w,`<div style="display:flex;gap:8px;padding:8px;background:#C3C3C3;border-bottom:3px solid #808080">${['Back','Fwd','Home','Reload'].map(b=>`<span class="btn" style="font-size:30px;padding:4px 14px">${b}</span>`).join('')}</div>
 <div class="px" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#C3C3C3;font-size:32px">Location: <span style="flex:1;background:#fff;border:3px solid;border-color:#808080 #fff #fff #808080;padding:0 10px">http://${url}/</span></div>
 <div style="padding:24px 30px"><div style="font-family:'Times New Roman',serif;font-weight:700;font-size:56px;color:#111">${url.split('.')[0].replace('hotwired','HotWired')}</div><div style="margin:18px 0">${slot||''}</div>${lines(4)}</div>`,{bs:'padding:0'})}
function counter(v,n=3){const s=String(v).padStart(n,'0');return `<div style="display:inline-flex;gap:6px;background:#000;padding:10px;border:3px solid #808080">${s.split('').map(c=>`<div class="px" style="width:110px;height:160px;background:linear-gradient(#222,#000 50%,#222);color:#7CFF6B;font-size:180px;line-height:160px;text-align:center;text-shadow:0 0 18px #3BDF2B">${c}</div>`).join('')}</div>`}
const dlg=(title,icon,msg,w=760)=>win(title,w,`<div style="display:flex;gap:28px;align-items:center;padding:30px 30px 10px"><div style="font-size:90px">${icon}</div><div style="font-weight:800;font-size:52px;line-height:1.1">${msg}</div></div><div style="text-align:center;padding:16px 0 24px"><span class="btn">OK</span></div>`,{nobody:true});
function phone(inner,w,h){return `<div style="width:${w}px;height:${h}px;border-radius:60px;background:#150C2B;padding:16px;box-shadow:0 40px 80px rgba(21,12,43,.3)"><div style="width:100%;height:100%;border-radius:46px;overflow:hidden;background:#fff;position:relative">${inner}</div></div>`}
const mbar=(w,c='#E8E5F0')=>`<div style="height:20px;width:${w}%;background:${c};border-radius:6px;margin:14px 0"></div>`;
const stampM=(t,fs=60)=>`<div class="h" style="font-size:${fs}px;padding:12px 30px;border:7px solid #E5484D;color:#E5484D;border-radius:16px;background:#fff;white-space:nowrap;letter-spacing:2px">${t}</div>`;
const MCUR=(x,y)=>`<svg style="position:absolute;left:${x}px;top:${y}px;filter:drop-shadow(0 8px 14px rgba(21,12,43,.3))" width="54" height="78" viewBox="0 0 18 26"><path d="M1 1 L1 21 L6 16 L9.5 24 L12.5 22.8 L9 15 L16 15 Z" fill="#150C2B" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
function mbrowser(url,w,slot){return `<div class="card" style="width:${w}px;overflow:hidden"><div style="height:76px;display:flex;align-items:center;gap:12px;padding:0 26px;background:#F4F2FA;border-bottom:2px solid #ECE8F6"><s style="width:16px;height:16px;border-radius:50%;background:#FF5F57;display:inline-block"></s><s style="width:16px;height:16px;border-radius:50%;background:#FEBC2E;display:inline-block"></s><s style="width:16px;height:16px;border-radius:50%;background:#28C840;display:inline-block"></s><div style="margin-left:16px;flex:1;height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;padding:0 20px;font-size:26px;color:#6E6790;font-weight:600">🔒 ${url}</div></div><div style="padding:34px 40px 30px"><div class="h" style="font-size:50px;color:#150C2B">HotWired</div><div style="margin:22px 0">${slot||''}</div>${mbar(94)}${mbar(84)}${mbar(90)}${mbar(60)}</div></div>`}
const SC=[
 // 0 hook: "NEW LOGO" card, calendar days tick 1..7, then crossed out
 (p,t)=>{const d=Math.max(1,Math.min(7,1+Math.floor(6*clamp((p-.15)/.55))));const x=clamp((p-.78)*6);
  return at(p,0,`<div class="card" style="width:880px;padding:46px 50px;text-align:center"><div style="font-weight:700;font-size:30px;letter-spacing:8px;color:#8A82A8">THE NEW LOGO · 2010</div>
   <div style="margin:34px auto 0;width:560px;height:250px;border-radius:24px;border:5px dashed #CFC8E8;display:flex;align-items:center;justify-content:center;font-size:120px">🤔</div></div>`,540,330)
  +at(p,.12,`<div class="card" style="width:420px;padding:0 0 30px;text-align:center;overflow:hidden"><div style="background:#6557E8;color:#fff;font-weight:800;font-size:40px;letter-spacing:8px;padding:18px">DAY</div><div class="h" style="font-size:200px;color:#150C2B;margin-top:14px">${d}</div></div>`,540,820,{r:-3})
  +(x>0?`<div style="position:absolute;left:270px;top:1000px;width:540px;height:14px;background:#E5484D;border-radius:8px;transform:rotate(-12deg) scaleX(${x});transform-origin:0 50%"></div>`:'')},
 // 1 the old look everyone knew
 (p,t)=>{const v=Math.round(100*eio((p-.55)/.3));
  return at(p,0,`<div class="card" style="width:880px;padding:46px 50px"><div style="font-weight:700;font-size:30px;letter-spacing:8px;color:#8A82A8">THE OLD LOOK</div>
   <div style="display:flex;gap:40px;align-items:center;margin-top:30px"><div style="width:250px;height:250px;border-radius:20px;background:#1B2A5E;box-shadow:inset 0 0 0 6px rgba(255,255,255,.08)"></div>
   <div class="h" style="font-size:58px;color:#150C2B;line-height:1.1">white letters<br>in a <span class="hl">navy box</span></div></div></div>`,540,330)
  +at(p,.5,`<div class="card" style="width:880px;padding:40px 50px"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="h" style="font-size:52px;color:#150C2B">👀 recognised</div><div class="h" style="font-size:72px;color:#6557E8">${v}%</div></div><div style="height:34px;border-radius:17px;background:#ECE8FF;margin-top:22px;overflow:hidden"><div style="height:100%;width:${v}%;background:#6557E8;border-radius:17px"></div></div></div>`,540,840,{r:1})},
 // 2 quietly appeared on gap.com
 (p,t)=>{const s=spring((p-.45)*3);return at(p,0,`<div class="card" style="width:940px;overflow:hidden"><div style="height:76px;display:flex;align-items:center;gap:12px;padding:0 26px;background:#F4F2FA;border-bottom:2px solid #ECE8F6"><s style="width:16px;height:16px;border-radius:50%;background:#FF5F57;display:inline-block"></s><s style="width:16px;height:16px;border-radius:50%;background:#FEBC2E;display:inline-block"></s><s style="width:16px;height:16px;border-radius:50%;background:#28C840;display:inline-block"></s><div style="margin-left:16px;flex:1;height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;padding:0 20px;font-size:26px;color:#6E6790;font-weight:600">🔒 gap.com</div></div>
   <div style="padding:34px 40px 30px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="width:200px;height:90px;border-radius:14px;border:4px solid ${p>.45?'#6557E8':'#CFC8E8'};background:rgba(101,87,232,${p>.45?.1:0});display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:#6557E8"><span style="opacity:${clamp(s*1.5)};transform:scale(${.6+.4*clamp(s,0,1.1)});display:inline-block">NEW</span></div><div style="display:flex;gap:18px">${mbar(0)}<div style="width:90px;height:18px;border-radius:6px;background:#E8E5F0"></div><div style="width:90px;height:18px;border-radius:6px;background:#E8E5F0"></div><div style="width:90px;height:18px;border-radius:6px;background:#E8E5F0"></div></div></div>
   <div style="height:260px;border-radius:18px;background:linear-gradient(160deg,#DCD6F2,#B8B0DC);margin:28px 0"></div>${mbar(88)}${mbar(70)}</div></div>`,540,330)
  +at(p,.1,'<div class="pill" style="background:#150C2B;color:#B9A6FF">OCTOBER 2010</div>',820,290,{r:4})
  +at(p,.6,'<div class="pill">🤫 no announcement</div>',540,1080,{r:-2})},
 // 3 plain black letters + tiny blue square (described as a spec card, no wordmark)
 (p,t)=>{const r=(e,a,d)=>at(p,d,`<div class="card" style="width:860px;padding:34px 44px;display:flex;align-items:center;gap:34px">${e}<div class="h" style="font-size:62px;color:#150C2B">${a}</div></div>`,540,0);
  return `<div style="position:absolute;left:0;top:360px;width:1080px">${r('<div style="width:110px;height:110px;border-radius:18px;background:#fff;border:4px solid #150C2B;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:70px;color:#111;font-family:Helvetica,Arial,sans-serif">Aa</div>','plain <span class="hl">black letters</span>',0)}</div>
   <div style="position:absolute;left:0;top:620px;width:1080px">${r('<div style="width:110px;height:110px;display:flex;align-items:center;justify-content:center"><div style="width:46px;height:46px;border-radius:6px;background:linear-gradient(135deg,#7FA7E8,#1F4FB5)"></div></div>','a <span class="hl">tiny blue square</span>',.3)}</div>`
  +at(p,.65,'<div class="pill">that was the whole redesign</div>',540,960,{r:2})},
 // 4 comments pile up
 (p,t)=>{const v=Math.round(1000*eio((p-.25)/.5));const n=Math.min(6,Math.floor(p*9));const em=['😡','👎','😤','🙄','😡','👎'];
  return at(p,0,`<div class="card" style="width:900px;padding:34px 40px;height:560px;overflow:hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div class="h" style="font-size:46px;color:#150C2B">💬 Comments</div><div class="pill" style="font-size:34px;padding:10px 26px;background:#FDE8E9;color:#C2272D">${v>=1000?'1,000+':v}</div></div>
   ${Array(n).fill(0).map((_,k)=>`<div style="display:flex;gap:20px;align-items:center;margin-top:22px"><div style="width:64px;height:64px;border-radius:50%;background:#ECE8FF;display:flex;align-items:center;justify-content:center;font-size:38px">${em[k]}</div><div style="flex:1"><div style="height:18px;width:${[70,55,80,62,74,50][k]}%;background:#E8E5F0;border-radius:6px"></div><div style="height:18px;width:${[40,60,35,52,30,45][k]}%;background:#F1EEF9;border-radius:6px;margin-top:10px"></div></div></div>`).join('')}</div>`,540,330)
  +at(p,.1,stampM('😡 HATED IT',62),700,800,{r:6})
  +at(p,.6,'<div class="h" style="font-size:96px;color:#150C2B;white-space:nowrap"><span class="hl">1,000+</span> angry</div>',540,950,{r:-2})},
 // 5 fake account
 (p,t)=>{const f=Math.round(4000*eio((p-.3)/.6)/10)*10;return at(p,0,`<div class="card" style="width:860px;padding:44px 50px;text-align:center"><div style="width:180px;height:180px;margin:0 auto;border-radius:50%;background:#ECE8FF;display:flex;align-items:center;justify-content:center;font-size:110px">🤡</div>
   <div class="h" style="font-size:60px;color:#150C2B;margin-top:26px">"I'm the new logo"</div><div style="font-weight:700;font-size:34px;color:#8A82A8;margin-top:12px">parody account</div>
   <div style="display:flex;gap:14px;justify-content:center;margin-top:30px">${['😂','😂','💀','😂'].map((e,k)=>`<span style="font-size:70px;opacity:${clamp((p-.3-k*.1)*5)};display:inline-block;transform:translateY(${(1-clamp((p-.3-k*.1)*5))*30}px)">${e}</span>`).join('')}</div></div>`,540,330)
  +at(p,.55,'<div class="pill">made just to mock it</div>',540,1060,{r:-2})},
 // 6 crowdsourcing ask -> made it worse
 (p,t)=>at(p,0,`<div class="card" style="width:880px;padding:44px 50px"><div style="display:flex;gap:22px;align-items:center"><div style="width:80px;height:80px;border-radius:50%;background:#150C2B"></div><div><div class="h" style="font-size:42px;color:#150C2B">The brand</div><div style="height:16px;width:180px;background:#E8E5F0;border-radius:6px;margin-top:10px"></div></div></div>
   <div class="h" style="font-size:66px;color:#150C2B;margin-top:34px;line-height:1.1">Got a better idea? <span class="hl">Send us your designs!</span> 🙏</div></div>`,540,330)
  +at(p,.25,'<div style="font-size:120px">📥✏️🎨</div>',540,780)
  +at(p,.7,stampM('MADE IT WORSE',72),540,990,{r:-5}),
 // 7 back to the blue box + quote
 (p,t)=>{const s=spring((p-.05)*3);return at(p,0,`<div class="card" style="width:880px;padding:40px 50px;display:flex;align-items:center;gap:40px"><div style="width:190px;height:190px;border-radius:18px;background:#1B2A5E;transform:scale(${.7+.3*clamp(s,0,1.1)})"></div><div><div style="font-weight:700;font-size:30px;letter-spacing:6px;color:#12A150">✓ RESTORED</div><div class="h" style="font-size:66px;color:#150C2B;margin-top:10px">the <span class="hl">blue box</span></div><div style="font-weight:700;font-size:34px;color:#8A82A8;margin-top:10px">about a week later</div></div></div>`,540,330)
  +at(p,.45,`<div class="card" style="width:900px;padding:40px 50px"><div style="font-size:110px;line-height:.6;color:#B9A6FF;font-weight:800">“</div><div class="h" style="font-size:62px;color:#150C2B;line-height:1.1">We did not go about this in the right way.</div><div style="font-weight:700;font-size:30px;color:#8A82A8;margin-top:20px">Gap North America president, Oct 2010</div></div>`,540,690,{r:-1})},
 // 8 recognise like a friend's face
 (p,t)=>{const a=clamp((p-.45)*4);return at(p,0,`<div class="card" style="width:880px;padding:46px 50px;display:flex;justify-content:space-around;align-items:center"><div style="text-align:center"><div style="font-size:150px;opacity:${1-.65*a}">📖</div><div class="h" style="font-size:48px;color:#150C2B;text-decoration:${a>.5?'line-through':'none'};text-decoration-color:#E5484D;text-decoration-thickness:8px">read</div></div><div class="h" style="font-size:90px;color:#CFC8E8">→</div><div style="text-align:center;opacity:${.35+.65*a}"><div style="font-size:150px">👀</div><div class="h" style="font-size:48px;color:#6557E8">recognise</div></div></div>`,540,330)
  +at(p,.6,'<div class="h" style="font-size:96px;color:#150C2B;white-space:nowrap">like a <span class="hl">friend\'s face</span></div>',540,820,{r:-2})
  +at(p,.75,'<div style="font-size:130px">🙂</div>',540,960)},
 // 9 overnight swap -> something taken
 (p,t)=>{const g=clamp((p-.4)*3);return at(p,0,`<div class="card" style="width:880px;padding:46px 50px;text-align:center"><div style="font-weight:700;font-size:30px;letter-spacing:8px;color:#8A82A8">OVERNIGHT 🌙</div>
   <div style="display:flex;justify-content:center;align-items:center;gap:50px;margin-top:34px"><div style="width:230px;height:230px;border-radius:20px;background:#1B2A5E;opacity:${1-g};transform:translateY(${-g*60}px) rotate(${-g*12}deg)"></div><div class="h" style="font-size:80px;color:#CFC8E8">→</div><div style="width:230px;height:230px;border-radius:20px;border:6px dashed #CFC8E8;display:flex;align-items:center;justify-content:center;font-size:110px;opacity:${g}">❓</div></div></div>`,540,330)
  +at(p,.55,'<div class="h" style="font-size:92px;color:#150C2B;white-space:nowrap">feels like a <span class="hl">loss</span> 😕</div>',540,900,{r:2})},
 // 10 checklist + phone
 (p,t)=>{const row=(txt,d)=>`<div style="display:flex;gap:26px;align-items:center;margin:20px 0;opacity:${clamp((p-d)*5)}"><div style="width:76px;height:76px;flex:none;border-radius:20px;background:${p>d+.1?'#6557E8':'#ECE8FF'};color:#fff;font-size:50px;font-weight:800;display:flex;align-items:center;justify-content:center">${p>d+.1?'✓':''}</div><div class="h" style="font-size:54px;color:#150C2B;line-height:1.1">${txt}</div></div>`;
  return at(p,0,`<div class="card" style="width:900px;padding:40px 50px"><div style="font-weight:700;font-size:30px;letter-spacing:8px;color:#8A82A8">BEFORE A REDESIGN</div>${row('Keep what people <span class="hl">recognise</span>',.35)}${row('Test it with <span class="hl">real customers</span>',.6)}</div>`,540,330)
  +at(p,.05,'<div style="font-size:120px">🖥️ 📱</div>',540,850)},
 // 11 CTA
 (p,t)=>at(p,0,'<div class="h" style="font-size:112px;color:#150C2B;text-align:center;width:980px">Familiar <span class="hl">beats</span><br>fancy.</div>',540,360)
  +at(p,.2,`<div style="display:flex;gap:40px;align-items:center"><div class="card" style="padding:26px 34px"><div style="width:150px;height:150px;border-radius:14px;background:#1B2A5E"></div><div class="h" style="font-size:36px;margin-top:14px;text-align:center">old</div></div><div class="h" style="font-size:70px;color:#6557E8">or</div><div class="card" style="padding:26px 34px"><div style="width:150px;height:150px;display:flex;align-items:center;justify-content:center;font-size:90px">🆕</div><div class="h" style="font-size:36px;margin-top:14px;text-align:center">new</div></div></div>`,540,640)
  +at(p,.62,'<div style="border-radius:999px;padding:26px 56px;font-size:52px;font-weight:800;white-space:nowrap;background:#6557E8;color:#fff;box-shadow:0 18px 40px rgba(101,87,232,.45)">+ Follow @nexaweb_dev</div>',540,1030),
];

function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 const modern=i>=MOD; document.body.className=modern?'modern':'';
 if(modern) BG.style.cssText=`background:radial-gradient(700px 600px at ${30+6*Math.sin(t*.3)}% 30%,rgba(185,166,255,.35),transparent 70%),radial-gradient(800px 700px at ${75+5*Math.cos(t*.25)}% 75%,rgba(101,87,232,.14),transparent 70%),linear-gradient(#FAF9FE,#EFECF8)`;
 else BG.style.cssText=`background-color:#1F7A7A;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:12px 12px;background-position:0 ${Math.floor(t*4)*2}px`;
 // progress: blocky in retro, smooth in modern
 const f=t/DATA.total; PR.innerHTML=modern?`<div style="height:100%;width:${f*100}%;background:#6557E8;border-radius:6px"></div>`:'<b></b>'.repeat(Math.floor(f*35));
 const zoom=1+0.025*p;
 const out=nx?clamp((t-(end-0.16))/0.16):0;S.innerHTML=`<div style="position:absolute;inset:0;opacity:${1-out};transform:scale(${zoom*(1+out*.04)}) translateY(${-out*24}px);transform-origin:540px 760px">${SC[i](p,t)}</div>`;
 // transitions: retro = brief dither flash; switch to modern = CRT power-off/on
 let fx='';
 if(false){const q=lt/.35;fx=`<div style="position:absolute;inset:0;background:#000;opacity:${1-ease(q)}"></div><div style="position:absolute;left:0;right:0;top:${960-480*(1-q)*0}px;height:${Math.max(6,1920*ease(q))}px;transform:translateY(-50%);background:#fff;opacity:${(1-q)*.9}"></div>`}
 else if(i>0&&lt<.1&&!modern) fx=`<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 3px,transparent 3px 9px)"></div>`;
 else if(i>0&&lt<.15) fx=`<div style="position:absolute;inset:0;background:rgba(185,166,255,${.25*(1-lt/.15)})"></div>`;
 FX.innerHTML=fx;
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop})">${w.w}</span>`}).join(' ');
};
window.fontsReady=document.fonts.load('40px VT').then(()=>document.fonts.ready);
</script></body></html>
