<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0A0616}
#bg,#orbs,#grid,#parts,#stage,#vig{position:absolute;inset:0}
#bg{background:radial-gradient(1200px 900px at 50% 35%,#1B1036 0%,#110A24 45%,#0A0616 100%)}
#grid{perspective:900px;overflow:hidden}
#floor{position:absolute;left:-600px;right:-600px;top:1150px;height:1400px;transform-origin:50% 0;transform:rotateX(72deg);
 background-image:linear-gradient(rgba(140,120,255,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(140,120,255,.22) 2px,transparent 2px);background-size:90px 90px;
 -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 75%)}
#vig{background:radial-gradient(1100px 1500px at 50% 45%,transparent 55%,rgba(5,2,12,.75) 100%);pointer-events:none}
.lab{position:absolute;left:0;right:0;top:300px;text-align:center;font-weight:700;font-size:30px;letter-spacing:10px;color:#B9A6FF}
.lab i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#8B7BFF;margin-right:16px;vertical-align:4px;box-shadow:0 0 0 6px rgba(139,123,255,.18),0 0 24px #8B7BFF}
.h{font-weight:800;letter-spacing:-.045em;line-height:.98;color:#fff}
.grad{background:linear-gradient(100deg,#fff 10%,#CFC3FF 50%,#8B7BFF 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{display:inline-block;background:linear-gradient(135deg,#7C6CFF,#5845E0);color:#fff;padding:0 .16em .05em;border-radius:.14em;box-shadow:0 10px 40px rgba(101,87,232,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1.5px solid rgba(185,166,255,.22);border-radius:36px;
 box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.2),0 0 80px rgba(101,87,232,.18),inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden;backdrop-filter:blur(18px)}
.mono{font-family:'DejaVu Sans Mono',monospace}
.chip{display:inline-block;border-radius:999px;padding:16px 34px;font-weight:700;font-size:38px;white-space:nowrap;background:rgba(139,123,255,.16);border:1.5px solid rgba(185,166,255,.35);color:#DCD3FF;box-shadow:0 0 40px rgba(101,87,232,.25)}
.bar{height:78px;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1.5px solid rgba(185,166,255,.14);background:rgba(255,255,255,.03)}
.bar s{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-block}
.url{margin-left:16px;flex:1;height:44px;border-radius:12px;background:rgba(0,0,0,.25);display:flex;align-items:center;padding:0 18px;font-size:24px;color:#9C92C8}
.muted{color:#9C92C8}
.ok{color:#4BE39A}
.bad{color:#FF5C7A}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.14;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#cap span{display:inline-block;margin:0 .1em}
#cap span.k{background:linear-gradient(135deg,#7C6CFF,#5845E0);color:#fff;padding:0 .12em .05em;border-radius:.12em;text-shadow:none;box-shadow:0 8px 30px rgba(101,87,232,.5)}
#tag{position:absolute;left:60px;top:232px;font-weight:700;font-size:26px;letter-spacing:5px;color:rgba(220,211,255,.55)}
#tag b{color:#8B7BFF}
#prog{position:absolute;left:60px;right:60px;top:276px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#prog i{display:block;height:100%;background:linear-gradient(90deg,#5845E0,#B9A6FF);box-shadow:0 0 12px #8B7BFF}
</style></head><body>
<div id="bg"></div><div id="orbs"></div><div id="grid"><div id="floor"></div></div><div id="parts"></div>
<div id="stage"></div><div id="vig"></div>
<div id="tag"><b>●</b> INTERNET STORIES · EP.4</div><div id="prog"><i></i></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const S=$('stage'),C=$('cap'),O=$('orbs'),P=$('parts'),F=$('floor'),PR=$('prog').firstChild;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6.5*x)*Math.cos(7.5*x)};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
// 3D entrance: rotateX flip-up + blur, then gentle float
function at(p,d,html,x,y,o={}){
 const s=spring((p-d)*3.2),e=ease((p-d)*4),tt=o.t||0;
 const fl=Math.sin((tt+d*7)*1.3)*(o.float??6);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${(1-s)*(o.dy??90)+fl}px) perspective(1400px) rotateX(${(1-s)*(o.rx??28)}deg) rotateZ(${(o.r||0)*(1-s)}deg) scale(${0.86+0.14*s});opacity:${clamp(e*1.6)};filter:blur(${(1-e)*14}px);transform-origin:50% 100%;${o.css||''}">${html}</div>`}
// moving light sweep over a card
const shine=(p,d=0)=>{const x=-60+clamp((p-d-.08)/.35)*220;return `<div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent ${x-18}%,rgba(255,255,255,.13) ${x}%,transparent ${x+18}%)"></div>`};
function lab(t,p){const e=ease(p*5);return `<div class="lab" style="opacity:${e};letter-spacing:${10+(1-e)*14}px"><i></i>${t}</div>`}
function typed(t,p,a,b){return t.slice(0,Math.floor(t.length*clamp((p-a)/(b-a))))}
const caret=t=>`<span style="display:inline-block;width:4px;height:1em;background:#B9A6FF;vertical-align:-.12em;box-shadow:0 0 10px #B9A6FF;opacity:${Math.floor(t*3)%2}"></span>`;
function browser(w,url,inner,p){return `<div class="glass" style="width:${w}px"><div class="bar"><s style="background:#FF5C7A"></s><s style="background:#FFC24B"></s><s style="background:#4BE39A"></s><div class="url mono">🔒 ${url}</div></div>${inner}${shine(p,0)}</div>`}
function search(q,res,p,t){return browser(900,'domains.google',`<div style="padding:46px"><div class="h" style="font-size:56px">Find your perfect domain</div><div style="margin-top:30px;border:2px solid rgba(185,166,255,.5);border-radius:20px;padding:22px 28px;font-size:46px;font-weight:700;background:rgba(0,0,0,.25);box-shadow:0 0 0 6px rgba(139,123,255,.12)" class="mono">${q}${res?'':caret(t)}</div>${res||''}</div>`,p)}
const RES=(s,t)=>`<div style="margin-top:30px;display:flex;align-items:center;justify-content:space-between;background:rgba(75,227,154,.08);border:1.5px solid rgba(75,227,154,.35);border-radius:22px;padding:24px 30px;transform:scale(${.9+.1*s});opacity:${clamp(s*2)};box-shadow:0 0 ${30+10*Math.sin(t*6)}px rgba(75,227,154,.25)"><div><div class="mono" style="font-size:40px;font-weight:700">google.com</div><div class="ok" style="font-size:32px;font-weight:700;margin-top:6px">● Available</div></div><div class="h" style="font-size:76px">$12</div></div>`;
function morph(p){const src='6,006.13'.split(''),L={0:'G',2:'O',3:'O',4:'G',6:'L',7:'E'};let h='',k=0;const m0=clamp((p-.6)/.1);
 src.forEach((c,i)=>{if(!(i in L)){h+=`<span style="display:inline-block;overflow:hidden;width:${(1-m0)*.6}em;opacity:${1-m0}">${c}</span>`;return}
  const m=clamp((p-.64-k*.035)/.12);k++;
  h+=`<span style="position:relative;display:inline-block;width:.62em;text-align:center"><span style="position:absolute;left:0;right:0;opacity:${1-m};filter:blur(${m*12}px);transform:translateY(${-m*30}px)">${c}</span><span class="grad" style="display:inline-block;opacity:${m};filter:blur(${(1-m)*12}px);transform:translateY(${(1-m)*30}px)">${L[i]}</span></span>`});return h}
function ring(x,y,p,d,col='139,123,255'){const q=clamp((p-d)/.35);return q<=0||q>=1?'':`<div style="position:absolute;left:${x}px;top:${y}px;width:${200+700*ease(q)}px;height:${200+700*ease(q)}px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(${col},${.7*(1-q)});box-shadow:0 0 40px rgba(${col},${.5*(1-q)})"></div>`}
const SC=[
 // 0 hook
 (p,t)=>lab('DID YOU KNOW',p)+ring(540,820,p,.55,'255,92,122')+at(p,0,'<div class="h" style="font-size:128px;text-align:left;width:940px">Amazon\'s<br>first name<br>sounded like a</div>',80,400,{c:false,t})
   +at(p,.5,'<div class="h" style="font-size:150px;white-space:nowrap"><span class="box" style="background:linear-gradient(135deg,#FF5C7A,#D9324F);box-shadow:0 10px 40px rgba(255,92,122,.55)">dead body.</span></div>',80,830,{c:false,r:-4,t}),
 // 1 Cadabra registration
 (p,t)=>lab('JULY 1994',p)+at(p,0,`<div class="glass" style="width:880px;padding:50px 56px"><div class="muted" style="font-size:28px;font-weight:700;letter-spacing:8px">NEW COMPANY</div><div class="h" style="font-size:52px;margin-top:14px">Business registration</div><div style="border-top:2px dashed rgba(185,166,255,.3);margin:28px 0"></div><div class="muted" style="font-size:30px;font-weight:700">Company name</div><div class="h mono" style="font-size:84px;letter-spacing:-3px;margin-top:6px">${typed('Cadabra, Inc.',p,.62,.82)}${p<.84?caret(t):''}</div><div class="muted" style="font-size:30px;font-weight:700;margin-top:22px">Business</div><div style="font-size:44px;font-weight:700;margin-top:4px">Online bookstore 📚</div>${shine(p)}</div>`,540,380,{t})
   +at(p,.88,'<div class="chip">✓ registered</div>',540,1080,{r:-3,t}),
 // 2 abracadabra
 (p,t)=>{let sp='';for(let k=0;k<14;k++){const a=k/14*6.28+t*.6,r=330+40*Math.sin(t*2+k),s=clamp((p-.3)*3);sp+=`<div style="position:absolute;left:${540+Math.cos(a)*r*s}px;top:${700+Math.sin(a)*r*.6*s}px;font-size:${30+20*rnd(k)}px;opacity:${s*(.5+.5*Math.sin(t*4+k))};transform:translate(-50%,-50%)">✨</div>`}
  return lab('THE IDEA',p)+sp+at(p,0,'<div class="h" style="font-size:120px;white-space:nowrap"><span class="muted">abra</span><span class="grad">cadabra</span></div>',540,560,{t})
   +at(p,.45,'<div class="chip" style="font-size:46px">🪄 like magic</div>',540,900,{r:3,t})},
 // 3 phone call, cadaver?
 (p,t)=>{const g=p>.72&&p<.85?Math.sin(t*90)*12:0;let bars='';for(let k=0;k<26;k++){const h=10+60*Math.abs(Math.sin(t*9+k*.7))*(.4+.6*rnd(k));bars+=`<i style="display:inline-block;width:10px;margin:0 4px;height:${h}px;border-radius:5px;background:#8B7BFF;vertical-align:middle"></i>`}
  const sec=Math.floor(12+p*20);
  return lab('A PHONE CALL',p)+at(p,0,`<div class="glass" style="width:860px;padding:40px 46px;text-align:center"><div style="display:flex;align-items:center;gap:24px"><div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#7C6CFF,#5845E0);display:flex;align-items:center;justify-content:center;font-size:46px">📞</div><div style="text-align:left"><div style="font-size:42px;font-weight:800">His lawyer</div><div class="ok mono" style="font-size:30px;font-weight:700">● 00:${String(sec).padStart(2,'0')}</div></div></div><div style="margin-top:26px;height:80px">${bars}</div>${shine(p)}</div>`,540,330,{t})
   +at(p,.12,'<div class="glass" style="padding:26px 40px;border-radius:40px 40px 40px 8px;font-size:52px;font-weight:800;white-space:nowrap">"It\'s called Cadabra."</div>',90,760,{c:false,t})
   +at(p,.7,`<div class="glass" style="padding:26px 44px;border-radius:40px 40px 8px 40px;border-color:rgba(255,92,122,.6);box-shadow:0 0 70px rgba(255,92,122,.4);white-space:nowrap"><span class="h" style="font-size:110px;color:#FF5C7A;text-shadow:${g}px 0 0 rgba(0,255,255,.7),${-g}px 0 0 rgba(255,0,120,.7)">"Cadaver?"</span></div>`,990,960,{c:false,r:4,t,css:'translate:-100% 0'})},
 // 4 definition: dead body
 (p,t)=>lab('THE PROBLEM',p)+at(p,0,`<div class="glass" style="width:880px;padding:54px 60px"><div class="h" style="font-size:96px">ca·dav·er</div><div style="font-family:Lora;font-style:italic;font-size:42px;color:#B9A6FF;margin-top:8px">noun</div><div style="font-size:60px;font-weight:700;margin-top:26px">a dead body. 💀</div>${shine(p)}</div>`,540,370,{t})
   +at(p,.5,`<div style="position:relative;display:inline-block"><span class="h mono" style="font-size:96px;color:#9C92C8">Cadabra</span><div style="position:absolute;left:-10px;right:-10px;top:52%;height:12px;border-radius:6px;background:#FF5C7A;transform:scaleX(${ease((p-.55)*5)});transform-origin:0 50%;box-shadow:0 0 20px #FF5C7A"></div></div>`,540,860,{t})
   +at(p,.6,'<div class="h" style="font-size:44px;padding:14px 30px;border:6px solid #FF5C7A;color:#FF5C7A;border-radius:16px;letter-spacing:4px;white-space:nowrap">NOT GREAT FOR A SHOP</div>',540,1030,{r:-6,t,dy:-60}),
 // 5 relentless.com registered
 (p,t)=>{const s=spring((p-.6)*3);return lab('PLAN B',p)+at(p,0,browser(900,'domain-search',`<div style="padding:46px"><div class="h" style="font-size:56px">Find a web address</div><div style="margin-top:30px;border:2px solid rgba(185,166,255,.5);border-radius:20px;padding:22px 28px;font-size:52px;font-weight:700;background:rgba(0,0,0,.25)" class="mono">${typed('relentless.com',p,.2,.55)}${p<.58?caret(t):''}</div><div style="margin-top:30px;display:flex;align-items:center;justify-content:space-between;background:rgba(75,227,154,.08);border:1.5px solid rgba(75,227,154,.35);border-radius:22px;padding:24px 30px;transform:scale(${.9+.1*s});opacity:${clamp(s*2)}"><div class="mono" style="font-size:42px;font-weight:700">relentless.com</div><div class="ok" style="font-size:38px;font-weight:800">✓ Registered</div></div></div>`,p),540,380,{t})
   +at(p,.7,'<div class="chip" style="font-size:44px">Relentless? 🤔</div>',540,1050,{r:3,t})},
 // 6 Amazon in the dictionary, river
 (p,t)=>{const d=clamp((p-.45)/.4);return lab('THE DICTIONARY',p)+at(p,0,`<div class="glass" style="width:880px;padding:50px 60px"><div class="h" style="font-size:110px">Am·a·zon</div><div style="font-family:Lora;font-style:italic;font-size:42px;color:#B9A6FF;margin-top:6px">noun</div><div style="font-size:50px;font-weight:700;margin-top:22px;white-space:nowrap">the biggest river in the world 🌊</div>${shine(p)}</div>`,540,360,{t})
   +`<svg width="1080" height="420" style="position:absolute;left:0;top:900px;opacity:${clamp(d*3)}"><defs><linearGradient id="rv" x1="0" x2="1"><stop offset="0" stop-color="#5845E0"/><stop offset="1" stop-color="#B9A6FF"/></linearGradient></defs><path d="M60 300 C 200 120, 330 380, 470 220 S 720 60, 820 210 S 980 260, 1020 120" fill="none" stroke="url(#rv)" stroke-width="34" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="${1500*(1-ease(d))}" style="filter:drop-shadow(0 0 18px #8B7BFF)"/></svg>`},
 // 7 alphabetical list
 (p,t)=>{const names=['Amazon','Bookmart','City Reads','Downtown Books','Easy Pages'];let rows='';names.forEach((n,i)=>{const s=spring((p-.15-i*.07)*3.2),top=i==0;rows+=`<div style="display:flex;align-items:center;gap:26px;padding:22px 30px;margin-top:14px;border-radius:20px;transform:translateX(${(1-s)*120}px);opacity:${clamp(s*2)};${top?'background:linear-gradient(135deg,#7C6CFF,#5845E0);box-shadow:0 14px 50px rgba(101,87,232,.55)':'background:rgba(255,255,255,.05)'}"><span class="mono" style="font-size:40px;font-weight:700;width:50px;color:${top?'#fff':'#9C92C8'}">${n[0]}</span><span style="font-size:48px;font-weight:${top?800:600};color:${top?'#fff':'#B5ACD9'}">${n}</span>${top?'<span style="margin-left:auto;font-size:36px;font-weight:800">#1</span>':''}</div>`});
  return lab('A TO Z',p)+at(p,0,`<div class="glass" style="width:860px;padding:36px 40px 50px"><div class="muted" style="font-size:30px;font-weight:700;letter-spacing:6px">STORE LISTINGS · A TO Z</div>${rows}</div>`,540,340,{t,float:3})
   +ring(540,520,p,.15)+at(p,.6,'<div class="h" style="font-size:88px;white-space:nowrap"><span class="box">starts with A</span></div>',540,1060,{r:-3,t})},
 // 8 relentless.com still redirects
 (p,t)=>{const r=p>.62,ty=typed('relentless.com',p,.12,.42);return lab('STILL TODAY',p)+at(p,0,`<div class="glass" style="width:900px"><div class="bar"><s style="background:#FF5C7A"></s><s style="background:#FFC24B"></s><s style="background:#4BE39A"></s><div class="url mono" style="font-size:30px;color:#fff">${r?'🔒 amazon.com':ty+(p<.45?caret(t):'')}</div></div><div style="padding:50px;text-align:center;height:420px">${p<.5?'':r?`<div class="h mono" style="font-size:90px;opacity:${clamp((p-.62)*6)}">amazon.com</div><div style="margin:30px auto 0;width:70%;height:22px;border-radius:10px;background:rgba(255,255,255,.08)"></div><div style="margin:14px auto 0;width:50%;height:22px;border-radius:10px;background:rgba(255,255,255,.08)"></div>`:`<div style="margin:120px auto;width:80px;height:80px;border-radius:50%;border:8px solid rgba(185,166,255,.2);border-top-color:#B9A6FF;transform:rotate(${t*600}deg)"></div>`}</div>${shine(p,.62)}</div>`,540,360,{t})
   +ring(540,620,p,.62,'75,227,154')+at(p,.66,'<div class="chip" style="font-size:46px;background:rgba(75,227,154,.12);border-color:rgba(75,227,154,.45);color:#B8F5D6">↪ sent straight to Amazon</div>',540,1000,{r:-3,t})},
 // 9 lesson: say it out loud
 (p,t)=>lab('THE LESSON',p)+at(p,0,'<div style="font-size:150px;line-height:1">🗣️</div>',540,360,{t})
   +at(p,.12,'<div class="h" style="font-size:112px;text-align:left;width:920px">say your name</div>',80,600,{c:false,t})
   +at(p,.32,'<div class="h" style="font-size:112px"><span class="box">out loud</span></div>',80,730,{c:false,r:-3,t})
   +at(p,.6,'<div class="h" style="font-size:66px;text-align:left;width:920px;color:#B9A6FF">before you buy the domain.</div>',80,930,{c:false,t}),
 // 10 misheard -> can't find you
 (p,t)=>lab('THE PHONE TEST',p)+at(p,0,'<div class="glass" style="width:860px;padding:34px 44px;display:flex;align-items:center;gap:26px"><span style="font-size:60px">🗣️</span><div><div class="muted" style="font-size:30px;font-weight:700">You say</div><div class="mono" style="font-size:52px;font-weight:700">cadabra.com</div></div></div>',540,370,{t})
   +at(p,.2,'<div class="glass" style="width:860px;padding:34px 44px;display:flex;align-items:center;gap:26px;border-color:rgba(255,92,122,.5);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 60px rgba(255,92,122,.3)"><span style="font-size:60px">👂</span><div><div class="muted" style="font-size:30px;font-weight:700">They type</div><div class="mono bad" style="font-size:52px;font-weight:700">cadaver.com</div></div></div>',540,600,{t})
   +ring(540,960,p,.55,'255,92,122')+at(p,.55,'<div class="h" style="font-size:96px;color:#FF5C7A;white-space:nowrap">✕ can\'t find you</div>',540,900,{r:-4,t}),
 // 11 CTA checklist + follow
 (p,t)=>{const items=['Easy to spell?','Sounds like one thing?','No weird meaning?'];let h='';items.forEach((x,i)=>{const on=p>.12+i*.1;h+=`<div style="display:flex;align-items:center;gap:24px;margin-top:22px"><span style="width:64px;height:64px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;${on?'background:#2BC77F;box-shadow:0 0 30px rgba(75,227,154,.6)':'border:3px solid rgba(185,166,255,.4)'}">${on?'✓':''}</span><span style="font-size:50px;font-weight:700">${x}</span></div>`});
  return lab('DOES YOUR NAME PASS?',p)+at(p,0,`<div class="glass" style="width:860px;padding:44px 54px 54px"><div class="h" style="font-size:64px">📞 The phone test</div>${h}${shine(p,.3)}</div>`,540,360,{t})
  +at(p,.5,'<div class="glass" style="border-radius:999px;padding:26px 54px;font-size:50px;font-weight:800;white-space:nowrap;background:linear-gradient(135deg,#7C6CFF,#5845E0);border-color:rgba(255,255,255,.3);box-shadow:0 20px 60px rgba(101,87,232,.6)">+ Follow @nexaweb_dev</div>',540,1010,{t})},
];

function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 // background motion
 O.innerHTML=[[30,22,'101,87,232',.55,900],[78,60,'139,80,255',.38,800],[20,80,'60,120,255',.25,700]].map(([x,y,c,a,r],k)=>{const X=x+8*Math.sin(t*.25+k*2),Y=y+6*Math.cos(t*.2+k);return `<div style="position:absolute;left:${X}%;top:${Y}%;width:${r}px;height:${r}px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(${c},${a}),transparent 65%);filter:blur(30px)"></div>`}).join('');
 F.style.backgroundPosition=`0 ${(t*40)%90}px`;
 let ph='';for(let k=0;k<38;k++){const x=rnd(k)*1080,sp=10+rnd(k+50)*30,y=(1920-((rnd(k+9)*1920+t*sp)%1920)),sz=2+rnd(k+3)*4,a=.15+.5*rnd(k+7)*(.6+.4*Math.sin(t*2+k));ph+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-radius:50%;background:#CFC3FF;opacity:${a};box-shadow:0 0 ${sz*3}px #8B7BFF"></div>`}
 P.innerHTML=ph;
 PR.style.width=(100*t/DATA.total)+'%';
 const out=nx?clamp((t-(end-0.16))/0.16):0, inn=ease(lt/0.3), zoom=1+0.03*p;
 S.innerHTML=`<div style="position:absolute;inset:0;opacity:${inn*(1-out)};transform:scale(${zoom*(1+out*.06)}) translateY(${-out*30}px);transform-origin:540px 760px;filter:blur(${(1-inn)*10+out*12}px)">${SC[i](p,t)}</div>`
  +(lt<.18&&i>0?`<div style="position:absolute;inset:0;background:radial-gradient(800px 600px at 50% 40%,rgba(139,123,255,${.22*(1-lt/.18)}),transparent 70%)"></div>`:'');
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop}) translateY(${on?(1-ease(a/0.15))*14:0}px)">${w.w}</span>`}).join(' ');
};
</script></body></html>
