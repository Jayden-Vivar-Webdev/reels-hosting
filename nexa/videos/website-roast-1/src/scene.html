<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Rock Salt';src:url(fonts/RockSalt-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans','Inter',sans-serif;color:#150C2B;background:#FAF9F6}
#stage{position:absolute;inset:0}
.I{color:#6557E8}
.lab{position:absolute;left:0;right:0;top:285px;text-align:center;font-weight:800;font-size:34px;letter-spacing:8px;color:#6557E8}
.h{font-weight:800;letter-spacing:-.045em;line-height:1;color:#150C2B}
.box{display:inline-block;background:#6557E8;color:#fff;padding:0 .14em .06em;border-radius:.12em}
.lav{display:inline-block;background:#B9A6FF;color:#150C2B;padding:0 .14em .06em;border-radius:.12em}
.card{background:#fff;border-radius:34px;box-shadow:0 30px 60px rgba(21,12,43,.13);border:2px solid rgba(21,12,43,.07)}
.chip{display:inline-block;background:#150C2B;color:#fff;border-radius:999px;padding:18px 40px;font-weight:800;font-size:44px;white-space:nowrap}
.stamp{display:inline-block;border:8px solid #E5484D;color:#E5484D;border-radius:20px;padding:4px 30px 10px;font-weight:800;font-size:90px;letter-spacing:3px;background:rgba(250,249,246,.92);white-space:nowrap}
.bar{height:20px;border-radius:10px;background:#ECEAF3}
.dv{font-family:'Times New Roman','DejaVu Serif',serif}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:82px;letter-spacing:-.04em;line-height:1.14}
#cap span{display:inline-block;margin:0 .1em}
#cap span.k{background:#6557E8;color:#fff;padding:0 .12em .05em;border-radius:.12em}
#tag{position:absolute;left:870px;top:214px;font-weight:800;font-size:44px;letter-spacing:-2px}
#ser{position:absolute;left:90px;top:228px;font-weight:700;font-size:28px;letter-spacing:4px;color:rgba(21,12,43,.45)}
</style></head><body>
<div id="stage"></div>
<div id="ser">WEBSITE ROAST</div>
<div id="tag">nexa<span class="I">.</span></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const S=document.getElementById('stage'),C=document.getElementById('cap');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const spring=x=>{x=clamp(x);return 1-Math.exp(-7*x)*Math.cos(8*x)};
function at(p,d,html,x,y,o={}){const s=spring((p-d)*3.4),ty=(1-s)*(o.dy??60);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${ty}px) scale(${0.9+0.1*s}) rotate(${(o.r||0)*(1-s)+(o.rr||0)}deg);opacity:${clamp(s*2.5)};${o.css||''}">${html}</div>`}
function browser(w,h,inner,url='davespoolcare.com.au'){return `<div class="card" style="position:relative;width:${w}px;height:${h}px;overflow:hidden"><div style="height:64px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:2px solid #EEECF4;background:#fff"><s style="width:16px;height:16px;border-radius:50%;background:#E5484D"></s><s style="width:16px;height:16px;border-radius:50%;background:#ECEAF3"></s><s style="width:16px;height:16px;border-radius:50%;background:#ECEAF3"></s><span style="margin-left:18px;font-size:23px;color:#8F8AA3;background:#F4F3F8;border-radius:12px;padding:6px 22px">${url}</span></div>${inner}</div>`}
function cursor(x,y,click=0){return `<div style="position:absolute;left:${x}px;top:${y}px;z-index:9;transform:scale(${1-0.15*click})"><svg width="60" height="72" viewBox="0 0 30 36"><path d="M2 2 L2 28 L9 21 L14 33 L19 31 L14 19 L24 19 Z" fill="#150C2B" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>`}
// ---------- Dave's Pool Care (made-up, deliberately dated) ----------
const NAV11=['Home','About','About Dave','Services','Pool Cleaning','Repairs','Gallery','Blog','FAQs','Testimonials','Contact'];
function pool(w,h,t,murky=0){ // drawn pool water with moving caustics
 const c1=murky?'#5E7A3A':'#14A7E0',c2=murky?'#3D5426':'#0B6FB8';let waves='';
 for(let i=0;i<7;i++){const y=(i*h/6+((t*22)%(h/6)));waves+=`<path d="M0 ${y} Q ${w*.25} ${y-14} ${w*.5} ${y} T ${w} ${y}" stroke="rgba(255,255,255,${murky?.08:.35})" stroke-width="5" fill="none"/>`}
 return `<div style="position:relative;width:${w}px;height:${h}px;background:linear-gradient(160deg,${c1},${c2});overflow:hidden"><svg width="${w}" height="${h}" style="position:absolute;inset:0">${waves}</svg>${murky?'':`<div style="position:absolute;left:${w*.12}px;top:${h*.18}px;font-size:54px;opacity:${.6+.4*Math.sin(t*5)}">✨</div><div style="position:absolute;left:${w*.72}px;top:${h*.55}px;font-size:44px;opacity:${.6+.4*Math.sin(t*4+2)}">✨</div>`}</div>`}
function busy(w,h){ // loud tiled background photo stand-in
 return `<div style="position:absolute;inset:0;width:${w}px;height:${h}px;background:repeating-linear-gradient(45deg,#2BB3E8 0 26px,#F7D84A 26px 52px,#7FD4F5 52px 78px,#ffffff 78px 104px)"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.55),transparent 60%)"></div>`}
function daveHeader(navN=11,small=true){const nav=NAV11.slice(0,navN).map(n=>`<span style="margin:2px 9px;white-space:nowrap">${n}</span>`).join('|');
 return `<div style="background:#00A3D9;padding:14px 24px 10px;border-bottom:6px solid #F7D84A"><div style="font-family:'Rock Salt';color:#F7D84A;font-size:38px;text-shadow:3px 3px 0 #0A4F7A;line-height:1.3">Dave's Pool Care</div><div class="dv" style="color:#fff;font-size:${small?19:24}px;margin-top:6px;line-height:1.5;text-decoration:underline">${nav}</div></div>`}
function daveSite(w,h,t,o={}){
 const hero=o.hand?handshake(w,300):`<div style="position:relative;height:300px;overflow:hidden">${busy(w,300)}<div class="dv" style="position:absolute;left:30px;top:70px;width:${w-60}px;color:#D9D9D9;font-size:44px;font-style:italic;line-height:1.15">Welcome to our website!! Professional pool care since 1998</div></div>`;
 return browser(w,h,daveHeader(11)+hero+`<div class="dv" style="padding:24px 30px;font-size:24px;color:#555;line-height:1.4">Click <u style="color:#00f">here</u> to learn more about our services. Best viewed in 1024x768.<div style="margin-top:18px;display:inline-block;background:#DADADA;border:2px outset #eee;padding:8px 26px;color:#333">Submit</div></div>`)}
function handshake(w,h){let wm='';for(let i=0;i<6;i++)wm+=`<div style="position:absolute;left:${(i%3)*w/3+20}px;top:${Math.floor(i/3)*h/2+40}px;transform:rotate(-25deg);font-weight:800;font-size:40px;color:rgba(255,255,255,.55);letter-spacing:4px">STOCK</div>`;
 return `<div style="position:relative;width:${w}px;height:${h}px;background:linear-gradient(135deg,#9AA5B1,#D5DBE1);overflow:hidden;display:flex;align-items:center;justify-content:center"><div style="font-size:${h*.62}px;filter:grayscale(.3)">🤝</div>${wm}</div>`}
function notes(t,x,y){let h='';for(let i=0;i<6;i++){const a=((t*0.9+i/6)%1);h+=`<div style="position:absolute;left:${x+Math.sin(a*6+i)*90+i*20-60}px;top:${y-a*420}px;font-size:${60+i%3*14}px;color:#6557E8;opacity:${1-a};transform:rotate(${(i%2?1:-1)*a*40}deg)">${i%2?'♪':'♫'}</div>`}return h}
function lab(t){return `<div class="lab">${t}</div>`}
const SC=[
 // 0 hook: ugly site, 3-2-1 then tab closes
 (p,t)=>{const k=Math.min(3,1+Math.floor(p*3.6)),cl=p>.82;return at(p,0,daveSite(880,760,t),540,330,{r:-2})
  +at(p,.1,`<div class="chip" style="background:#E5484D;font-size:52px">closing tab in ${cl?'0':4-k}…</div>`,540,1130,{r:2})
  +cursor(900-80*ease((p-.4)*3),720-330*ease((p-.4)*3),cl?1:0)
  +(cl?at(p,.82,'<div class="h" style="font-size:150px;background:#FAF9F6;padding:6px 40px 20px;border-radius:30px;box-shadow:0 24px 50px rgba(21,12,43,.18);white-space:nowrap">roast 🔥</div>',540,620,{r:-4}):'')},
 // 1 meet Dave's
 (p,t)=>at(p,0,daveSite(880,760,t),540,330,{r:2,rr:1})
  +at(p,.3,'<div class="chip" style="background:#6557E8">made-up business</div>',330,1130,{r:-3})
  +at(p,.55,'<div class="chip">but you\'ve seen it 👀</div>',700,1010,{r:3}),
 // 2 roast 01 autoplay music
 (p,t)=>lab('ROAST 01')+at(p,0,daveSite(820,700,t),540,350,{r:-2})
  +at(p,.15,`<div style="width:190px;height:190px;border-radius:50%;background:#150C2B;color:#fff;font-size:100px;display:flex;align-items:center;justify-content:center;transform:scale(${1+.08*Math.sin(t*14)})">🔊</div>`,820,880)
  +notes(t,800,900)+at(p,.5,'<div class="stamp">AUTOPLAY</div>',360,1000,{r:-30,rr:-8,css:'z-index:5'}),
 // 3 saxophone + browsers block
 (p,t)=>at(p,0,`<div style="position:relative;width:420px;height:420px;border-radius:50%;background:#fff;box-shadow:0 30px 60px rgba(21,12,43,.13);display:flex;align-items:center;justify-content:center;font-size:250px">🎷<div style="position:absolute;right:0;top:10px;width:130px;height:130px;border-radius:50%;background:#E5484D;color:#fff;font-size:90px;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:${clamp((p-.25)*5)}">✕</div></div>`,540,330,{r:-6,rr:-3})
  +at(p,.45,'<div class="card" style="padding:30px 46px;font-weight:800;font-size:50px;white-space:nowrap">🔇 most browsers block it</div>',540,860,{r:2}),
 // 4 roast 02 eleven links
 (p,t)=>{const n=Math.max(1,Math.min(11,Math.ceil(clamp((p-.05)/.35)*11)));return lab('ROAST 02')+at(p,0,browser(880,520,`<div style="background:#00A3D9;padding:22px 26px;border-bottom:6px solid #F7D84A;height:456px"><div style="font-family:'Rock Salt';color:#F7D84A;font-size:42px;text-shadow:3px 3px 0 #0A4F7A">Dave's Pool Care</div><div class="dv" style="color:#fff;font-size:40px;line-height:1.55;margin-top:14px;text-decoration:underline">${NAV11.slice(0,n).map(x=>`<span style="white-space:nowrap;margin-right:22px">${x}</span>`).join(' ')}</div></div>`),540,350,{r:-1})
  +at(p,.2,`<div style="width:220px;height:220px;border-radius:50%;background:#E5484D;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:110px;line-height:1">${n}<span style="font-size:30px;letter-spacing:3px">LINKS</span></div>`,860,920,{r:8})},
 // 5 fix: five or six
 (p,t)=>{const it=['Services','Pricing','Gallery','About'];return lab('THE FIX')+at(p,0,browser(880,560,`<div style="display:flex;align-items:center;padding:30px 36px;border-bottom:2px solid #EEECF4"><div style="font-weight:800;font-size:40px;letter-spacing:-1px;color:#0B6FB8">Dave's<span style="color:#150C2B"> Pool Care</span></div></div><div style="display:flex;flex-wrap:wrap;gap:16px;padding:36px">${it.map((x,i)=>`<div style="font-weight:700;font-size:40px;padding:16px 26px;border-radius:16px;background:#F4F3F8;opacity:${clamp((p-.1-i*.08)*5)}">${x}</div>`).join('')}<div style="font-weight:800;font-size:40px;padding:16px 30px;border-radius:16px;background:#6557E8;color:#fff;opacity:${clamp((p-.45)*5)}">Get a quote</div></div>${pool(880,170,t)}`),540,350,{r:1})
  +at(p,.6,'<div class="chip" style="background:#6557E8">✓ five or six links max</div>',540,1010,{r:-2})},
 // 6 roast 03 grey on busy
 (p,t)=>{const mx=300+380*ease((p-.2)*1.6);return lab('ROAST 03')+at(p,0,`<div class="card" style="position:relative;width:880px;height:600px;overflow:hidden">${busy(880,600)}<div class="dv" style="position:absolute;left:50px;top:150px;width:780px;color:#D9D9D9;font-size:70px;font-style:italic;line-height:1.15">Professional pool care since 1998. Call today!</div></div>`,540,350,{r:-2})
  +`<div style="position:absolute;left:${mx}px;top:${560+40*Math.sin(t*3)}px;width:230px;height:230px;border-radius:50%;border:16px solid #150C2B;background:rgba(255,255,255,.15);box-shadow:0 20px 40px rgba(21,12,43,.3)"></div><div style="position:absolute;left:${mx+180}px;top:${760+40*Math.sin(t*3)}px;width:36px;height:150px;border-radius:18px;background:#150C2B;transform:rotate(-40deg);transform-origin:top"></div>`
  +at(p,.6,'<div class="stamp" style="font-size:80px">CAN\'T READ IT</div>',540,1040,{r:-6,rr:-4})},
 // 7 squint -> before/after
 (p,t)=>lab('BEFORE / AFTER')+at(p,0,`<div class="card" style="position:relative;width:420px;height:560px;overflow:hidden">${busy(420,560)}<div class="dv" style="position:absolute;left:30px;top:150px;width:360px;color:#D9D9D9;font-size:52px;font-style:italic">Professional pool care since 1998</div></div>`,300,350,{r:-4,rr:-3})
  +at(p,.3,`<div class="card" style="width:420px;height:560px;padding:50px 36px;background:#fff"><div class="h" style="font-size:62px">Pool cleaning that just works.</div><div style="font-size:30px;color:#4A4560;margin-top:24px;font-weight:500">Weekly service. No lock-in.</div><div style="display:inline-block;margin-top:34px;background:#6557E8;color:#fff;font-weight:800;font-size:32px;padding:18px 30px;border-radius:16px">Get a quote</div></div>`,780,350,{r:4,rr:3})
  +at(p,.05,'<div style="font-size:120px">😑</div>',300,950)+at(p,.4,'<div style="font-size:120px">🙂</div>',780,950),
 // 8 roast 04 handshake
 (p,t)=>lab('ROAST 04')+at(p,0,`<div class="card" style="overflow:hidden">${handshake(860,600)}</div>`,540,350,{r:2})
  +at(p,.5,'<div class="stamp" style="font-size:72px">SEEN IT 1000x</div>',540,1010,{r:-20,rr:-5}),
 // 9 real work: murky -> sparkling slider
 (p,t)=>{const x=860*(1-0.55*ease((p-.15)*1.8));return lab('SHOW YOUR REAL WORK')+at(p,0,`<div class="card" style="position:relative;width:860px;height:620px;overflow:hidden"><div style="position:absolute;inset:0">${pool(860,620,t,0)}</div><div style="position:absolute;left:0;top:0;bottom:0;width:${x}px;overflow:hidden">${pool(860,620,t,1)}</div><div style="position:absolute;left:${x-4}px;top:0;bottom:0;width:8px;background:#fff"></div><div style="position:absolute;left:24px;top:24px" class="chip">before</div><div style="position:absolute;right:24px;top:24px;background:#6557E8" class="chip">after</div></div>`,540,350,{r:-1})
  +at(p,.6,'<div class="chip" style="background:#6557E8">✓ your work, not stock</div>',540,1040,{r:2})},
 // 10 roast 05 submit button
 (p,t)=>lab('ROAST 05')+at(p,0,`<div class="card" style="width:820px;padding:50px 56px"><div style="font-weight:700;font-size:34px;color:#8F8AA3">Name</div><div style="height:70px;border:2px solid #DDD;border-radius:12px;margin:10px 0 26px"></div><div style="font-weight:700;font-size:34px;color:#8F8AA3">Phone</div><div style="height:70px;border:2px solid #DDD;border-radius:12px;margin:10px 0 36px"></div><div class="dv" style="display:inline-block;background:#DADADA;border:3px outset #eee;padding:16px 50px;font-size:44px;color:#333">Submit</div></div>`,540,350,{r:-2})
  +cursor(420-60*ease(p*2),1000-170*ease(p*2))+at(p,.5,'<div style="width:150px;height:150px;border-radius:50%;background:#E5484D;color:#fff;font-weight:800;font-size:100px;text-align:center;line-height:146px">?</div>',780,860,{r:10}),
 // 11 fix: Get my free quote
 (p,t)=>{const m=p>.45,cl=clamp((p-.72)/.1);return lab('THE FIX')+at(p,0,`<div class="card" style="width:820px;padding:50px 56px"><div style="font-weight:700;font-size:34px;color:#8F8AA3">Name</div><div style="height:70px;border:2px solid #DDD;border-radius:12px;margin:10px 0 26px"></div><div style="font-weight:700;font-size:34px;color:#8F8AA3">Phone</div><div style="height:70px;border:2px solid #DDD;border-radius:12px;margin:10px 0 36px"></div>${m?`<div style="display:inline-block;background:#6557E8;color:#fff;font-weight:800;font-size:46px;padding:24px 50px;border-radius:20px;transform:scale(${1-0.05*cl});box-shadow:0 16px 30px rgba(101,87,232,.35)">Get my free quote →</div>`:'<div class="dv" style="display:inline-block;background:#DADADA;border:3px outset #eee;padding:16px 50px;font-size:44px;color:#333">Submit</div>'}</div>`,540,350,{r:1})
  +cursor(560-100*ease(p*1.5),1030-150*ease(p*1.5),cl)+(p>.75?at(p,.75,'<div class="chip" style="background:#3C8A4A">✓ Quote request sent</div>',540,1010,{r:-2}):'')},
 // 12 CTA
 (p,t)=>{const it=['🎷 autoplay music','📋 eleven links','🔍 grey on busy','🤝 handshake photo','🔘 Submit button'];let h='';it.forEach((x,i)=>{const s=spring(p*3.6-i*.3);h+=`<div style="display:flex;align-items:center;gap:22px;margin:14px 0;font-weight:800;font-size:48px;opacity:${clamp(s*2)};transform:translateX(${(1-s)*-50}px)"><span style="width:52px;height:52px;border-radius:14px;border:5px solid #6557E8;display:inline-block;flex:none"></span>${x}</div>`});
  return lab('SEEN ONE IN THE WILD?')+at(p,0,`<div class="card" style="width:820px;padding:40px 60px">${h}</div>`,540,340)+at(p,.55,'<div class="chip" style="font-size:52px;padding:26px 56px">+ Follow <span style="color:#B9A6FF">@nexaweb_dev</span></div>',540,1000,{r:-2})},
];
function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 const out=nx?clamp((t-(end-0.14))/0.14):0, inn=ease(lt/0.25);
 S.innerHTML=`<div style="position:absolute;inset:0;transform-origin:520px 330px;transform:scale(1.1)"><div style="position:absolute;inset:0;opacity:${inn*(1-out)};transform:translateY(${-out*40}px);filter:blur(${(1-inn)*8+out*8}px)">${SC[i](p,t)}</div></div>`;
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 const nc=ch.words.map(w=>w.w).join(' ').length;C.style.fontSize=(nc>26?70:82)+'px';
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop})">${w.w}</span>`}).join(' ');
};
</script></body></html>
