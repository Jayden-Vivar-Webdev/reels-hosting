<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#150C2B;background:#FAF9F7}
#bg,#stage,#fx{position:absolute;inset:0}
.h{font-weight:800;letter-spacing:-.04em;line-height:1}
.card{position:relative;background:#fff;border-radius:34px;box-shadow:0 24px 60px rgba(21,12,43,.10),0 0 0 2px rgba(21,12,43,.06);text-align:left}
.pill{display:inline-block;border-radius:999px;padding:16px 34px;font-weight:700;font-size:40px;white-space:nowrap;background:#ECE8FF;color:#3B2FA8}
.hl{background:#B9A6FF;padding:0 .1em;border-radius:.1em}
.lab{font-weight:700;font-size:28px;letter-spacing:6px;color:#8A82A8}
.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:-.02em}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.14}
#cap span{display:inline-block;margin:0 .1em;color:#150C2B}
#cap span.k{color:#fff;background:#6557E8;padding:0 .12em .04em;border-radius:.12em}
#tag{position:absolute;left:60px;top:236px;font-weight:800;font-size:30px;letter-spacing:5px;color:#6557E8}
</style></head><body>
<div id="bg"></div><div id="stage"></div><div id="fx"></div>
<div id="cap"></div><div id="tag">WEBSITE TIP · EMAIL</div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const S=$('stage'),C=$('cap'),BG=$('bg'),FX=$('fx');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6.5*x)*Math.cos(7.5*x)};
function at(p,d,html,x,y,o={}){const s=spring((p-d)*3.2),e=ease((p-d)*4);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${(1-s)*60}px) scale(${.9+.1*s}) rotate(${(o.r||0)*(1-s)}deg);opacity:${clamp(e*1.6)}">${html}</div>`}
const bar=(w,c='#E8E5F0',h=20)=>`<div style="height:${h}px;width:${w}%;background:${c};border-radius:6px;margin:14px 0"></div>`;
const stamp=(t,c='#E5484D',fs=64)=>`<div class="h" style="font-size:${fs}px;padding:12px 30px;border:7px solid ${c};color:${c};border-radius:16px;background:#fff;white-space:nowrap;letter-spacing:3px">${t}</div>`;
// stamp that slams in (scale from 1.6)
function slam(p,d,html,x,y,r=-8){const q=clamp((p-d)/.08);if(q<=0)return '';const s=1+.6*(1-ease(q));
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s}) rotate(${r}deg);opacity:${clamp(q*2)}">${html}</div>`}
function phone(inner,w,h,scrollY=0){return `<div style="width:${w}px;height:${h}px;border-radius:64px;background:#150C2B;padding:16px;box-shadow:0 40px 80px rgba(21,12,43,.28)"><div style="width:100%;height:100%;border-radius:50px;overflow:hidden;background:#fff;position:relative"><div style="position:absolute;left:0;right:0;top:${-scrollY}px">${inner}</div><div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#150C2B"></div></div></div>`}
const BIZ='kestrelplumbing',DOM='kestrelplumbing.com.au',NAVY='#150C2B',IND='#6557E8',RED='#E5484D',GRN='#12A150';
const brow=(inner,w,url)=>`<div class="card" style="width:${w}px;overflow:hidden"><div style="display:flex;align-items:center;gap:12px;padding:20px 24px;background:#F1EFF6"><i style="width:20px;height:20px;border-radius:50%;background:#FF5F57"></i><i style="width:20px;height:20px;border-radius:50%;background:#FEBC2E"></i><i style="width:20px;height:20px;border-radius:50%;background:#28C840"></i><div style="flex:1;margin-left:14px;background:#fff;border-radius:12px;padding:10px 20px;font-weight:600;font-size:26px;color:#5A5470">🔒 ${url}</div></div>${inner}</div>`;
const logo=(fs=34)=>`<span style="font-weight:800;font-size:${fs}px;color:#0B4A6F;letter-spacing:-.02em">💧 Kestrel<span style="color:#F08A24">Plumbing</span></span>`;
const mailHead=(from,sub,o={})=>`<div style="display:flex;gap:22px;align-items:center;padding:30px 34px;border-top:2px solid #EFEDF5;background:${o.hi||'#fff'}"><div style="width:84px;height:84px;flex:none;border-radius:50%;background:${o.c||'#E3F0F7'};color:#0B4A6F;font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center">K</div><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:34px;white-space:nowrap" class="mono">${from}</div><div style="font-weight:600;font-size:31px;color:#7A7490;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px">${sub}</div></div>${o.tag||''}</div>`;
const tick=(on,c=GRN)=>`<div style="width:62px;height:62px;flex:none;border-radius:18px;background:${on?c:'#EEF0EE'};color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center">${on?'✓':''}</div>`;
const circ=(p,d,x,y,w,h,c=RED)=>{const q=clamp((p-d)/.18);if(q<=0)return '';const L=2*Math.PI*Math.max(w,h)/2*1.05;
 return `<svg style="position:absolute;left:${x-w/2-20}px;top:${y-h/2-20}px" width="${w+40}" height="${h+40}"><ellipse cx="${w/2+20}" cy="${h/2+20}" rx="${w/2+8}" ry="${h/2+8}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-ease(q))}" transform="rotate(-8 ${w/2+20} ${h/2+20})"/></svg>`};
const typed=(str,q)=>str.slice(0,Math.round(str.length*clamp(q)));
const SC=[
 // 0 hook: quote email from a gmail address
 (p,t)=>at(p,0,`<div class="card" style="width:900px;overflow:hidden"><div style="padding:28px 34px 8px" class="lab">INBOX · 1 NEW</div>${mailHead('kestrelplumbing@gmail.com','Your quote: hot water system, $2,180',{hi:'#F6F4FD'})}<div style="padding:34px 34px 46px;font-weight:600;font-size:38px;color:#4A4560;line-height:1.4">Hi Sam, thanks for having us out.<br>Quote attached. Pay the deposit here...</div></div>`,540,330,{r:-1.5})
  +circ(p,.35,642,452,236,48)
  +slam(p,.62,stamp('LOSING JOBS?',RED,84),540,1110,-6),
 // 1 anyone can sign up in 2 minutes
 (p,t)=>{const q=clamp((p-.25)/.45),done=p>.74,sec=Math.round(120*clamp(p/.75));
  return at(p,0,`<div class="card" style="width:820px;padding:40px 44px"><div class="lab">FREE EMAIL · CREATE ACCOUNT</div>
   <div style="margin-top:28px;font-weight:700;font-size:26px;color:#7A7490">Name</div><div style="margin-top:10px;border:3px solid #DDD9EA;border-radius:16px;padding:18px 22px;font-weight:700;font-size:36px">${typed('Kestrel Plumbing',q*2)}</div>
   <div style="margin-top:22px;font-weight:700;font-size:26px;color:#7A7490">Username</div><div style="margin-top:10px;border:3px solid ${done?GRN:'#DDD9EA'};border-radius:16px;padding:18px 22px;font-weight:700;font-size:36px" class="mono">${typed('kestrelplumbing',q*2-1)}<span style="color:#9A94B0">@gmail.com</span></div>
   <div style="margin-top:30px;background:${done?GRN:IND};color:#fff;font-weight:800;font-size:36px;padding:22px;border-radius:16px;text-align:center">${done?'✓ Account created':'Create account'}</div></div>`,540,300,{r:-1})
  +at(p,.1,`<div class="card" style="width:400px;padding:30px;text-align:center"><div style="font-size:70px">⏱️</div><div class="h" style="font-size:96px;color:${IND};margin-top:6px">${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</div><div style="font-weight:700;font-size:30px;color:#7A7490;margin-top:8px">free, in minutes</div></div>`,540,960,{r:3})},
 // 2 customer can't tell which is real
 (p,t)=>at(p,0,`<div class="card" style="width:900px;overflow:hidden"><div style="padding:28px 34px 8px" class="lab">CUSTOMER'S INBOX</div>
   ${mailHead('kestrelplumbing@gmail.com','Your quote: hot water system')}
   <div style="opacity:${clamp((p-.3)*4)};transform:translateY(${(1-ease((p-.3)*4))*-40}px)">${mailHead('kestrel.plumbing@gmail.com','Updated quote, pay deposit today',{c:'#FDE8E9'})}</div></div>`,540,300,{r:-1})
  +at(p,.55,`<div class="card" style="width:700px;padding:36px 44px;display:flex;align-items:center;gap:30px"><div style="font-size:100px">🤔</div><div class="h" style="font-size:58px;line-height:1.08">Which one<br>is really you?</div></div>`,540,960,{r:2})
  +slam(p,.82,`<div class="pill" style="background:${RED};color:#fff;font-size:42px">one is a scammer</div>`,540,1290,-3),
 // 3 compare: jess@domain
 (p,t)=>{const q=clamp((p-.15)/.5);
  return at(p,0,'<div class="lab" style="font-size:34px;text-align:center;width:900px">NOW COMPARE</div>',540,380)
  +at(p,.05,`<div class="card" style="width:940px;padding:80px 30px;text-align:center"><div class="h mono" style="font-size:54px;white-space:nowrap">${typed('jess@',q*3)}<span style="${q>.4?'background:#ECE8FF;border-radius:10px;padding:0 6px;color:'+IND:''}">${typed(DOM,q*1.5-.3)}</span></div></div>`,540,460)
  +at(p,.7,`<div class="card" style="width:760px;padding:30px 40px"><div class="lab">VS</div><div class="mono" style="font-weight:800;font-size:36px;margin-top:14px;color:#9A94B0;text-decoration:line-through;text-decoration-color:${RED};text-decoration-thickness:6px">kestrelplumbing@gmail.com</div></div>`,540,980,{r:-2})},
 // 4 matches your website
 (p,t)=>{const m=clamp((p-.35)*4);
  return at(p,0,brow(`<div style="padding:40px 44px 50px">${logo(40)}<div style="margin-top:34px;height:330px;border-radius:24px;background:linear-gradient(140deg,#1B6E9C,#0B4A6F);position:relative;overflow:hidden"><div style="position:absolute;right:-40px;top:-40px;width:260px;height:260px;border-radius:50%;background:rgba(240,138,36,.4)"></div><div class="h" style="position:absolute;left:36px;bottom:34px;color:#fff;font-size:58px">Plumber in Geelong.</div></div></div>`,860,`<b style="color:${NAVY}">${DOM}</b>`),540,280,{r:-1})
  +at(p,.3,`<div class="card" style="width:770px;padding:30px 36px;display:flex;align-items:center;gap:24px">${tick(m>.5)}<div><div class="lab" style="font-size:24px">EMAIL</div><div class="mono" style="font-weight:800;font-size:34px;margin-top:6px">jess@<span style="background:${m>.5?'#ECE8FF':'transparent'};color:${IND};border-radius:8px">${DOM}</span></div></div></div>`,540,980,{r:1})
  +at(p,.65,`<div class="pill" style="background:${NAVY};color:#fff;font-size:44px">real, established business</div>`,540,1230,{r:-2})},
 // 5 only you can create addresses
 (p,t)=>{const den=p>.55;
  return at(p,0,`<div class="card" style="width:860px;padding:36px 44px"><div class="lab">YOUR DOMAIN · ADDRESSES</div>${['jess','quotes','admin'].map((n,k)=>`<div style="display:flex;align-items:center;gap:20px;margin-top:22px;opacity:${clamp((p-k*.08)*6)}">${tick(1,IND)}<div class="mono" style="font-weight:800;font-size:38px">${n}@${DOM}</div></div>`).join('')}<div style="margin-top:26px;font-weight:700;font-size:28px;color:#7A7490">🔑 only the domain owner can add these</div></div>`,540,290,{r:-1})
  +at(p,.4,`<div class="card" style="width:760px;padding:32px 40px;border:4px solid ${den?RED:'transparent'}"><div class="lab">SCAMMER TRIES</div><div class="mono" style="font-weight:800;font-size:34px;margin-top:14px">jess2@${DOM}</div>${den?`<div style="margin-top:18px;font-weight:800;font-size:36px;color:${RED}">✕ Not yours. Can't sign up.</div>`:''}</div>`,540,1020,{r:2})},
 // 6 keep the apps you know
 (p,t)=>{const app=(ic,bg,d,x)=>at(p,d,`<div style="width:240px;height:240px;border-radius:60px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:120px;box-shadow:0 24px 50px rgba(21,12,43,.18)">${ic}</div>`,x,480);
  return app('✉️','#fff',.05,300)+app('📅','#fff',.15,540)+app('📇','#fff',.25,780)
  +at(p,.45,`<div class="card" style="width:820px;padding:36px 44px;display:flex;align-items:center;gap:30px"><div style="font-size:90px">👍</div><div class="h" style="font-size:56px;line-height:1.08">Same apps.<br>New address.</div></div>`,540,900,{r:-2})},
 // 7 Workspace / 365
 (p,t)=>{const c=(n,app,d,y,r)=>at(p,d,`<div class="card" style="width:880px;padding:34px 40px"><div style="display:flex;justify-content:space-between;align-items:center"><div class="h" style="font-size:50px">${n}</div><div class="pill" style="font-size:30px;padding:10px 24px">in ${app}</div></div><div style="margin-top:24px;border-radius:18px;background:#F6F4FD;padding:20px 24px;display:flex;align-items:center;gap:18px"><div style="font-size:44px">✉️</div><div class="mono" style="font-weight:800;font-size:34px">jess@${DOM}</div></div></div>`,540,y,{r});
  return c('Google Workspace','Gmail',0,300,-1.5)+c('Microsoft 365','Outlook',.3,680,1.5)
  +at(p,.7,'<div class="pill" style="background:#150C2B;color:#fff;font-size:42px">your domain, either way</div>',540,1180,{r:-2})},
 // 8 turn on email authentication
 (p,t)=>{const on=p>.6,k=ease((p-.6)*5);
  return at(p,0,`<div class="card" style="width:880px;padding:38px 44px"><div class="lab">ONE LAST TIP</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:24px"><div class="h" style="font-size:52px;line-height:1.08">Email<br>authentication</div><div style="width:170px;height:96px;border-radius:999px;background:${on?GRN:'#DDD9EA'};position:relative"><div style="position:absolute;top:10px;left:${10+74*k}px;width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.2)"></div></div></div></div>`,540,300,{r:-1})
  +at(p,.68,`<div class="card" style="width:760px;padding:26px 44px">${['SPF','DKIM','DMARC'].map((s,j)=>`<div style="display:flex;gap:22px;align-items:center;margin:16px 0">${tick(p>.72+j*.07)}<div class="h mono" style="font-size:44px">${s}</div></div>`).join('')}<div style="font-weight:700;font-size:26px;color:#7A7490;margin-top:6px">three records your web person adds once</div></div>`,540,720,{r:1.5})},
 // 9 lands in inbox, not spam
 (p,t)=>{const arr=p>.3;
  return at(p,0,`<div class="card" style="width:900px;overflow:hidden"><div style="display:flex;gap:16px;padding:24px 30px;background:#F6F4FC"><div style="padding:12px 28px;border-radius:999px;font-weight:800;font-size:32px;background:#fff">Inbox ${arr?`<span style="background:${IND};color:#fff;border-radius:999px;padding:2px 14px">1</span>`:''}</div><div style="padding:12px 28px;border-radius:999px;font-weight:800;font-size:32px;color:#8A82A8">Spam 0</div></div>
   <div style="overflow:hidden"><div style="opacity:${arr?1:0};transform:translateY(${arr?(1-ease((p-.3)*5))*-60:-60}px)">${mailHead('jess@'+DOM,'Your quote: hot water system',{hi:'#F1EEFF',tag:`<div class="pill" style="font-size:24px;padding:8px 18px;background:#E9F6EE;color:#0B6B37">✓ verified</div>`})}</div></div>${mailHead('Mum','Dinner Sunday?',{c:'#F3EEE6'})}${mailHead('Bank','Your statement is ready',{c:'#F3EEE6'})}</div>`,540,300,{r:-1})
  +at(p,.6,`<div class="card" style="width:700px;padding:30px 40px">${[['Really from you',.62],['Not in spam',.76]].map(([s,d])=>`<div style="display:flex;gap:22px;align-items:center;margin:12px 0">${tick(p>d)}<div class="h" style="font-size:48px">${s}</div></div>`).join('')}</div>`,540,1000,{r:2})},
 // 10 CTA
 (p,t)=>{const o=(txt,d,y,hi)=>`<div style="position:absolute;top:${y}px;left:0;width:1080px">${at(p,d,`<div class="card" style="width:760px;padding:26px 36px;${hi?'box-shadow:0 0 0 5px '+IND+',0 24px 60px rgba(21,12,43,.1)':''}"><div class="h mono" style="font-size:46px">${txt}</div></div>`,540,0)}</div>`;
  return at(p,0,`<div class="h" style="font-size:84px;text-align:center;width:960px;line-height:1.05">What does yours<br><span class="hl" style="color:#150C2B">end in</span>?</div>`,540,290)
   +o('@gmail.com',.08,540)+o('@outlook.com',.16,690)+o('@yourbusiness.com.au',.24,840,1)
   +at(p,.42,`<div style="border-radius:999px;padding:26px 56px;font-size:52px;font-weight:800;white-space:nowrap;background:${IND};color:#fff;box-shadow:0 18px 40px rgba(101,87,232,.35)">+ Follow @nexaweb_dev</div>`,540,1060)},
];
function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 BG.style.cssText=`background:radial-gradient(700px 600px at ${25+6*Math.sin(t*.3)}% 18%,rgba(185,166,255,.32),transparent 70%),radial-gradient(760px 640px at ${80+5*Math.cos(t*.25)}% 70%,rgba(101,87,232,.12),transparent 70%),#FAF9F7`;
 const zoom=1+0.025*p;
 const out=nx?clamp((t-(end-0.16))/0.16):0;S.innerHTML=`<div style="position:absolute;inset:0;opacity:${1-out};transform:scale(${zoom*(1+out*.04)}) translateY(${-out*24}px);transform-origin:540px 760px">${SC[i](p,t)}</div>`;
 FX.innerHTML=(i>0&&lt<.15)?`<div style="position:absolute;inset:0;background:rgba(101,87,232,${.08*(1-lt/.15)})"></div>`:'';
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop})">${w.w}</span>`}).join(' ');
};
window.fontsReady=document.fonts.ready;
</script></body></html>
