<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#150C2B;background:#FAF9F7}
#bg,#stage,#fx{position:absolute;inset:0}
.h{font-weight:800;letter-spacing:-.04em;line-height:1}
.card{position:relative;background:#fff;border-radius:34px;box-shadow:0 24px 60px rgba(21,12,43,.10),0 0 0 2px rgba(21,12,43,.06);text-align:left}
.pill{display:inline-block;border-radius:999px;padding:16px 34px;font-weight:700;font-size:40px;white-space:nowrap;background:#ECE8FF;color:#3B2FA8}
.hl{background:#B9A6FF;padding:0 .1em;border-radius:.1em}
.lab{font-weight:700;font-size:28px;letter-spacing:6px;color:#8A82A8}
.mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:-.02em}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.14}
#cap span{display:inline-block;margin:0 .1em;color:#150C2B}
#cap span.k{color:#fff;background:#6557E8;padding:0 .12em .04em;border-radius:.12em}
#tag{position:absolute;left:60px;top:236px;font-weight:800;font-size:30px;letter-spacing:5px;color:#6557E8}
</style></head><body>
<div id="bg"></div><div id="stage"></div><div id="fx"></div>
<div id="cap"></div><div id="tag">WEBSITE TIP · REDESIGNS</div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const S=$('stage'),C=$('cap'),BG=$('bg'),FX=$('fx');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6.5*x)*Math.cos(7.5*x)};
function at(p,d,html,x,y,o={}){if(y>800&&o.c!==false)x-=40;const s=spring((p-d)*3.2),e=ease((p-d)*4);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${(1-s)*60}px) scale(${.9+.1*s}) rotate(${(o.r||0)*(1-s)}deg);opacity:${clamp(e*1.6)}">${html}</div>`}
const bar=(w,c='#E8E5F0',h=20)=>`<div style="height:${h}px;width:${w}%;background:${c};border-radius:6px;margin:14px 0"></div>`;
const stamp=(t,c='#E5484D',fs=64)=>`<div class="h" style="font-size:${fs}px;padding:12px 30px;border:7px solid ${c};color:${c};border-radius:16px;background:#fff;white-space:nowrap;letter-spacing:3px">${t}</div>`;
// stamp that slams in (scale from 1.6)
function slam(p,d,html,x,y,r=-8){const q=clamp((p-d)/.08);if(q<=0)return '';const s=1+.6*(1-ease(q));
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${s}) rotate(${r}deg);opacity:${clamp(q*2)}">${html}</div>`}
function phone(inner,w,h,scrollY=0){return `<div style="width:${w}px;height:${h}px;border-radius:64px;background:#150C2B;padding:16px;box-shadow:0 40px 80px rgba(21,12,43,.28)"><div style="width:100%;height:100%;border-radius:50px;overflow:hidden;background:#fff;position:relative"><div style="position:absolute;left:0;right:0;top:${-scrollY}px">${inner}</div><div style="position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#150C2B"></div></div></div>`}
const DOM='kestrelbayphysio.com.au',NAVY='#150C2B',IND='#6557E8',RED='#E5484D',GRN='#12A150',TEAL='#0E7C86';
const brow=(inner,w,url,uc='#5A5470')=>`<div class="card" style="width:${w}px;overflow:hidden"><div style="display:flex;align-items:center;gap:12px;padding:20px 24px;background:#F1EFF6"><i style="width:20px;height:20px;border-radius:50%;background:#FF5F57"></i><i style="width:20px;height:20px;border-radius:50%;background:#FEBC2E"></i><i style="width:20px;height:20px;border-radius:50%;background:#28C840"></i><div style="flex:1;margin-left:14px;background:#fff;border-radius:12px;padding:10px 20px;font-weight:600;font-size:24px;color:${uc};white-space:nowrap;overflow:hidden">${url}</div></div>${inner}</div>`;
const logo=(fs=34,c=TEAL)=>`<span style="font-weight:800;font-size:${fs}px;color:${c};letter-spacing:-.02em">〰 Kestrel Bay<span style="color:#F08A4B"> Physio</span></span>`;
const site=(h=300,t=0)=>`<div style="padding:30px 40px 40px"><div style="display:flex;justify-content:space-between;align-items:center">${logo(36)}<div style="display:flex;gap:22px;font-weight:700;font-size:22px;color:#4A5A66"><span>Services</span><span>Team</span><span style="background:${TEAL};color:#fff;padding:8px 18px;border-radius:999px">Book</span></div></div><div style="margin-top:26px;height:${h}px;border-radius:24px;background:linear-gradient(${140+10*Math.sin(t)}deg,#2BB3B1,#0E5C73);position:relative;overflow:hidden"><div style="position:absolute;right:-60px;top:-80px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.14)"></div><div style="position:absolute;left:-40px;bottom:-120px;width:520px;height:240px;border-radius:50%;background:rgba(240,138,75,.4)"></div><div class="h" style="position:absolute;left:34px;top:34px;color:#fff;font-size:56px;line-height:1.05">Move better.<br>Feel better.</div><div style="position:absolute;left:34px;bottom:34px;background:#fff;color:${TEAL};font-weight:800;font-size:28px;padding:14px 28px;border-radius:999px">Book online →</div></div></div>`;
const tick=(on,c=GRN)=>`<div style="width:62px;height:62px;flex:none;border-radius:18px;background:${on?c:'#EEF0EE'};color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center">${on?'✓':''}</div>`;
const typed=(str,q)=>str.slice(0,Math.round(str.length*clamp(q)));
const gres=(name,url,title,hl,o='')=>`<div style="padding:22px 0;border-top:2px solid #EFEDF5;${o}"><div style="font-weight:600;font-size:22px;color:#5A5470">${name} · ${url}</div><div style="font-weight:700;font-size:34px;color:${hl?'#3B2FA8':'#1A0DAB'};margin-top:6px">${title}</div></div>`;
const search=(q,inner,w=900)=>`<div class="card" style="width:${w}px;padding:30px 40px 14px"><div style="border:3px solid #DDD9EA;border-radius:999px;padding:16px 28px;font-weight:600;font-size:30px;display:flex;gap:16px"><span>🔍</span><span>${q}</span></div>${inner}</div>`;
const urlbox=(u,c,bg,fs=34)=>`<div class="mono" style="background:${bg};color:${c};border-radius:18px;padding:20px 28px;font-weight:700;font-size:${fs}px;white-space:nowrap">${u}</div>`;
const OLD='/back-pain',NEW='/services/back-pain-physio';
const SC=[
 // 0 hook: new site + calls dropping
 (p,t)=>{const k=clamp((p-.45)/.5);const pts=[...Array(12)].map((_,j)=>{const x=j/11;const y=j<6?.25+.05*Math.sin(j*1.7):.25+.65*clamp((x-.45)/.55*k*1.8);return `${40+x*700},${40+y*260}`}).join(' ');
  return at(p,0,brow(site(300,t),900,`🔒 ${DOM}`),540,280,{r:-1.2})
  +slam(p,.12,`<div class="pill" style="background:${IND};color:#fff;font-size:44px">✨ NEW</div>`,880,330,8)
  +at(p,.42,`<div class="card" style="width:820px;padding:30px 40px"><div class="lab">📞 CALLS PER WEEK</div><svg width="740" height="340" style="margin-top:10px"><polyline points="${pts}" fill="none" stroke="${p>.6?RED:IND}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><line x1="${40+.45*700}" y1="20" x2="${40+.45*700}" y2="320" stroke="#B9A6FF" stroke-width="4" stroke-dasharray="10 10"/><text x="${50+.45*700}" y="330" font-family="DM Sans" font-weight="700" font-size="24" fill="#8A82A8">new site</text></svg></div>`,540,900,{r:1})},
 // 1 made up
 (p,t)=>at(p,0,`<div class="card" style="width:860px;padding:50px 50px;text-align:center">${logo(70)}<div style="margin-top:20px;font-weight:700;font-size:34px;color:#7A7490">physio clinic · ${DOM}</div></div>`,540,420,{r:-1})
  +slam(p,.3,stamp('MADE UP',RED,80),540,820,-6)
  +at(p,.6,`<div class="pill" style="background:${NAVY};color:#fff;font-size:44px">but this happens all the time</div>`,540,1030,{r:2}),
 // 2 ranking #1 for years
 (p,t)=>at(p,0,search(typed('back pain physio near me',p*4)+'<span style="opacity:.4">|</span>',
   gres('Kestrel Bay Physio',DOM+OLD,'Back Pain Treatment | Kestrel Bay Physio',1,`opacity:${clamp((p-.25)*6)};background:${p>.4?'#F3F0FF':'#fff'};margin:0 -20px;padding-left:20px;padding-right:20px;border-radius:16px`)
   +gres('Other Clinic','otherclinic.com.au','Physiotherapy Services',0,`opacity:${clamp((p-.35)*6)}`)
   +gres('Another Physio','anotherphysio.com.au','Book a Physio Today',0,`opacity:${clamp((p-.45)*6)}`)),540,300,{r:-1})
  +slam(p,.55,`<div class="h" style="width:170px;height:170px;border-radius:50%;background:${IND};color:#fff;font-size:90px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(101,87,232,.35)">#1</div>`,900,420,10)
  +at(p,.7,`<div class="pill" style="font-size:44px">📅 for years</div>`,540,1060,{r:-2}),
 // 3 new address
 (p,t)=>{const ch=p>.55;return at(p,0,`<div class="lab" style="text-align:center">LAUNCH DAY 🚀</div>`,540,290)
  +at(p,.05,`<div class="card" style="width:900px;padding:36px 40px"><div class="lab">OLD ADDRESS</div><div style="margin-top:14px">${urlbox(DOM.replace('.com.au','')+OLD,ch?'#9A93B0':NAVY,ch?'#F1EFF6':'#ECE8FF',36)}</div>${ch?`<div style="height:4px;background:${RED};margin-top:-46px;margin-bottom:42px;width:${80*ease((p-.55)*5)}%;margin-left:20px"></div>`:''}</div>`,540,400,{r:-1})
  +at(p,.45,`<div style="font-size:90px;color:${IND}">↓</div>`,540,700)
  +at(p,.55,`<div class="card" style="width:900px;padding:36px 40px;box-shadow:0 0 0 5px ${IND},0 24px 60px rgba(21,12,43,.1)"><div class="lab">NEW ADDRESS</div><div style="margin-top:14px">${urlbox(NEW,'#fff',IND,36)}</div></div>`,540,830,{r:1})},
 // 4 google still sends to old
 (p,t)=>{const k=ease((p-.35)*3);return at(p,0,search('back pain physio near me',gres('Kestrel Bay Physio',DOM+OLD,'Back Pain Treatment | Kestrel Bay Physio',1,'background:#F3F0FF;margin:0 -20px;padding-left:20px;padding-right:20px;border-radius:16px'),880),540,290,{r:-1})
  +at(p,.3,`<div style="display:flex;align-items:center;gap:20px"><div class="h" style="font-size:44px;color:#7A7490">still points to</div><div style="font-size:64px;color:${RED}">→</div></div>`,540,690)
  +at(p,.45,`<div class="card" style="width:820px;padding:36px 40px;text-align:center">${urlbox(OLD,RED,'#FDE8E9',44)}<div class="h" style="margin-top:24px;font-size:52px;color:${RED}">${p>.7?'✕ doesn\'t exist anymore':'&nbsp;'}</div></div>`,540,820,{r:1.2})},
 // 5 page not found -> booked elsewhere
 (p,t)=>at(p,0,brow(`<div style="padding:60px 40px 70px;text-align:center"><div class="h" style="font-size:150px;color:#D8D3E8">404</div><div class="h" style="font-size:56px;margin-top:10px">Page not found</div><div style="margin-top:20px;font-weight:600;font-size:30px;color:#7A7490">The page you're looking for doesn't exist.</div></div>`,880,DOM+OLD,RED),540,280,{r:-1.2})
  +at(p,.45,`<div class="pill" style="font-size:40px;background:#fff;box-shadow:0 10px 30px rgba(21,12,43,.12)">← Back to Google</div>`,540,820,{r:-2})
  +at(p,.65,`<div class="card" style="width:820px;padding:30px 40px;display:flex;align-items:center;gap:26px">${tick(p>.75)}<div><div style="font-weight:600;font-size:26px;color:#5A5470">Other Clinic</div><div class="h" style="font-size:46px">Appointment booked</div></div></div>`,540,980,{r:1.5}),
 // 6 301 redirect
 (p,t)=>{const k=ease((p-.4)*2.5);return at(p,0,`<div class="h" style="font-size:92px;text-align:center">The fix: a <span class="hl">redirect</span></div>`,540,290)
  +at(p,.25,`<div class="card" style="width:900px;padding:40px;position:relative;height:560px">
   <div style="position:absolute;left:40px;top:40px">${urlbox(OLD,NAVY,'#F1EFF6',36)}</div>
   <div style="position:absolute;left:150px;top:140px;width:8px;height:${260*k}px;background:${GRN};border-radius:4px"></div>
   <div style="position:absolute;left:210px;top:220px;opacity:${clamp((p-.45)*5)}">${stamp('301 · MOVED',GRN,52)}</div>
   <div style="position:absolute;left:40px;top:440px;opacity:${clamp((p-.65)*5)}">${urlbox(NEW,'#fff',GRN,36)}</div></div>`,540,540,{r:-1})},
 // 7 list every page
 (p,t)=>{const rows=[['/back-pain','/services/back-pain-physio'],['/sports-injury','/services/sports-physio'],['/dry-needling','/services/dry-needling'],['/contact-us','/contact']];
  return at(p,0,`<div class="lab" style="text-align:center">BEFORE LAUNCH</div>`,540,290)
  +at(p,.05,`<div class="card" style="width:920px;padding:20px 36px">${rows.map(([a,b],j)=>{const d=.12+j*.17;return `<div class="mono" style="display:flex;align-items:center;gap:16px;padding:24px 0;border-top:${j?'2px solid #EFEDF5':'none'};font-weight:700;font-size:27px;opacity:${clamp((p-d+.1)*6)}"><span style="flex:none;width:250px">${a}</span><span style="color:${IND};font-size:36px">→</span><span style="flex:1;color:#3B2FA8">${b}</span>${tick(p>d+.08)}</div>`}).join('')}</div>`,540,370,{r:-.8})
  +at(p,.8,`<div class="pill" style="background:${NAVY};color:#fff;font-size:44px">every old page gets a new home</div>`,540,1020,{r:2})},
 // 8 search console check
 (p,t)=>{const n=Math.round(14*(1-clamp((p-.45)/.35)));return at(p,0,`<div class="card" style="width:900px;padding:40px 44px"><div class="lab">SEARCH CONSOLE · PAGE INDEXING</div><div class="h" style="font-size:52px;margin-top:20px">Not found (404)</div><div style="display:flex;align-items:flex-end;gap:20px;margin-top:20px"><div class="h" style="font-size:180px;color:${n?RED:GRN}">${n}</div><div style="font-weight:700;font-size:34px;color:#7A7490;padding-bottom:36px">pages</div></div>${bar(100*(n/14)+0.01,n?RED:GRN,26)}</div>`,540,300,{r:-1})
  +at(p,.3,`<div class="pill" style="font-size:44px">📆 weeks after launch</div>`,540,960,{r:2})
  +(n===0?slam(p,.82,stamp('ALL FIXED',GRN,70),540,1110,-5):'')},
 // 9 CTA
 (p,t)=>{const o=(txt,d,y,hi)=>`<div style="position:absolute;top:${y}px;left:0;width:1080px">${at(p,d,`<div class="card" style="width:700px;padding:26px 36px;${hi?'box-shadow:0 0 0 5px '+IND+',0 24px 60px rgba(21,12,43,.1)':''}"><div class="h" style="font-size:48px">${txt}</div></div>`,540,0)}</div>`;
  return at(p,0,`<div class="h" style="font-size:80px;text-align:center;width:960px;line-height:1.05">Has a new website<br>ever <span class="hl" style="color:#150C2B">hurt your calls</span>?</div>`,540,290)
   +o('📉 Yes, big time',.08,560,1)+o('🤔 Not sure',.16,710)+o('📈 No, it helped',.24,860)
   +at(p,.42,`<div style="border-radius:999px;padding:26px 56px;font-size:52px;font-weight:800;white-space:nowrap;background:${IND};color:#fff;box-shadow:0 18px 40px rgba(101,87,232,.35)">+ Follow @nexaweb_dev</div>`,540,1080)},
];
function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 BG.style.cssText=`background:radial-gradient(800px 700px at ${70+6*Math.sin(t*.3)}% 20%,rgba(255,255,255,.75),transparent 70%),radial-gradient(760px 640px at ${20+5*Math.cos(t*.25)}% 75%,rgba(101,87,232,.14),transparent 70%),#ECE8FB`;
 const zoom=1+0.025*p;
 const out=nx?clamp((t-(end-0.16))/0.16):0;S.innerHTML=`<div style="position:absolute;inset:0;opacity:${1-out};transform:scale(${zoom*(1+out*.04)}) translateY(${-out*24}px);transform-origin:540px 760px">${SC[i](p,t)}</div>`;
 FX.innerHTML=(i>0&&lt<.15)?`<div style="position:absolute;inset:0;background:rgba(101,87,232,${.08*(1-lt/.15)})"></div>`:'';
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop})">${w.w}</span>`}).join(' ');
};
window.fontsReady=document.fonts.ready;
</script></body></html>
