   +at(p,.64,'<div class="h" style="font-size:88px;white-space:nowrap;color:#FF5C7A">← left the site</div>',540,1010,{r:-3,t})},
 // 8 ads, stay and click
 (p,t)=>{const m=clamp((p-.45)/.4);return lab('THE BUSINESS',p)+at(p,0,browser(900,'excite.com',`<div style="padding:36px 46px 44px"><div style="display:flex;gap:20px">${['AD','AD','AD'].map((a,i)=>`<div style="flex:1;height:150px;border-radius:18px;background:linear-gradient(135deg,rgba(255,194,75,.25),rgba(255,92,122,.18));border:1.5px solid rgba(255,194,75,.5);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#FFD98A;opacity:${clamp((p-.1-i*.08)*6)}">💰 ${a}</div>`).join('')}</div><div class="muted" style="font-size:32px;font-weight:700;margin-top:34px">Time on site</div><div style="margin-top:12px;height:46px;border-radius:23px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;width:${10+85*ease(m)}%;background:linear-gradient(90deg,#5845E0,#B9A6FF);box-shadow:0 0 20px #8B7BFF"></div></div><div class="h" style="font-size:56px;margin-top:26px">more clicks = more 💰</div></div>`,p),540,360,{t})
   +at(p,.6,'<div class="chip" style="font-size:44px">🎯 goal: keep you here</div>',540,1060,{r:3,t})},
 // 9 today: trillions vs ?
 (p,t)=>{const g=ease((p-.12)*2.2),e=ease((p-.55)*3);return lab('TODAY',p)+at(p,0,`<div class="glass" style="width:880px;height:700px;padding:44px 60px;display:flex;align-items:flex-end;justify-content:space-around"><div style="text-align:center"><div class="h" style="font-size:52px;margin-bottom:16px;opacity:${g}">trillions</div><div style="width:240px;height:${440*g}px;border-radius:24px 24px 8px 8px;background:linear-gradient(180deg,#B9A6FF,#5845E0);box-shadow:0 0 60px rgba(101,87,232,.6)"></div><div style="font-size:46px;font-weight:800;margin-top:18px">Google</div></div><div style="text-align:center"><div class="h" style="font-size:80px;margin-bottom:16px;color:#9C92C8;opacity:${e}">?</div><div style="width:240px;height:${30*e}px;border-radius:12px 12px 8px 8px;background:rgba(185,166,255,.3)"></div><div style="font-size:46px;font-weight:800;margin-top:18px;color:#9C92C8">Excite</div></div>${shine(p,.2)}</div>`,540,330,{t,float:3})
   +at(p,.75,'<div class="chip" style="font-size:42px">🤷 never heard of it</div>',540,1080,{r:-3,t})},
 // 10 lesson: don't make them hunt
 (p,t)=>{const steps=['Home','Services','About us','Contact','...hours?'];let h='';steps.forEach((s,i)=>{const q=spring((p-.35-i*.06)*3.5);h+=`<span class="chip" style="font-size:34px;padding:12px 24px;margin:8px;opacity:${clamp(q*2)};transform:scale(${.7+.3*q});display:inline-block;${i==4?'border-color:rgba(255,92,122,.6);color:#FF9DB0':''}">${s}</span>${i<4?`<span class="muted" style="font-size:34px;opacity:${clamp(q*2)}">→</span>`:''}`});

   +ring(540,1010,p,.5,'75,227,154')+at(p,.5,'<div class="chip" style="font-size:46px;background:rgba(75,227,154,.12);border-color:rgba(75,227,154,.45);color:#B8F5D6">✓ found it in 2 seconds</div>',540,940,{r:-3,t})

 (p,t)=>lab('YOUR CALL',p)+at(p,0,'<div class="h" style="font-size:104px;text-align:center;width:940px">Would you have<br>bought Google?</div>',540,360,{t})

   +at(p,.5,'<div class="glass" style="border-radius:999px;padding:26px 54px;font-size:50px;font-weight:800;white-space:nowrap;background:linear-gradient(135deg,#7C6CFF,#5845E0);border-color:rgba(255,255,255,.3);box-shadow:0 20px 60px rgba(101,87,232,.6)">+ Follow @nexaweb_dev</div>',540,1000,{t}),

function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 // background motion
 O.innerHTML=[[30,22,'101,87,232',.55,900],[78,60,'139,80,255',.38,800],[20,80,'60,120,255',.25,700]].map(([x,y,c,a,r],k)=>{const X=x+8*Math.sin(t*.25+k*2),Y=y+6*Math.cos(t*.2+k);return `<div style="position:absolute;left:${X}%;top:${Y}%;width:${r}px;height:${r}px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(${c},${a}),transparent 65%);filter:blur(30px)"></div>`}).join('');
 F.style.backgroundPosition=`0 ${(t*40)%90}px`;
 let ph='';for(let k=0;k<38;k++){const x=rnd(k)*1080,sp=10+rnd(k+50)*30,y=(1920-((rnd(k+9)*1920+t*sp)%1920)),sz=2+rnd(k+3)*4,a=.15+.5*rnd(k+7)*(.6+.4*Math.sin(t*2+k));ph+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-radius:50%;background:#CFC3FF;opacity:${a};box-shadow:0 0 ${sz*3}px #8B7BFF"></div>`}
 P.innerHTML=ph;
 PR.style.width=(100*t/DATA.total)+'%';
 const out=nx?clamp((t-(end-0.16))/0.16):0, inn=ease(lt/0.3), zoom=1+0.03*p;
 S.innerHTML=`<div style="position:absolute;inset:0;opacity:${inn*(1-out)};transform:scale(${zoom*(1+out*.06)}) translateY(${-out*30}px);transform-origin:540px 760px;filter:blur(${(1-inn)*10+out*12}px)">${SC[i](p,t)}</div>`
  +(lt<.18&&i>0?`<div style="position:absolute;inset:0;background:radial-gradient(800px 600px at 50% 40%,rgba(139,123,255,${.22*(1-lt/.18)}),transparent 70%)"></div>`:'');
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop}) translateY(${on?(1-ease(a/0.15))*14:0}px)">${w.w}</span>`}).join(' ');
};
