<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0A0616}
#bg,#orbs,#grid,#parts,#stage,#vig{position:absolute;inset:0}
#bg{background:radial-gradient(1200px 900px at 50% 35%,#1B1036 0%,#110A24 45%,#0A0616 100%)}
#grid{perspective:900px;overflow:hidden}
#floor{position:absolute;left:-600px;right:-600px;top:1150px;height:1400px;transform-origin:50% 0;transform:rotateX(72deg);
 background-image:linear-gradient(rgba(140,120,255,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(140,120,255,.22) 2px,transparent 2px);background-size:90px 90px;
 -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 75%)}
#vig{background:radial-gradient(1100px 1500px at 50% 45%,transparent 55%,rgba(5,2,12,.75) 100%);pointer-events:none}
.lab{position:absolute;left:0;right:0;top:300px;text-align:center;font-weight:700;font-size:30px;letter-spacing:10px;color:#B9A6FF}
.lab i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#8B7BFF;margin-right:16px;vertical-align:4px;box-shadow:0 0 0 6px rgba(139,123,255,.18),0 0 24px #8B7BFF}
.h{font-weight:800;letter-spacing:-.045em;line-height:.98;color:#fff}
.grad{background:linear-gradient(100deg,#fff 10%,#CFC3FF 50%,#8B7BFF 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{display:inline-block;background:linear-gradient(135deg,#7C6CFF,#5845E0);color:#fff;padding:0 .16em .05em;border-radius:.14em;box-shadow:0 10px 40px rgba(101,87,232,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1.5px solid rgba(185,166,255,.22);border-radius:36px;
 box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.2),0 0 80px rgba(101,87,232,.18),inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden;backdrop-filter:blur(18px)}
.mono{font-family:'DejaVu Sans Mono',monospace}
.chip{display:inline-block;border-radius:999px;padding:16px 34px;font-weight:700;font-size:38px;white-space:nowrap;background:rgba(139,123,255,.16);border:1.5px solid rgba(185,166,255,.35);color:#DCD3FF;box-shadow:0 0 40px rgba(101,87,232,.25)}
.bar{height:78px;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1.5px solid rgba(185,166,255,.14);background:rgba(255,255,255,.03)}
.bar s{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-block}
.url{margin-left:16px;flex:1;height:44px;border-radius:12px;background:rgba(0,0,0,.25);display:flex;align-items:center;padding:0 18px;font-size:24px;color:#9C92C8}
.muted{color:#9C92C8}
.ok{color:#4BE39A}
.bad{color:#FF5C7A}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.14;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#cap span{display:inline-block;margin:0 .1em}
#cap span.k{background:linear-gradient(135deg,#7C6CFF,#5845E0);color:#fff;padding:0 .12em .05em;border-radius:.12em;text-shadow:none;box-shadow:0 8px 30px rgba(101,87,232,.5)}
#tag{position:absolute;left:60px;top:232px;font-weight:700;font-size:26px;letter-spacing:5px;color:rgba(220,211,255,.55)}
#tag b{color:#8B7BFF}
#prog{position:absolute;left:60px;right:60px;top:276px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#prog i{display:block;height:100%;background:linear-gradient(90deg,#5845E0,#B9A6FF);box-shadow:0 0 12px #8B7BFF}
</style></head><body>
<div id="bg"></div><div id="orbs"></div><div id="grid"><div id="floor"></div></div><div id="parts"></div>
<div id="stage"></div><div id="vig"></div>
<div id="tag"><b>●</b> INTERNET STORIES · EP.5</div><div id="prog"><i></i></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const S=$('stage'),C=$('cap'),O=$('orbs'),P=$('parts'),F=$('floor'),PR=$('prog').firstChild;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6.5*x)*Math.cos(7.5*x)};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
// 3D entrance: rotateX flip-up + blur, then gentle float
function at(p,d,html,x,y,o={}){
 const s=spring((p-d)*3.2),e=ease((p-d)*4),tt=o.t||0;
 const fl=Math.sin((tt+d*7)*1.3)*(o.float??6);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${(1-s)*(o.dy??90)+fl}px) perspective(1400px) rotateX(${(1-s)*(o.rx??28)}deg) rotateZ(${(o.r||0)*(1-s)}deg) scale(${0.86+0.14*s});opacity:${clamp(e*1.6)};filter:blur(${(1-e)*14}px);transform-origin:50% 100%;${o.css||''}">${html}</div>`}
// moving light sweep over a card
const shine=(p,d=0)=>{const x=-60+clamp((p-d-.08)/.35)*220;return `<div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent ${x-18}%,rgba(255,255,255,.13) ${x}%,transparent ${x+18}%)"></div>`};
function lab(t,p){const e=ease(p*5);return `<div class="lab" style="opacity:${e};letter-spacing:${10+(1-e)*14}px"><i></i>${t}</div>`}
function typed(t,p,a,b){return t.slice(0,Math.floor(t.length*clamp((p-a)/(b-a))))}
const caret=t=>`<span style="display:inline-block;width:4px;height:1em;background:#B9A6FF;vertical-align:-.12em;box-shadow:0 0 10px #B9A6FF;opacity:${Math.floor(t*3)%2}"></span>`;
function browser(w,url,inner,p){return `<div class="glass" style="width:${w}px"><div class="bar"><s style="background:#FF5C7A"></s><s style="background:#FFC24B"></s><s style="background:#4BE39A"></s><div class="url mono">🔒 ${url}</div></div>${inner}${shine(p,0)}</div>`}
function search(q,res,p,t){return browser(900,'domains.google',`<div style="padding:46px"><div class="h" style="font-size:56px">Find your perfect domain</div><div style="margin-top:30px;border:2px solid rgba(185,166,255,.5);border-radius:20px;padding:22px 28px;font-size:46px;font-weight:700;background:rgba(0,0,0,.25);box-shadow:0 0 0 6px rgba(139,123,255,.12)" class="mono">${q}${res?'':caret(t)}</div>${res||''}</div>`,p)}
const RES=(s,t)=>`<div style="margin-top:30px;display:flex;align-items:center;justify-content:space-between;background:rgba(75,227,154,.08);border:1.5px solid rgba(75,227,154,.35);border-radius:22px;padding:24px 30px;transform:scale(${.9+.1*s});opacity:${clamp(s*2)};box-shadow:0 0 ${30+10*Math.sin(t*6)}px rgba(75,227,154,.25)"><div><div class="mono" style="font-size:40px;font-weight:700">google.com</div><div class="ok" style="font-size:32px;font-weight:700;margin-top:6px">● Available</div></div><div class="h" style="font-size:76px">$12</div></div>`;
function morph(p){const src='6,006.13'.split(''),L={0:'G',2:'O',3:'O',4:'G',6:'L',7:'E'};let h='',k=0;const m0=clamp((p-.6)/.1);
 src.forEach((c,i)=>{if(!(i in L)){h+=`<span style="display:inline-block;overflow:hidden;width:${(1-m0)*.6}em;opacity:${1-m0}">${c}</span>`;return}
  const m=clamp((p-.64-k*.035)/.12);k++;
  h+=`<span style="position:relative;display:inline-block;width:.62em;text-align:center"><span style="position:absolute;left:0;right:0;opacity:${1-m};filter:blur(${m*12}px);transform:translateY(${-m*30}px)">${c}</span><span class="grad" style="display:inline-block;opacity:${m};filter:blur(${(1-m)*12}px);transform:translateY(${(1-m)*30}px)">${L[i]}</span></span>`});return h}
function ring(x,y,p,d,col='139,123,255'){const q=clamp((p-d)/.35);return q<=0||q>=1?'':`<div style="position:absolute;left:${x}px;top:${y}px;width:${200+700*ease(q)}px;height:${200+700*ease(q)}px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(${col},${.7*(1-q)});box-shadow:0 0 40px rgba(${col},${.5*(1-q)})"></div>`}
const RED='background:linear-gradient(135deg,#FF5C7A,#D9324F);box-shadow:0 10px 40px rgba(255,92,122,.55)';
const stamp=(txt,fs=64)=>`<div class="h" style="font-size:${fs}px;padding:14px 34px;border:7px solid #FF5C7A;color:#FF5C7A;border-radius:18px;letter-spacing:4px;white-space:nowrap;background:rgba(10,6,22,.6);box-shadow:0 0 40px rgba(255,92,122,.35)">${txt}</div>`;
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const SC=[
 // 0 hook
 (p,t)=>lab('DID YOU KNOW',p)+at(p,0,'<div class="h" style="font-size:120px;text-align:left;width:940px">Google tried<br>to sell itself<br>for</div>',80,380,{c:false,t})
   +at(p,.32,'<div class="h" style="font-size:150px;white-space:nowrap"><span class="box">under $1M</span></div>',80,770,{c:false,r:-4,t})
   +ring(540,1080,p,.72,'255,92,122')+at(p,.72,stamp('✕ BUYER SAID NO'),540,1020,{r:-6,t,dy:-60}),
 // 1 1999 startup
 (p,t)=>lab('1999',p)+at(p,0,browser(900,'google.com',`<div style="padding:60px 50px 70px;text-align:center"><div class="h" style="font-size:130px">Google<span class="chip" style="font-size:30px;padding:8px 20px;vertical-align:60px;margin-left:12px">beta</span></div><div style="margin:34px auto 0;width:92%;border:2px solid rgba(185,166,255,.5);border-radius:999px;padding:22px 34px;font-size:40px;text-align:left;background:rgba(0,0,0,.25)" class="mono">${typed('search the web',p,.25,.6)}${caret(t)}</div><div style="margin-top:30px;display:flex;justify-content:center;gap:20px"><span class="chip" style="font-size:30px">Search</span><span class="chip" style="font-size:30px">I'm feeling lucky</span></div></div>`,p),540,350,{t})
   +at(p,.6,'<div class="chip" style="font-size:44px">🎓 two Stanford students</div>',540,1060,{r:-3,t}),
 // 2 Excite portal
 (p,t)=>{const rows=[['📰','News'],['⛅','Weather'],['📈','Stocks'],['💬','Chat'],['🔍','Search']];let h='';rows.forEach(([e,n],i)=>{const s=spring((p-.12-i*.06)*3.2);h+=`<div style="display:inline-flex;align-items:center;gap:14px;width:46%;margin:10px 1.5%;padding:20px 24px;border-radius:18px;background:rgba(255,255,255,.06);font-size:38px;font-weight:700;transform:scale(${.8+.2*s});opacity:${clamp(s*2)}">${e} ${n}</div>`});
  return lab('THE BUYER',p)+at(p,0,browser(900,'excite.com',`<div style="padding:40px 46px 50px"><div class="h" style="font-size:96px">Excite</div><div class="muted" style="font-size:32px;font-weight:700;margin:6px 0 18px">your home page on the web</div>${h}</div>`,p),540,340,{t})
   +at(p,.6,'<div class="chip" style="font-size:42px">🔥 one of the biggest search sites</div>',540,1090,{r:3,t})},
 // 3 price $1M
 (p,t)=>{const v=1e6*eio((p-.25)/.45);return lab('THE OFFER',p)+at(p,0,`<div class="glass" style="width:880px;padding:50px 56px;text-align:center"><div class="muted" style="font-size:30px;font-weight:700;letter-spacing:8px">ASKING PRICE</div><div class="h grad mono" style="font-size:118px;margin-top:20px;letter-spacing:-6px">${money(v)}</div><div style="font-size:42px;font-weight:700;margin-top:14px">for all of Google</div>${shine(p,.6)}</div>`,540,420,{t})
   +ring(540,620,p,.7)+at(p,.72,'<div class="chip" style="font-size:46px">🤝 deal?</div>',540,1000,{r:-3,t})},
 // 4 talked down to 750k
 (p,t)=>{const v=1e6-250000*eio((p-.4)/.35);return lab('THE HAGGLE',p)+at(p,0,`<div class="glass" style="width:880px;padding:50px 56px;text-align:center"><div class="muted" style="font-size:30px;font-weight:700;letter-spacing:8px">NEW PRICE</div><div style="position:relative;display:inline-block;margin-top:16px"><span class="h mono" style="font-size:80px;color:#9C92C8;letter-spacing:-4px">$1,000,000</span><div style="position:absolute;left:-10px;right:-10px;top:52%;height:10px;border-radius:5px;background:#FF5C7A;transform:scaleX(${ease((p-.3)*5)});transform-origin:0 50%;box-shadow:0 0 20px #FF5C7A"></div></div><div class="h mono" style="font-size:118px;margin-top:10px;letter-spacing:-6px;color:#4BE39A;text-shadow:0 0 40px rgba(75,227,154,.4)">${money(v)}</div>${shine(p,.6)}</div>`,540,400,{t})
   +at(p,.65,'<div class="chip" style="font-size:44px">📉 talked down by an investor</div>',540,1030,{r:3,t})},
 // 5 boss said no
 (p,t)=>lab('THE ANSWER',p)+at(p,0,`<div class="glass" style="width:880px;padding:44px 50px"><div style="display:flex;align-items:center;gap:22px"><div style="width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#7C6CFF,#5845E0);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800">E</div><div><div style="font-size:40px;font-weight:800">Excite's boss</div><div class="muted" style="font-size:30px;font-weight:700">Re: Buying Google</div></div></div><div style="border-top:2px dashed rgba(185,166,255,.3);margin:30px 0"></div><div class="h" style="font-size:96px">${typed('No thanks.',p,.25,.5)}${p<.52?caret(t):''}</div>${shine(p)}</div>`,540,380,{t})
   +ring(540,1020,p,.6,'255,92,122')+at(p,.6,stamp('DEAL REJECTED',72),540,960,{r:-6,t,dy:-60}),
 // 6 why? too good
 (p,t)=>lab('WHY?',p)+at(p,0,'<div class="h grad" style="font-size:260px;line-height:1">?</div>',540,330,{t})
   +at(p,.3,'<div class="h" style="font-size:44px;color:#B9A6FF;letter-spacing:6px">REPORTEDLY</div>',540,700,{t})
   +at(p,.45,'<div class="h" style="font-size:118px;white-space:nowrap">Google was</div>',540,790,{t})
   +at(p,.6,'<div class="h" style="font-size:150px;white-space:nowrap"><span class="box">too good.</span></div>',540,930,{r:-3,t}),
 // 7 found answer fast, left
 (p,t)=>{const res=p>.35,gone=p>.62,sec=Math.min(p,.35)/.35*0.4;return lab('TOO FAST',p)+at(p,0,browser(900,'excite.com/search',`<div style="padding:40px 46px;height:520px;position:relative"><div style="border:2px solid rgba(185,166,255,.5);border-radius:20px;padding:20px 26px;font-size:40px;font-weight:700;background:rgba(0,0,0,.25)" class="mono">${typed('hardware store hours',p,.05,.3)}${res?'':caret(t)}</div>${res?`<div style="margin-top:28px;background:rgba(75,227,154,.08);border:1.5px solid rgba(75,227,154,.35);border-radius:20px;padding:24px 28px;opacity:${clamp((p-.35)*8)}"><div class="ok" style="font-size:30px;font-weight:700">● Top result</div><div style="font-size:44px;font-weight:800;margin-top:6px">Open today 8am to 5pm</div></div>`:''}<div class="mono" style="position:absolute;right:46px;bottom:36px;font-size:40px;font-weight:700;color:#B9A6FF">⏱ ${sec.toFixed(1)}s</div></div>`,p),540,340,{t,css:`opacity:${gone?1-.45*ease((p-.62)*4):1}`})
   +at(p,.64,'<div class="h" style="font-size:88px;white-space:nowrap;color:#FF5C7A">← left the site</div>',540,1010,{r:-3,t})},
 // 8 ads, stay and click
 (p,t)=>{const m=clamp((p-.45)/.4);return lab('THE BUSINESS',p)+at(p,0,browser(900,'excite.com',`<div style="padding:36px 46px 44px"><div style="display:flex;gap:20px">${['AD','AD','AD'].map((a,i)=>`<div style="flex:1;height:150px;border-radius:18px;background:linear-gradient(135deg,rgba(255,194,75,.25),rgba(255,92,122,.18));border:1.5px solid rgba(255,194,75,.5);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#FFD98A;opacity:${clamp((p-.1-i*.08)*6)}">💰 ${a}</div>`).join('')}</div><div class="muted" style="font-size:32px;font-weight:700;margin-top:34px">Time on site</div><div style="margin-top:12px;height:46px;border-radius:23px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;width:${10+85*ease(m)}%;background:linear-gradient(90deg,#5845E0,#B9A6FF);box-shadow:0 0 20px #8B7BFF"></div></div><div class="h" style="font-size:56px;margin-top:26px">more clicks = more 💰</div></div>`,p),540,360,{t})
   +at(p,.6,'<div class="chip" style="font-size:44px">🎯 goal: keep you here</div>',540,1060,{r:3,t})},
 // 9 today: trillions vs ?
 (p,t)=>{const g=ease((p-.12)*2.2),e=ease((p-.55)*3);return lab('TODAY',p)+at(p,0,`<div class="glass" style="width:880px;height:700px;padding:44px 60px;display:flex;align-items:flex-end;justify-content:space-around"><div style="text-align:center"><div class="h" style="font-size:52px;margin-bottom:16px;opacity:${g}">trillions</div><div style="width:240px;height:${440*g}px;border-radius:24px 24px 8px 8px;background:linear-gradient(180deg,#B9A6FF,#5845E0);box-shadow:0 0 60px rgba(101,87,232,.6)"></div><div style="font-size:46px;font-weight:800;margin-top:18px">Google</div></div><div style="text-align:center"><div class="h" style="font-size:80px;margin-bottom:16px;color:#9C92C8;opacity:${e}">?</div><div style="width:240px;height:${30*e}px;border-radius:12px 12px 8px 8px;background:rgba(185,166,255,.3)"></div><div style="font-size:46px;font-weight:800;margin-top:18px;color:#9C92C8">Excite</div></div>${shine(p,.2)}</div>`,540,330,{t,float:3})
   +at(p,.75,'<div class="chip" style="font-size:42px">🤷 never heard of it</div>',540,1080,{r:-3,t})},
 // 10 lesson: don't make them hunt
 (p,t)=>{const steps=['Home','Services','About us','Contact','...hours?'];let h='';steps.forEach((s,i)=>{const q=spring((p-.35-i*.06)*3.5);h+=`<span class="chip" style="font-size:34px;padding:12px 24px;margin:8px;opacity:${clamp(q*2)};transform:scale(${.7+.3*q});display:inline-block;${i==4?'border-color:rgba(255,92,122,.6);color:#FF9DB0':''}">${s}</span>${i<4?`<span class="muted" style="font-size:34px;opacity:${clamp(q*2)}">→</span>`:''}`});
  return lab('THE LESSON',p)+at(p,0,'<div class="h" style="font-size:112px;text-align:left;width:920px">Don\'t make<br>people</div>',80,360,{c:false,t})
   +at(p,.18,'<div class="h" style="font-size:150px"><span class="box">hunt.</span></div>',80,620,{c:false,r:-3,t})
   +`<div style="position:absolute;left:90px;width:900px;top:900px;text-align:center">${h}</div>`},
 // 11 answer fast, come back
 (p,t)=>lab('THE FIX',p)+at(p,0,`<div class="glass" style="width:620px;border-radius:60px;padding:30px 30px 40px"><div style="height:30px;width:160px;margin:0 auto 24px;border-radius:15px;background:rgba(0,0,0,.5)"></div><div style="border-radius:30px;background:#FAF9F6;color:#150C2B;padding:36px 34px"><div style="font-size:34px;font-weight:800;color:#6557E8">Harbour Hardware</div><div class="h" style="font-size:58px;color:#150C2B;margin-top:16px">Open today<br>8am to 5pm</div><div style="margin-top:28px;display:flex;gap:16px"><div style="flex:1;text-align:center;padding:20px;border-radius:18px;background:#6557E8;color:#fff;font-size:34px;font-weight:800">📞 Call</div><div style="flex:1;text-align:center;padding:20px;border-radius:18px;border:3px solid #6557E8;color:#6557E8;font-size:34px;font-weight:800">📍 Map</div></div></div>${shine(p,.2)}</div>`,540,300,{t,float:3})
   +ring(540,1010,p,.5,'75,227,154')+at(p,.5,'<div class="chip" style="font-size:46px;background:rgba(75,227,154,.12);border-color:rgba(75,227,154,.45);color:#B8F5D6">✓ found it in 2 seconds</div>',540,940,{r:-3,t})
   +at(p,.72,'<div class="h" style="font-size:72px;white-space:nowrap">↺ they come back</div>',540,1070,{t}),
 // 12 CTA
 (p,t)=>lab('YOUR CALL',p)+at(p,0,'<div class="h" style="font-size:104px;text-align:center;width:940px">Would you have<br>bought Google?</div>',540,360,{t})
   +at(p,.2,'<div style="display:flex;gap:30px"><div class="glass" style="padding:28px 60px;font-size:60px;font-weight:800;border-color:rgba(75,227,154,.5)">✓ Yes</div><div class="glass" style="padding:28px 60px;font-size:60px;font-weight:800;border-color:rgba(255,92,122,.5)">✕ No</div></div>',540,690,{t})
   +at(p,.5,'<div class="glass" style="border-radius:999px;padding:26px 54px;font-size:50px;font-weight:800;white-space:nowrap;background:linear-gradient(135deg,#7C6CFF,#5845E0);border-color:rgba(255,255,255,.3);box-shadow:0 20px 60px rgba(101,87,232,.6)">+ Follow @nexaweb_dev</div>',540,1000,{t}),
];

function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 // background motion
 O.innerHTML=[[30,22,'101,87,232',.55,900],[78,60,'139,80,255',.38,800],[20,80,'60,120,255',.25,700]].map(([x,y,c,a,r],k)=>{const X=x+8*Math.sin(t*.25+k*2),Y=y+6*Math.cos(t*.2+k);return `<div style="position:absolute;left:${X}%;top:${Y}%;width:${r}px;height:${r}px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(${c},${a}),transparent 65%);filter:blur(30px)"></div>`}).join('');
 F.style.backgroundPosition=`0 ${(t*40)%90}px`;
 let ph='';for(let k=0;k<38;k++){const x=rnd(k)*1080,sp=10+rnd(k+50)*30,y=(1920-((rnd(k+9)*1920+t*sp)%1920)),sz=2+rnd(k+3)*4,a=.15+.5*rnd(k+7)*(.6+.4*Math.sin(t*2+k));ph+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-radius:50%;background:#CFC3FF;opacity:${a};box-shadow:0 0 ${sz*3}px #8B7BFF"></div>`}
 P.innerHTML=ph;
 PR.style.width=(100*t/DATA.total)+'%';
 const out=nx?clamp((t-(end-0.16))/0.16):0, inn=ease(lt/0.3), zoom=1+0.03*p;
 S.innerHTML=`<div style="position:absolute;inset:0;opacity:${inn*(1-out)};transform:scale(${zoom*(1+out*.06)}) translateY(${-out*30}px);transform-origin:540px 760px;filter:blur(${(1-inn)*10+out*12}px)">${SC[i](p,t)}</div>`
  +(lt<.18&&i>0?`<div style="position:absolute;inset:0;background:radial-gradient(800px 600px at 50% 40%,rgba(139,123,255,${.22*(1-lt/.18)}),transparent 70%)"></div>`:'');
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop}) translateY(${on?(1-ease(a/0.15))*14:0}px)">${w.w}</span>`}).join(' ');
};
