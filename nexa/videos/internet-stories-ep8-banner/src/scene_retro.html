<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'VT';src:url(fonts/VT323-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#111;background:#1F7A7A}
#bg,#stage,#fx,#crt{position:absolute;inset:0}
#crt{pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 2px,transparent 2px 5px)}
.px{font-family:'VT',monospace}
.win{position:relative;background:#C3C3C3;border:3px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -3px -3px 0 #808080,inset 3px 3px 0 #DFDFDF,14px 16px 0 rgba(0,0,0,.35);padding:5px;text-align:left}
.tb{height:56px;background:linear-gradient(90deg,#150C2B,#6557E8);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font-family:'VT',monospace;font-size:38px;letter-spacing:1px}
.tb i{display:inline-block;width:40px;height:36px;margin-left:5px;background:#C3C3C3;border:3px solid;border-color:#fff #404040 #404040 #fff;color:#111;font-style:normal;font-size:30px;line-height:28px;text-align:center}
.body{background:#fff;border:3px solid;border-color:#808080 #fff #fff #808080;margin-top:6px}
.btn{display:inline-block;background:#C3C3C3;border:3px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -2px -2px 0 #808080;padding:8px 40px;font-family:'VT',monospace;font-size:40px;color:#111}
.sticky{position:absolute;background:#FFE45C;color:#111;font-weight:800;font-size:44px;line-height:1.1;padding:22px 30px;box-shadow:10px 12px 0 rgba(0,0,0,.3);white-space:nowrap}
.h{font-weight:800;letter-spacing:-.04em;line-height:1}
/* modern part */
.card{position:relative;background:#fff;border-radius:34px;box-shadow:0 30px 70px rgba(21,12,43,.16),0 0 0 2px rgba(21,12,43,.06);text-align:left}
.pill{display:inline-block;border-radius:999px;padding:16px 34px;font-weight:700;font-size:40px;white-space:nowrap;background:#ECE8FF;color:#3B2FA8}
.hl{background:#B9A6FF;padding:0 .14em;border-radius:.12em}
#tag{position:absolute;left:60px;top:236px;font-family:'VT',monospace;font-size:40px;letter-spacing:2px;padding:4px 16px;background:#C3C3C3;border:3px solid;border-color:#fff #404040 #404040 #fff;color:#111}
#prog{position:absolute;left:60px;width:860px;top:300px;height:30px;padding:4px;background:#fff;border:3px solid;border-color:#808080 #fff #fff #808080;display:flex;gap:4px;overflow:hidden}
#prog b{display:block;width:20px;height:100%;background:#6557E8;flex:none}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.14;color:#fff}
#cap span{display:inline-block;margin:0 .1em;text-shadow:0 0 0 #000,4px 4px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 5px 0 #000}
#cap span.k{color:#FFE45C}
body.modern #cap span{color:#150C2B;text-shadow:none}
body.modern #cap span.k{color:#fff;background:#6557E8;padding:0 .12em .04em;border-radius:.12em}
body.modern #tag{background:#150C2B;color:#B9A6FF;border-color:#150C2B;border-radius:10px;font-family:'DM Sans';font-weight:700;font-size:26px;letter-spacing:5px;padding:10px 18px}
body.modern #prog{border:none;background:#E4E0F2;height:8px;padding:0;border-radius:6px;top:304px}
body.modern #crt{display:none}
</style></head><body>
<div id="bg"></div><div id="stage"></div><div id="fx"></div><div id="crt"></div>
<div id="tag">INTERNET STORIES · EP.8</div><div id="prog"></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const S=$('stage'),C=$('cap'),BG=$('bg'),FX=$('fx'),PR=$('prog');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6.5*x)*Math.cos(7.5*x)};
const MOD=8; // lines >= MOD are "today" (modern look)
// retro window pop: stepped scale like an old OS opening a window
function pop(p,d,html,x,y,o={}){const q=clamp((p-d)/.06);if(q<=0)return '';const s=q>=1?1:.5+.5*Math.floor(q*4)/4;
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},0) scale(${s}) rotate(${o.r||0}deg);transform-origin:50% 0;${o.css||''}">${q<1?`<div style="width:${o.w||600}px;height:${o.h||300}px;border:4px dotted #111"></div>`:html}</div>`}
// modern entrance: soft spring
function at(p,d,html,x,y,o={}){const s=spring((p-d)*3.2),e=ease((p-d)*4);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${(1-s)*60}px) scale(${.9+.1*s}) rotate(${(o.r||0)*(1-s)}deg);opacity:${clamp(e*1.6)}">${html}</div>`}
const win=(title,w,inner,o={})=>`<div class="win" style="width:${w}px"><div class="tb"><span>${title}</span><span><i>_</i><i>□</i><i>×</i></span></div>${o.nobody?inner:`<div class="body" style="${o.bs||''}">${inner}</div>`}</div>`;
const CUR=(x,y,s=1.4)=>`<svg style="position:absolute;left:${x}px;top:${y}px;transform:scale(${s});transform-origin:0 0" width="36" height="52" viewBox="0 0 12 19" shape-rendering="crispEdges"><path d="M0 0h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h-5v1h1v1h1v2h-1v1h-2v-1h-1v-2h-1v-1h-1v1h-1v1h-1z" fill="#000"/><path d="M1 2h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h-4v1h1v1h1v2h-1v-2h-1v-1h-1v-1h-2v1h-1v1h-1z" fill="#fff"/></svg>`;
function banner(w,t,o={}){const h=Math.round(w*60/468),fs=Math.round(h*.3);const blink=Math.floor(t*2.5)%2;
 return `<div style="width:${w}px;height:${h}px;background:linear-gradient(90deg,#000,#1B1450 60%,#3B2A86);border:3px solid #FFE45C;display:flex;align-items:center;justify-content:space-between;padding:0 ${h*.28}px;overflow:hidden">
 <div style="font-family:'DejaVu Sans',sans-serif;font-weight:700;font-size:${fs}px;line-height:1.15;color:#fff;width:${w*.64}px;text-align:left">${o.text??'Have you ever clicked your mouse right here?'}</div>
 <div style="font-family:'DejaVu Sans',sans-serif;font-weight:800;font-size:${fs*1.15}px;color:${blink?'#FFE45C':'#fff'};white-space:nowrap;opacity:${o.will??1}">&#8594; YOU WILL</div></div>`}
const lines=(n,c='#D5D5D5')=>Array(n).fill(0).map((_,k)=>`<div style="height:18px;background:${c};margin:14px 0;width:${[94,86,90,62,80][k%5]}%"></div>`).join('');
function browser(url,w,slot){return win('Netsite - '+url,w,`<div style="display:flex;gap:8px;padding:8px;background:#C3C3C3;border-bottom:3px solid #808080">${['Back','Fwd','Home','Reload'].map(b=>`<span class="btn" style="font-size:30px;padding:4px 14px">${b}</span>`).join('')}</div>
 <div class="px" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#C3C3C3;font-size:32px">Location: <span style="flex:1;background:#fff;border:3px solid;border-color:#808080 #fff #fff #808080;padding:0 10px">http://${url}/</span></div>
 <div style="padding:24px 30px"><div style="font-family:'Times New Roman',serif;font-weight:700;font-size:56px;color:#111">${url.split('.')[0].replace('hotwired','HotWired')}</div><div style="margin:18px 0">${slot||''}</div>${lines(4)}</div>`,{bs:'padding:0'})}
function counter(v,n=3){const s=String(v).padStart(n,'0');return `<div style="display:inline-flex;gap:6px;background:#000;padding:10px;border:3px solid #808080">${s.split('').map(c=>`<div class="px" style="width:110px;height:160px;background:linear-gradient(#222,#000 50%,#222);color:#7CFF6B;font-size:180px;line-height:160px;text-align:center;text-shadow:0 0 18px #3BDF2B">${c}</div>`).join('')}</div>`}
const dlg=(title,icon,msg,w=760)=>win(title,w,`<div style="display:flex;gap:28px;align-items:center;padding:30px 30px 10px"><div style="font-size:90px">${icon}</div><div style="font-weight:800;font-size:52px;line-height:1.1">${msg}</div></div><div style="text-align:center;padding:16px 0 24px"><span class="btn">OK</span></div>`,{nobody:true});
function phone(inner,w,h){return `<div style="width:${w}px;height:${h}px;border-radius:60px;background:#150C2B;padding:16px;box-shadow:0 40px 80px rgba(21,12,43,.3)"><div style="width:100%;height:100%;border-radius:46px;overflow:hidden;background:#fff;position:relative">${inner}</div></div>`}
const mbar=(w,c='#E8E5F0')=>`<div style="height:20px;width:${w}%;background:${c};border-radius:6px;margin:14px 0"></div>`;
const stampM=(t,fs=60)=>`<div class="h" style="font-size:${fs}px;padding:12px 30px;border:7px solid #E5484D;color:#E5484D;border-radius:16px;background:#fff;white-space:nowrap;letter-spacing:2px">${t}</div>`;
const SC=[
 // 0 hook: 1994 browser with the banner, cursor clicks, hit counter
 (p,t)=>{const m=eio((p-.08)/.42),cx=820-300*m,cy=1150-640*m,cl=p>.52&&p<.6;
  return pop(p,0,browser('hotwired.com',960,`<div style="transform:scale(${cl?.97:1})">${banner(880,t)}</div>`),540,380,{w:960,h:560})
  +(p>.05?CUR(cx,cy):'')+(cl?`<div style="position:absolute;left:${cx-30}px;top:${cy-30}px;width:90px;height:90px;border:5px solid #FFE45C;border-radius:50%"></div>`:'')
  +pop(p,.6,dlg('hits.exe','👆','Almost <span style="background:#FFE45C;padding:0 8px">half</span> of everyone<br>who saw it clicked.',820),540,980,{w:820,h:300,r:-2})},
 // 1 Oct 1994, first banner ad
 (p,t)=>pop(p,0,win('Calendar',560,`<div style="text-align:center;padding:20px"><div class="px" style="font-size:64px;background:#6557E8;color:#fff">OCTOBER</div><div class="px" style="font-size:260px;line-height:1">1994</div></div>`),540,400,{w:560,h:460,r:-2})
  +pop(p,.35,dlg('First!','🏆','The first banner ad<br>on the web.',800),540,960,{w:800,h:300,r:1.5}),
 // 2 HotWired = Wired magazine's website
 (p,t)=>pop(p,0,browser('hotwired.com',960,`<div style="height:110px;border:4px dashed #999"></div>`),540,380,{w:960,h:560})
  +(p>.4?`<div class="sticky" style="left:520px;top:${960}px;transform:rotate(-4deg) scale(${spring((p-.4)*3)})">Wired magazine,<br>but online</div>`:''),
 // 3 problem
 (p,t)=>pop(p,0,win('Readers.txt',430,`<div style="text-align:center;padding:30px 10px"><div style="font-size:90px">📖</div><div class="h" style="font-size:44px;margin-top:10px">Readers pay</div><div class="px" style="font-size:150px;color:#0A8A3A;line-height:1">$0</div></div>`),300,390,{w:430,h:420,r:-2})
  +pop(p,.25,win('Writers.txt',430,`<div style="text-align:center;padding:30px 10px"><div style="font-size:90px">✍️</div><div class="h" style="font-size:44px;margin-top:10px">Writers need</div><div class="px" style="font-size:150px;color:#C0182B;line-height:1">$$$</div></div>`),780,430,{w:430,h:420,r:2})
  +pop(p,.6,dlg('Error','⚠️','So who pays<br>the writers?',780),540,960,{w:780,h:300}),
 // 4 sell space
 (p,t)=>{const on=p>.3,bl=Math.floor(t*3)%2;return pop(p,0,browser('hotwired.com',960,`<div style="height:110px;border:4px ${on?'solid #6557E8':'dashed #999'};background:${on?(bl?'#ECE8FF':'#fff'):'#fff'};display:flex;align-items:center;justify-content:center" class="px"><span style="font-size:60px;color:#6557E8">${on?'AD SPACE FOR SALE':''}</span></div>`),540,380,{w:960,h:560})
  +(p>.55?`<div class="sticky" style="left:470px;top:960px;transform:rotate(3deg) scale(${spring((p-.55)*3)})">just like a<br>magazine page</div>`:'')},
 // 5 price: calculator
 (p,t)=>{const v=Math.round(30000*eio((p-.15)/.45)/100)*100;return pop(p,0,win('Calculator',820,`<div style="padding:20px"><div class="px" style="background:#C9E4C3;border:3px solid;border-color:#808080 #fff #fff #808080;font-size:170px;text-align:right;padding:0 24px;line-height:1.1;color:#111">$${v.toLocaleString('en-US')}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px">${['7','8','9','÷','4','5','6','×','1','2','3','−'].map(k=>`<span class="btn" style="text-align:center;font-size:48px;padding:6px 0">${k}</span>`).join('')}</div></div>`,{nobody:true}),540,380,{w:820,h:640,r:-1.5})
  +(p>.5?`<div class="sticky" style="left:560px;top:1000px;transform:rotate(-3deg) scale(${spring((p-.5)*3)})">for 3 months<br><span style="font-size:32px;font-weight:600">(reportedly)</span></div>`:'')},
 // 6 the ad copy typed in notepad, then the banner
 (p,t)=>{const tx='Have you ever clicked your mouse right here?'.slice(0,Math.floor(44*clamp((p-.2)/.48)));const cur=Math.floor(t*3)%2?'|':'';
  return pop(p,0,win('ad_copy.txt - Notepad',960,`<div class="px" style="padding:24px 30px;font-size:66px;line-height:1.1;min-height:270px;color:#111">AT&amp;T banner, 1994<br>&gt; ${tx}${p<.7?cur:''}</div>`),540,380,{w:960,h:420,r:-1})
  +(p>.8?`<div style="position:absolute;left:540px;top:900px;transform:translateX(-50%) rotate(-3deg) scale(${spring((p-.8)*4)})"><div class="h" style="font-size:170px;color:#FFE45C;text-shadow:8px 8px 0 #000;white-space:nowrap">You will.</div></div>`:'')},
 // 7 no product, no price, 44% hit counter
 (p,t)=>{const v=Math.round(44*eio((p-.66)/.22));const ck=(s,d)=>`<div style="display:flex;align-items:center;gap:20px;margin:12px 0;font-weight:800;font-size:56px"><span style="width:60px;height:60px;background:#fff;border:3px solid;border-color:#808080 #fff #fff #808080;color:#C0182B;font-size:56px;line-height:52px;text-align:center">${p>d?'✕':''}</span>${s}</div>`;
  return pop(p,0,win('pitch_checklist',620,`<div style="padding:20px 34px">${ck('Product',.08)}${ck('Price',.18)}</div>`),540,390,{w:620,h:300,r:-1.5})
  +pop(p,.6,`<div style="text-align:center;transform:scale(1.45);transform-origin:50% 0"><div class="px" style="font-size:54px;color:#fff;text-shadow:4px 4px 0 #000;margin-bottom:12px">PEOPLE WHO CLICKED</div>${counter(v,2)}<span class="px" style="font-size:180px;color:#fff;text-shadow:8px 8px 0 #000;vertical-align:top;margin-left:18px">%</span></div>`,540,780,{w:700,h:360})},
 // ===== TODAY (modern) =====
 // 8 under 1 in 100
 (p,t)=>{const a=ease((p-.08)*2.5),b=ease((p-.3)*3);const row=(l,v,w,c)=>`<div style="display:flex;align-items:center;gap:24px;margin:18px 0"><div class="h" style="font-size:48px;width:150px;text-align:right">${l}</div><div style="width:520px;height:80px;border-radius:18px;background:#F1EEF9;overflow:hidden"><div style="height:100%;width:${w}%;background:${c};border-radius:18px"></div></div><div class="h" style="font-size:52px;width:130px">${v}</div></div>`;
  return at(p,0,`<div class="card" style="padding:40px 40px">${row('1994','44%',44*a,'#B9A6FF')}${row('Today','&lt;1%',Math.max(.8,b),'#E5484D')}</div>`,540,390)
  +at(p,.38,'<div class="h" style="font-size:136px;color:#150C2B;white-space:nowrap"><span class="hl">&lt; 1 in 100</span></div>',540,780,{r:-2})
  +at(p,.58,'<div class="pill">people click a banner ad now</div>',540,1010,{r:2})},
 // 9 banner blindness
 (p,t)=>{const b=clamp((p-.42)*3);return at(p,0,`<div class="card" style="width:920px;padding:36px 40px;position:relative"><div style="height:130px;border-radius:16px;background:linear-gradient(90deg,#FF4D6D,#FFB020);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:46px;color:#fff;filter:blur(${b*9}px) grayscale(${b});opacity:${1-.7*b}">BIG SALE! CLICK NOW!</div><div class="h" style="font-size:56px;margin-top:34px;color:#150C2B">How to fix a leaking tap</div>${mbar(96)}${mbar(88)}${mbar(92)}${mbar(64)}
  ${[[120,250,.15],[430,330,.25],[250,400,.33]].map(([x,y,d])=>`<div style="position:absolute;left:${x}px;top:${y}px;width:240px;height:120px;border-radius:50%;background:radial-gradient(closest-side,rgba(101,87,232,.45),rgba(185,166,255,.2),transparent);opacity:${clamp((p-d)*4)}"></div>`).join('')}</div>`,540,390)
  +at(p,.48,stampM('👁 SKIPPED',64),740,410,{r:-7})
  +at(p,.6,'<div class="pill">eyes go straight to the content</div>',540,1030,{r:-2})},
 // 10 your site: key info in a flashy box gets scrolled past
 (p,t)=>{const sc=eio((p-.35)/.45)*280,b=clamp((p-.45)*3);return at(p,0,phone(`<div style="transform:translateY(${-sc}px);color:#150C2B"><div style="padding:56px 26px 20px;display:flex;justify-content:space-between;border-bottom:2px solid #eee"><b style="font-size:32px">Harbour Plumbing</b><span style="font-size:32px">☰</span></div>
   <div style="margin:22px;padding:26px;border-radius:18px;background:linear-gradient(135deg,#FF2D7A,#FFB020);color:#fff;text-align:center;filter:blur(${b*5}px);opacity:${1-.6*b}"><div style="font-size:36px;font-weight:900">🔥 HOT DEAL 🔥</div><div style="font-size:27px;font-weight:700;margin-top:8px">Open 24/7 · Same day call outs</div></div>
   <div style="padding:6px 26px"><div style="font-size:42px;font-weight:800;line-height:1.1">Blocked drain? Burst pipe?</div>${mbar(90)}${mbar(80)}${mbar(86)}<div style="height:230px;border-radius:16px;background:linear-gradient(160deg,#C8D3E6,#8EA1C4);margin-top:20px"></div>${mbar(75)}${mbar(88)}</div></div>`,480,800),540,370)
  +at(p,.6,stampM('KEY INFO MISSED',54),540,1110,{r:-4})},
 // 11 CTA
 (p,t)=>at(p,0,'<div class="h" style="font-size:118px;color:#150C2B;text-align:center;width:980px">Clear <span class="hl">beats</span><br>flashy.</div>',540,390)
  +at(p,.3,`<div style="transform:rotate(-3deg)">${banner(760,t)}</div>`,540,680,{r:-3})
  +at(p,.45,'<div class="h" style="font-size:78px;color:#6557E8;white-space:nowrap">Would you have clicked?</div>',540,860)
  +at(p,.62,'<div style="border-radius:999px;padding:26px 56px;font-size:52px;font-weight:800;white-space:nowrap;background:#6557E8;color:#fff;box-shadow:0 18px 40px rgba(101,87,232,.45)">+ Follow @nexaweb_dev</div>',540,1010),
];
function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 const modern=i>=MOD; document.body.className=modern?'modern':'';
 if(modern) BG.style.cssText=`background:radial-gradient(900px 700px at 50% 40%,#FFFFFF,#F2EFFA 70%,#E9E5F5)`;
 else BG.style.cssText=`background-color:#1F7A7A;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:12px 12px;background-position:0 ${Math.floor(t*4)*2}px`;
 // progress: blocky in retro, smooth in modern
 const f=t/DATA.total; PR.innerHTML=modern?`<div style="height:100%;width:${f*100}%;background:#6557E8;border-radius:6px"></div>`:'<b></b>'.repeat(Math.floor(f*35));
 const zoom=modern?1+0.025*p:1;
 S.innerHTML=`<div style="position:absolute;inset:0;transform:scale(${zoom});transform-origin:540px 760px">${SC[i](p,t)}</div>`;
 // transitions: retro = brief dither flash; switch to modern = CRT power-off/on
 let fx='';
 if(i===MOD&&lt<.35){const q=lt/.35;fx=`<div style="position:absolute;inset:0;background:#000;opacity:${1-ease(q)}"></div><div style="position:absolute;left:0;right:0;top:${960-480*(1-q)*0}px;height:${Math.max(6,1920*ease(q))}px;transform:translateY(-50%);background:#fff;opacity:${(1-q)*.9}"></div>`}
 else if(i>0&&lt<.1&&!modern) fx=`<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 3px,transparent 3px 9px)"></div>`;
 else if(modern&&i>MOD&&lt<.15) fx=`<div style="position:absolute;inset:0;background:rgba(185,166,255,${.25*(1-lt/.15)})"></div>`;
 FX.innerHTML=fx;
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop})">${w.w}</span>`}).join(' ');
};
window.fontsReady=document.fonts.load('40px VT').then(()=>document.fonts.ready);
