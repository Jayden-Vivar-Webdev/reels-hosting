<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0A0616}
#bg,#orbs,#grid,#parts,#stage,#vig{position:absolute;inset:0}
#bg{background:radial-gradient(1200px 900px at 50% 35%,#1B1036 0%,#110A24 45%,#0A0616 100%)}
#grid{perspective:900px;overflow:hidden}
#floor{position:absolute;left:-600px;right:-600px;top:1150px;height:1400px;transform-origin:50% 0;transform:rotateX(72deg);
 background-image:linear-gradient(rgba(140,120,255,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(140,120,255,.22) 2px,transparent 2px);background-size:90px 90px;
 -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 75%)}
#vig{background:radial-gradient(1100px 1500px at 50% 45%,transparent 55%,rgba(5,2,12,.75) 100%);pointer-events:none}
.lab{position:absolute;left:0;right:0;top:300px;text-align:center;font-weight:700;font-size:30px;letter-spacing:10px;color:#B9A6FF}
.lab i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#8B7BFF;margin-right:16px;vertical-align:4px;box-shadow:0 0 0 6px rgba(139,123,255,.18),0 0 24px #8B7BFF}
.h{font-weight:800;letter-spacing:-.045em;line-height:.98;color:#fff}
.grad{background:linear-gradient(100deg,#fff 10%,#CFC3FF 50%,#8B7BFF 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{display:inline-block;background:linear-gradient(135deg,#7C6CFF,#5845E0);color:#fff;padding:0 .16em .05em;border-radius:.14em;box-shadow:0 10px 40px rgba(101,87,232,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1.5px solid rgba(185,166,255,.22);border-radius:36px;
 box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.2),0 0 80px rgba(101,87,232,.18),inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden;backdrop-filter:blur(18px)}
.mono{font-family:'DejaVu Sans Mono',monospace}
.chip{display:inline-block;border-radius:999px;padding:16px 34px;font-weight:700;font-size:38px;white-space:nowrap;background:rgba(139,123,255,.16);border:1.5px solid rgba(185,166,255,.35);color:#DCD3FF;box-shadow:0 0 40px rgba(101,87,232,.25)}
.bar{height:78px;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1.5px solid rgba(185,166,255,.14);background:rgba(255,255,255,.03)}
.bar s{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-block}
.url{margin-left:16px;flex:1;height:44px;border-radius:12px;background:rgba(0,0,0,.25);display:flex;align-items:center;padding:0 18px;font-size:24px;color:#9C92C8}
.muted{color:#9C92C8}
.ok{color:#4BE39A}
.bad{color:#FF5C7A}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.14;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#cap span{display:inline-block;margin:0 .1em}
#cap span.k{background:linear-gradient(135deg,#7C6CFF,#5845E0);color:#fff;padding:0 .12em .05em;border-radius:.12em;text-shadow:none;box-shadow:0 8px 30px rgba(101,87,232,.5)}
#tag{position:absolute;left:60px;top:232px;font-weight:700;font-size:26px;letter-spacing:5px;color:rgba(220,211,255,.55)}
#tag b{color:#8B7BFF}
#prog{position:absolute;left:60px;right:60px;top:276px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#prog i{display:block;height:100%;background:linear-gradient(90deg,#5845E0,#B9A6FF);box-shadow:0 0 12px #8B7BFF}
</style></head><body>
<div id="bg"></div><div id="orbs"></div><div id="grid"><div id="floor"></div></div><div id="parts"></div>
<div id="stage"></div><div id="vig"></div>
<div id="tag"><b>●</b> INTERNET STORIES · EP.3</div><div id="prog"><i></i></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const S=$('stage'),C=$('cap'),O=$('orbs'),P=$('parts'),F=$('floor'),PR=$('prog').firstChild;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6.5*x)*Math.cos(7.5*x)};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
// 3D entrance: rotateX flip-up + blur, then gentle float
function at(p,d,html,x,y,o={}){
 const s=spring((p-d)*3.2),e=ease((p-d)*4),tt=o.t||0;
 const fl=Math.sin((tt+d*7)*1.3)*(o.float??6);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${(1-s)*(o.dy??90)+fl}px) perspective(1400px) rotateX(${(1-s)*(o.rx??28)}deg) rotateZ(${(o.r||0)*(1-s)}deg) scale(${0.86+0.14*s});opacity:${clamp(e*1.6)};filter:blur(${(1-e)*14}px);transform-origin:50% 100%;${o.css||''}">${html}</div>`}
// moving light sweep over a card
const shine=(p,d=0)=>{const x=-60+clamp((p-d-.08)/.35)*220;return `<div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent ${x-18}%,rgba(255,255,255,.13) ${x}%,transparent ${x+18}%)"></div>`};
function lab(t,p){const e=ease(p*5);return `<div class="lab" style="opacity:${e};letter-spacing:${10+(1-e)*14}px"><i></i>${t}</div>`}
function typed(t,p,a,b){return t.slice(0,Math.floor(t.length*clamp((p-a)/(b-a))))}
const caret=t=>`<span style="display:inline-block;width:4px;height:1em;background:#B9A6FF;vertical-align:-.12em;box-shadow:0 0 10px #B9A6FF;opacity:${Math.floor(t*3)%2}"></span>`;
function browser(w,url,inner,p){return `<div class="glass" style="width:${w}px"><div class="bar"><s style="background:#FF5C7A"></s><s style="background:#FFC24B"></s><s style="background:#4BE39A"></s><div class="url mono">🔒 ${url}</div></div>${inner}${shine(p,0)}</div>`}
function search(q,res,p,t){return browser(900,'domains.google',`<div style="padding:46px"><div class="h" style="font-size:56px">Find your perfect domain</div><div style="margin-top:30px;border:2px solid rgba(185,166,255,.5);border-radius:20px;padding:22px 28px;font-size:46px;font-weight:700;background:rgba(0,0,0,.25);box-shadow:0 0 0 6px rgba(139,123,255,.12)" class="mono">${q}${res?'':caret(t)}</div>${res||''}</div>`,p)}
const RES=(s,t)=>`<div style="margin-top:30px;display:flex;align-items:center;justify-content:space-between;background:rgba(75,227,154,.08);border:1.5px solid rgba(75,227,154,.35);border-radius:22px;padding:24px 30px;transform:scale(${.9+.1*s});opacity:${clamp(s*2)};box-shadow:0 0 ${30+10*Math.sin(t*6)}px rgba(75,227,154,.25)"><div><div class="mono" style="font-size:40px;font-weight:700">google.com</div><div class="ok" style="font-size:32px;font-weight:700;margin-top:6px">● Available</div></div><div class="h" style="font-size:76px">$12</div></div>`;
function morph(p){const src='6,006.13'.split(''),L={0:'G',2:'O',3:'O',4:'G',6:'L',7:'E'};let h='',k=0;const m0=clamp((p-.6)/.1);
 src.forEach((c,i)=>{if(!(i in L)){h+=`<span style="display:inline-block;overflow:hidden;width:${(1-m0)*.6}em;opacity:${1-m0}">${c}</span>`;return}
  const m=clamp((p-.64-k*.035)/.12);k++;
  h+=`<span style="position:relative;display:inline-block;width:.62em;text-align:center"><span style="position:absolute;left:0;right:0;opacity:${1-m};filter:blur(${m*12}px);transform:translateY(${-m*30}px)">${c}</span><span class="grad" style="display:inline-block;opacity:${m};filter:blur(${(1-m)*12}px);transform:translateY(${(1-m)*30}px)">${L[i]}</span></span>`});return h}
function ring(x,y,p,d,col='139,123,255'){const q=clamp((p-d)/.35);return q<=0||q>=1?'':`<div style="position:absolute;left:${x}px;top:${y}px;width:${200+700*ease(q)}px;height:${200+700*ease(q)}px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(${col},${.7*(1-q)});box-shadow:0 0 40px rgba(${col},${.5*(1-q)})"></div>`}
const SC=[
 // 0 hook
 (p,t)=>lab('DID YOU KNOW',p)+ring(540,700,p,.4)+at(p,0,'<div class="h" style="font-size:150px;text-align:left;width:940px">someone<br>bought<br><span class="box">google.com</span></div>',80,400,{c:false,t})
   +at(p,.4,`<div class="glass" style="padding:26px 60px;border-radius:999px;white-space:nowrap"><span class="h" style="font-size:96px">for <span class="grad">$${Math.round(12*ease((p-.4)*4))}</span></span>${shine(p,.4)}</div>`,690,1030,{r:5,t}),
 // 1 Google Domains service
 (p,t)=>{const tl=['.com','.net','.com.au','.io','.store'];let ch='';tl.forEach((x,i)=>{const s=spring(p*3-.6-i*.18);ch+=`<span class="chip mono" style="display:inline-block;margin:10px;font-size:36px;transform:translateY(${(1-s)*40}px) scale(${.8+.2*s});opacity:${clamp(s*2)}">${x}</span>`});
  return lab('2015',p)+at(p,0,`<div class="glass" style="width:900px;padding:56px;text-align:center"><div class="muted" style="font-size:32px;font-weight:700;letter-spacing:6px">GOOGLE'S OWN SERVICE</div><div class="h" style="font-size:110px;margin-top:18px">Google <span class="grad">Domains</span></div><div style="font-size:42px;font-weight:600;margin-top:22px;color:#DCD3FF">buy a web address for your site</div>${shine(p)}</div>`,540,400,{t})
   +`<div style="position:absolute;left:90px;width:900px;top:900px;text-align:center">${ch}</div>`},
 // 2 typed google.com
 (p,t)=>lab('A FORMER GOOGLE EMPLOYEE',p)+at(p,0,search(typed('google.com',p,.25,.6),'',p,t),540,400,{t})
   +at(p,.75,'<div class="chip">👀 just to see</div>',540,1000,{r:-3,t}),
 // 3 available, bought
 (p,t)=>at(p,0,search('google.com',RES(spring((p-.08)*3),t),p,t),540,360,{t,rx:0,dy:20})+ring(540,600,p,.1,'75,227,154')
   +at(p,.72,`<div class="glass" style="border-radius:999px;padding:26px 60px;white-space:nowrap;background:linear-gradient(135deg,#2BC77F,#1E9E63);border-color:rgba(255,255,255,.3);box-shadow:0 20px 60px rgba(43,199,127,.45)"><span class="h" style="font-size:80px">✓ bought</span></div>`,540,1010,{r:-4,t}),
 // 4 one minute
 (p,t)=>{const s=clamp((p-.15)/.7),sec=Math.min(59,Math.floor(s*60)),arc=s*360;
  return at(p,0,browser(900,'domains.google/checkout',`<div style="padding:40px 46px;display:flex;align-items:center;gap:30px"><div style="width:90px;height:90px;border-radius:50%;background:rgba(75,227,154,.15);border:2px solid #4BE39A;display:flex;align-items:center;justify-content:center;font-size:50px" class="ok">✓</div><div><div class="muted" style="font-size:32px;font-weight:700">Order complete</div><div class="mono" style="font-size:50px;font-weight:700;margin-top:6px">google.com</div><div style="font-size:30px;font-weight:700;margin-top:6px">Owner: <span style="color:#B9A6FF">him</span></div></div></div>`,p),540,350,{t})
  +at(p,.1,`<div style="position:relative;width:400px;height:400px;border-radius:50%;background:conic-gradient(#8B7BFF ${arc}deg,rgba(255,255,255,.07) ${arc}deg);box-shadow:0 0 80px rgba(101,87,232,.45)"><div style="position:absolute;inset:16px;border-radius:50%;background:#140B2A;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="muted" style="font-size:26px;font-weight:700;letter-spacing:6px">TIME OWNED</div><div class="h mono" style="font-size:110px;letter-spacing:-4px">0:${String(sec).padStart(2,'0')}</div></div></div>`,540,700,{t,float:4})
  +at(p,.5,'<div class="chip">🌍 the most visited site on Earth</div>',540,1150,{t})},
 // 5 cancelled
 (p,t)=>{const g=p>.3&&p<.5?Math.sin(t*90)*14:0;return lab('NEW EMAIL',p)+at(p,0,`<div class="glass" style="width:900px;padding:44px"><div style="display:flex;gap:22px;align-items:center"><div style="width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#7C6CFF,#5845E0);font-weight:800;font-size:42px;display:flex;align-items:center;justify-content:center">G</div><div><div style="font-weight:700;font-size:38px">Google Domains</div><div class="muted" style="font-size:30px">to him · 1 min later</div></div><div class="muted" style="margin-left:auto;font-size:28px">now</div></div><div style="margin-top:34px;font-size:46px;font-weight:700">Your order has been cancelled.</div><div style="margin-top:18px;height:18px;width:80%;background:rgba(255,255,255,.08);border-radius:8px"></div><div style="margin-top:12px;height:18px;width:58%;background:rgba(255,255,255,.08);border-radius:8px"></div>${shine(p)}</div>`,540,400,{t})
  +at(p,.3,`<div class="h" style="font-size:170px;color:#FF5C7A;text-shadow:${g}px 0 0 rgba(0,255,255,.7),${-g}px 0 0 rgba(255,0,120,.7),0 0 60px rgba(255,92,122,.6);white-space:nowrap;transform:skewX(${g*.4}deg)">cancelled.</div>`,540,920,{r:-5,t})},
 // 6 reward
 (p,t)=>lab('THE REWARD',p)+ring(540,560,p,.62)+at(p,0,`<div class="glass" style="width:920px;padding:56px 30px;text-align:center"><div class="h mono" style="font-size:150px;letter-spacing:-6px;white-space:nowrap">$${morph(p)}</div>${shine(p,.62)}</div>`,540,430,{t,float:3})
   +at(p,.6,'<div style="font-family:Lora;font-style:italic;font-size:96px;color:#CFC3FF;white-space:nowrap">squint a little…</div>',540,820,{t})
   +at(p,.82,'<div class="chip" style="font-size:34px">6=G · 0=O · 0=O · 6=G · 1=L · 3=E</div>',540,1000,{t}),
 // 7 charity doubled
 (p,t)=>{const v=p<.42?6006.13:6006.13+6006.13*ease((p-.42)*3);
  return lab('THEN',p)+at(p,0,`<div class="glass" style="width:880px;padding:50px;text-align:center"><div style="font-size:130px;line-height:1;filter:drop-shadow(0 0 30px rgba(255,92,122,.6))">❤️</div><div class="h" style="font-size:76px;margin-top:20px">donated to charity</div>${shine(p)}</div>`,540,390,{t})
   +ring(540,920,p,.42)+at(p,.4,'<div class="h box" style="font-size:180px;padding:0 50px 20px;border-radius:40px">×2</div>',540,820,{r:-6,t})
   +at(p,.55,`<div class="chip" style="font-size:52px">$${v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} total</div>`,540,1110,{t})},
 // 8 1999 passport.com expired
 (p,t)=>{const fl=(Math.floor(t*12)%7==0)?.55:1;return lab('DECEMBER 1999',p)+at(p,0,'<div class="chip" style="font-size:44px">Microsoft forgot to renew…</div>',540,380,{t})+at(p,.15,`<div class="glass" style="width:900px;height:520px;border-color:rgba(255,92,122,.35);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 90px rgba(255,92,122,.22)"><div class="bar"><s style="background:#FF5C7A"></s><s></s><s></s><div class="url mono">passport.com</div></div><div style="padding:50px;text-align:center;opacity:${fl}"><div style="font-size:110px;filter:drop-shadow(0 0 24px rgba(255,92,122,.7))">⚠️</div><div class="mono" style="font-size:46px;font-weight:700;margin-top:20px">Server not found</div><div class="mono bad" style="font-size:30px;margin-top:18px">domain registration expired</div></div></div>`,540,520,{t})},
 // 9 why it mattered: Hotmail login flow
 (p,t)=>{const node=(d,html,y,col)=>at(p,d,`<div class="glass" style="width:720px;padding:30px 40px;display:flex;align-items:center;gap:26px;${col?`border-color:rgba(${col},.5);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 60px rgba(${col},.3)`:''}">${html}</div>`,540,y,{t,float:3});
  const arrow=(d,y)=>{const s=clamp((p-d)/.12);return `<div style="position:absolute;left:537px;top:${y}px;width:6px;height:${70*s}px;border-radius:3px;background:linear-gradient(#8B7BFF,#B9A6FF);box-shadow:0 0 14px #8B7BFF"></div>`};
  return lab('WHY IT MATTERED',p)+node(0,'<span style="font-size:64px">📧</span><div><div style="font-size:46px;font-weight:800">Hotmail sign-in</div><div class="muted" style="font-size:30px">millions of inboxes</div></div>',380)
   +arrow(.18,560)+node(.22,'<span style="font-size:64px">🔑</span><div><div class="mono" style="font-size:44px;font-weight:700">passport.com</div><div class="bad" style="font-size:30px;font-weight:700">expired ✕</div></div>',640,'255,92,122')
   +arrow(.55,820)+node(.6,'<span style="font-size:64px">🔒</span><div><div style="font-size:46px;font-weight:800;color:#FF8FA3">locked out of email</div><div class="muted" style="font-size:30px">for many users</div></div>',900,'255,92,122')},
 // 10 programmer paid $35, handed back
 (p,t)=>lab('A STRANGER FIXED IT',p)+at(p,0,`<div class="glass" style="width:800px;padding:46px 56px"><div class="muted" style="font-size:30px;font-weight:700;letter-spacing:8px">RECEIPT</div><div class="mono" style="margin-top:24px;font-size:42px;font-weight:700">passport.com renewal</div><div style="border-top:2px dashed rgba(185,166,255,.3);margin:26px 0"></div><div style="display:flex;justify-content:space-between"><span style="font-size:40px;font-weight:700">Paid by</span><span style="font-size:40px;font-weight:700;color:#B9A6FF">a random programmer</span></div>${shine(p)}</div>`,540,390,{r:-2,t})
   +ring(540,860,p,.3)+at(p,.28,`<div class="h grad" style="font-size:190px;letter-spacing:-8px">$${Math.round(35*ease((p-.28)*4))}</div>`,540,750,{r:4,t})
   +at(p,.62,'<div class="chip" style="font-size:42px;background:rgba(75,227,154,.12);border-color:rgba(75,227,154,.45);color:#B8F5D6">↩ handed back to Microsoft</div>',540,1030,{t}),
 // 11 lesson
 (p,t)=>lab('THE LESSON',p)+at(p,0,'<div class="h" style="font-size:122px;text-align:left;width:920px">domain expires?</div>',80,420,{c:false,t})
   +at(p,.3,'<div class="h" style="font-size:122px;text-align:left;width:920px;color:#B9A6FF">your website<br>and email</div>',80,560,{c:false,t})
   +at(p,.65,'<div class="h" style="font-size:122px"><span class="box">go with it.</span></div>',80,840,{c:false,t}),
 // 12 CTA toggle
 (p,t)=>{const on=eio((p-.2)/.12);return lab('DO THIS TODAY',p)+ring(780,560,p,.25,'75,227,154')+at(p,0,`<div class="glass" style="width:880px;padding:46px 54px"><div class="mono" style="font-size:42px;font-weight:700">yourbusiness.com.au</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:34px"><span style="font-size:52px;font-weight:700">Auto-renew</span><span style="width:176px;height:94px;border-radius:999px;background:${on>.5?'#2BC77F':'rgba(255,255,255,.14)'};position:relative;display:inline-block;box-shadow:${on>.5?'0 0 40px rgba(75,227,154,.6)':'none'}"><span style="position:absolute;top:9px;left:${9+on*82}px;width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.35)"></span></span></div><div style="margin-top:20px;font-size:34px;font-weight:700" class="${on>.5?'ok':'muted'}">${on>.5?'● On. You\'re covered.':'○ Off'}</div>${shine(p,.3)}</div>`,540,400,{t})
  +at(p,.5,'<div class="glass" style="border-radius:999px;padding:26px 54px;font-size:50px;font-weight:800;white-space:nowrap;background:linear-gradient(135deg,#7C6CFF,#5845E0);border-color:rgba(255,255,255,.3);box-shadow:0 20px 60px rgba(101,87,232,.6)">+ Follow @nexaweb_dev</div>',540,960,{t})},
];
function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 // background motion
 O.innerHTML=[[30,22,'101,87,232',.55,900],[78,60,'139,80,255',.38,800],[20,80,'60,120,255',.25,700]].map(([x,y,c,a,r],k)=>{const X=x+8*Math.sin(t*.25+k*2),Y=y+6*Math.cos(t*.2+k);return `<div style="position:absolute;left:${X}%;top:${Y}%;width:${r}px;height:${r}px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(${c},${a}),transparent 65%);filter:blur(30px)"></div>`}).join('');
 F.style.backgroundPosition=`0 ${(t*40)%90}px`;
