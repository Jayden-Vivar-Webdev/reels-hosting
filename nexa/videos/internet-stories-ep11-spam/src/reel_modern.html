  return at(p,0,'<div class="pill" style="background:#150C2B;color:#B9A6FF">🇦🇺 AUSTRALIA · SPAM ACT</div>',540,310,{r:-2})
  +at(p,.05,`<div class="card" style="width:860px;padding:20px 50px 30px">${row('🙋','Get consent',.22,0)}${row('🏷️','Say who you are',.42,0)}${row('🔗','Working unsubscribe',.62,1)}</div>`,540,440)
  +at(p,.75,`<div class="card" style="width:700px;padding:30px 40px;font-size:30px;color:#6E6790;font-weight:600;text-align:center">Saltbush Plumbing · Wollongong<br><span style="color:#6557E8;text-decoration:underline;font-weight:800">Unsubscribe</span></div>`,540,1000,{r:1})},
 // 12 CTA
 (p,t)=>at(p,0,'<div class="h" style="font-size:104px;color:#150C2B;text-align:center;width:980px;line-height:1.05">Ever been <span class="hl">spammed</span> by a business?</div>',540,340)
  +at(p,.2,`<div style="display:flex;gap:10px">${[0,1,2].map(k=>`<div style="transform:translateY(${Math.sin(t*3+k)*12}px)">${ENV(200,(k-1)*10)}</div>`).join('')}</div>`,540,720)
  +at(p,.5,'<div style="border-radius:999px;padding:26px 56px;font-size:52px;font-weight:800;white-space:nowrap;background:#6557E8;color:#fff;box-shadow:0 18px 40px rgba(101,87,232,.45)">+ Follow @nexaweb_dev</div>',540,1080),
];

function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 const modern=i>=MOD; document.body.className=modern?'modern':'';
 if(modern) BG.style.cssText=`background:radial-gradient(700px 600px at ${30+6*Math.sin(t*.3)}% 30%,rgba(185,166,255,.35),transparent 70%),radial-gradient(800px 700px at ${75+5*Math.cos(t*.25)}% 75%,rgba(101,87,232,.14),transparent 70%),linear-gradient(#FAF9FE,#EFECF8)`;
 else BG.style.cssText=`background-color:#1F7A7A;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:12px 12px;background-position:0 ${Math.floor(t*4)*2}px`;
 // progress: blocky in retro, smooth in modern
 const f=t/DATA.total; PR.innerHTML=modern?`<div style="height:100%;width:${f*100}%;background:#6557E8;border-radius:6px"></div>`:'<b></b>'.repeat(Math.floor(f*35));
 const zoom=1+0.025*p;
 const out=nx?clamp((t-(end-0.16))/0.16):0;S.innerHTML=`<div style="position:absolute;inset:0;opacity:${1-out};transform:scale(${zoom*(1+out*.04)}) translateY(${-out*24}px);transform-origin:540px 760px">${SC[i](p,t)}</div>`;
 // transitions: retro = brief dither flash; switch to modern = CRT power-off/on
 let fx='';
 if(false){const q=lt/.35;fx=`<div style="position:absolute;inset:0;background:#000;opacity:${1-ease(q)}"></div><div style="position:absolute;left:0;right:0;top:${960-480*(1-q)*0}px;height:${Math.max(6,1920*ease(q))}px;transform:translateY(-50%);background:#fff;opacity:${(1-q)*.9}"></div>`}
 else if(i>0&&lt<.1&&!modern) fx=`<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 3px,transparent 3px 9px)"></div>`;
 else if(i>0&&lt<.15) fx=`<div style="position:absolute;inset:0;background:rgba(185,166,255,${.25*(1-lt/.15)})"></div>`;
 FX.innerHTML=fx;
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop})">${w.w}</span>`}).join(' ');
};
window.fontsReady=document.fonts.load('40px VT').then(()=>document.fonts.ready);
</script></body></html>
