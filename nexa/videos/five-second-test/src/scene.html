<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans','Inter',sans-serif;color:#150C2B;background:#FAF9F6}
#stage{position:absolute;inset:0}
.I{color:#6557E8}
.lab{position:absolute;left:0;right:0;top:285px;text-align:center;font-weight:800;font-size:34px;letter-spacing:8px;color:#6557E8}
.h{font-weight:800;letter-spacing:-.045em;line-height:1;color:#150C2B}
.box{display:inline-block;background:#6557E8;color:#fff;padding:0 .14em .06em;border-radius:.12em}
.lav{display:inline-block;background:#B9A6FF;color:#150C2B;padding:0 .14em .06em;border-radius:.12em}
.card{background:#fff;border-radius:34px;box-shadow:0 30px 60px rgba(21,12,43,.13);border:2px solid rgba(21,12,43,.07)}
.chip{display:inline-block;background:#150C2B;color:#fff;border-radius:999px;padding:18px 40px;font-weight:800;font-size:44px;white-space:nowrap}
.stamp{display:inline-block;border:8px solid #E5484D;color:#E5484D;border-radius:20px;padding:4px 30px 10px;font-weight:800;font-size:90px;letter-spacing:3px;background:rgba(250,249,246,.92);white-space:nowrap}
.bar{height:20px;border-radius:10px;background:#ECEAF3}
.dv{font-family:'Times New Roman','DejaVu Serif',serif}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:82px;letter-spacing:-.04em;line-height:1.14}
#cap span{display:inline-block;margin:0 .1em}
#cap span.k{background:#6557E8;color:#fff;padding:0 .12em .05em;border-radius:.12em}
#tag{position:absolute;left:870px;top:214px;font-weight:800;font-size:44px;letter-spacing:-2px}
#ser{position:absolute;left:90px;top:228px;font-weight:700;font-size:28px;letter-spacing:4px;color:rgba(21,12,43,.45)}
</style></head><body>
<div id="stage"></div>
<div id="ser">5 SECOND TEST</div>
<div id="tag">nexa<span class="I">.</span></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const S=document.getElementById('stage'),C=document.getElementById('cap');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const spring=x=>{x=clamp(x);return 1-Math.exp(-7*x)*Math.cos(8*x)};
function at(p,d,html,x,y,o={}){const s=spring((p-d)*3.4),ty=(1-s)*(o.dy??60);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${ty}px) scale(${0.9+0.1*s}) rotate(${(o.r||0)*(1-s)+(o.rr||0)}deg);opacity:${clamp(s*2.5)};${o.css||''}">${html}</div>`}
function browser(w,h,inner,url='kestrelphysio.com.au'){return `<div class="card" style="position:relative;width:${w}px;height:${h}px;overflow:hidden"><div style="height:64px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:2px solid #EEECF4;background:#fff"><s style="width:16px;height:16px;border-radius:50%;background:#E5484D"></s><s style="width:16px;height:16px;border-radius:50%;background:#ECEAF3"></s><s style="width:16px;height:16px;border-radius:50%;background:#ECEAF3"></s><span style="margin-left:18px;font-size:23px;color:#8F8AA3;background:#F4F3F8;border-radius:12px;padding:6px 22px">${url}</span></div>${inner}</div>`}
function cursor(x,y,click=0){return `<div style="position:absolute;left:${x}px;top:${y}px;z-index:9;transform:scale(${1-0.15*click})"><svg width="60" height="72" viewBox="0 0 30 36"><path d="M2 2 L2 28 L9 21 L14 33 L19 31 L14 19 L24 19 Z" fill="#150C2B" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>`}

function phone(w,h,inner,bar=''){return `<div style="width:${w}px;height:${h}px;border-radius:70px;background:#150C2B;padding:18px;box-shadow:0 40px 80px rgba(21,12,43,.25)"><div style="position:relative;width:100%;height:100%;border-radius:54px;background:#fff;overflow:hidden">${bar}${inner}</div></div>`}
function lab(t){return `<div class="lab">${t}</div>`}
const U='haldengroup.com.au', U2='haldenroofing.com.au';
// the vague "before" site
function vague(w,h){return `<div style="height:${h}px;background:#fff">
 <div style="display:flex;align-items:center;justify-content:space-between;padding:${w/30}px ${w/22}px">
  <b style="font-family:Georgia,'DejaVu Serif',serif;font-size:${w/20}px;letter-spacing:4px;color:#2B2F3A">HALDEN<span style="font-weight:400;color:#9AA0AE"> GROUP</span></b>
  <span style="display:flex;gap:${w/32}px;font-size:${w/40}px;color:#6B7080;font-weight:600"><span>About</span><span>Solutions</span><span>Synergy</span><span>Contact</span></span></div>
 <div style="position:relative;height:${h*.62}px;background:radial-gradient(circle at 75% 30%,#6E7FA8 0,#39435E 45%,#1E2233 100%);overflow:hidden">
  <div style="position:absolute;right:-${w*.08}px;top:-${w*.12}px;width:${w*.55}px;height:${w*.55}px;border-radius:50%;border:${w/90}px solid rgba(255,255,255,.12)"></div>
  <div style="position:absolute;right:${w*.06}px;top:${w*.05}px;width:${w*.3}px;height:${w*.3}px;border-radius:50%;border:${w/90}px solid rgba(255,255,255,.1)"></div>
  <div style="position:absolute;left:${w/14}px;top:${h*.14}px;color:#fff;width:70%">
   <div style="font-family:Georgia,'DejaVu Serif',serif;font-size:${w/12.5}px;line-height:1.08;font-style:italic">Elevating excellence, together.</div>
   <div style="font-size:${w/36}px;opacity:.75;margin-top:${w/50}px;line-height:1.4">Innovative solutions for a better tomorrow. Driven by passion, built on trust.</div>
   <div style="display:inline-block;margin-top:${w/30}px;border:2px solid #fff;font-size:${w/36}px;font-weight:700;letter-spacing:2px;padding:${w/70}px ${w/30}px">LEARN MORE</div></div></div>
 <div style="display:flex;gap:${w/30}px;padding:${w/22}px">${[0,1,2].map(()=>`<div style="flex:1"><div style="height:${w/14}px;width:${w/14}px;border-radius:50%;background:#E3E5EC"></div><div class="bar" style="margin-top:12px;width:90%"></div><div class="bar" style="margin-top:10px;width:70%"></div></div>`).join('')}</div></div>`}
// the fixed "after" site; hi = which part highlighted (1 what,2 where,3 next)
function fixed(w,h,hi=0,mk=0){const ring=(n)=>hi===n?`outline:${w/110}px solid #6557E8;outline-offset:${w/90}px;border-radius:10px`:'';
 return `<div style="height:${h}px;background:#fff">
 <div style="display:flex;align-items:center;justify-content:space-between;padding:${w/30}px ${w/22}px">
  <b style="font-size:${w/20}px;letter-spacing:-1px;color:#B5462B">Halden<span style="color:#1E2233"> Roofing</span></b>
  <span style="background:#B5462B;color:#fff;font-weight:800;font-size:${w/36}px;padding:${w/80}px ${w/36}px;border-radius:10px">📞 Call now</span></div>
 <div style="position:relative;height:${h*.62}px;background:linear-gradient(160deg,#3B2A24 0,#1E1512 100%);overflow:hidden">
  <svg style="position:absolute;right:-${w*.04}px;bottom:0" width="${w*.6}" height="${h*.5}" viewBox="0 0 300 200"><path d="M10 120 L150 30 L290 120" fill="none" stroke="#B5462B" stroke-width="16" stroke-linejoin="round"/><rect x="50" y="118" width="200" height="90" fill="#2E211C"/><rect x="130" y="140" width="40" height="70" fill="#B5462B" opacity=".55"/>${[0,1,2,3,4,5].map(i=>`<path d="M${30+i*45} 105 L${60+i*45} 86" stroke="#7A3A28" stroke-width="5"/>`).join('')}</svg>
  <div style="position:absolute;left:${w/14}px;top:${h*.1}px;color:#fff;width:66%">
   <div style="font-weight:800;letter-spacing:-.04em;font-size:${w/11}px;line-height:1.02"><span style="${ring(1)}">Roof repairs</span> <span style="${ring(2)}">in Geelong.</span></div>
   <div style="font-size:${w/28}px;opacity:.9;margin-top:${w/40}px;font-weight:600">Leaks fixed this week.</div>
   <div style="display:inline-block;margin-top:${w/28}px;background:#B5462B;color:#fff;font-weight:800;font-size:${w/30}px;padding:${w/55}px ${w/28}px;border-radius:12px;${ring(3)}">Get a free quote →</div></div></div>
 <div style="display:flex;gap:${w/30}px;padding:${w/22}px;font-size:${w/38}px;font-weight:700;color:#1E2233">${['⭐ 4.9 on Google','🛠 Licensed','⏱ Same-week'].map(x=>`<div style="flex:1;background:#F6F1EE;border-radius:12px;padding:${w/60}px;text-align:center;white-space:nowrap">${x}</div>`).join('')}</div></div>`}
function ring(sec,p,size=240,col='#6557E8'){const R=size*.4,L=2*Math.PI*R,f=clamp(p);
 return `<div style="position:relative;width:${size}px;height:${size}px;border-radius:50%;background:#150C2B;box-shadow:0 20px 40px rgba(21,12,43,.3)"><svg width="${size}" height="${size}" style="position:absolute;inset:0"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${size*.07}"/><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${col}" stroke-width="${size*.07}" stroke-linecap="round" stroke-dasharray="${L*(1-f)} ${L}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:${size*.42}px;letter-spacing:-3px">${sec}</div></div>`}
const qcard=(n,q,on,w=820)=>`<div class="card" style="width:${w}px;display:flex;align-items:center;gap:30px;padding:30px 40px;${on?'border:4px solid #6557E8':''}"><div style="width:96px;height:96px;flex:none;border-radius:26px;background:${on?'#6557E8':'#ECEAF3'};color:${on?'#fff':'#8F8AA3'};font-weight:800;font-size:54px;display:flex;align-items:center;justify-content:center">${n}</div><div class="h" style="font-size:60px;color:${on?'#150C2B':'#B3AEC4'}">${q}</div></div>`;
function cd(p,t,d){const r=clamp((t-0.6)/5),left=Math.max(0,5-Math.floor((t-0.6)));return at(p,d,ring(left,r,250,left<=1?'#E5484D':'#6557E8'),845,1010,{r:10,css:'z-index:6'})}
const Q=['What do you do?','Where?','What do I do next?'];
const SC=[
 // 0 hook: vague site + 5s countdown
 (p,t)=>at(p,0,browser(900,800,vague(900,736),U),540,330,{r:-2})+cd(p,t,.12),
 // 1 guesses
 (p,t)=>at(p,0,browser(900,800,vague(900,736),U),540,330,{dy:10,css:'filter:saturate(.6);opacity:.55'})+cd(1,t,0)
  +at(p,.0,`<div class="card" style="padding:30px 44px;font-family:Georgia,'DejaVu Serif',serif;font-style:italic;font-size:56px">“Elevating excellence, together.”</div>`,540,420,{r:-2,css:'z-index:4'})
  +[['🔨','a builder?'],['🏦','a bank?'],['🏋️','a gym?']].map((g,i)=>at(p,.42+i*.17,`<div class="chip" style="font-size:54px;padding:22px 46px;background:${i==1?'#6557E8':'#150C2B'}">${g[0]} ${g[1]}</div>`,[300,760,360][i],[690,830,990][i],{r:[-6,5,-3][i],css:'z-index:5'})).join(''),
 // 2 no idea
 (p,t)=>at(p,0,browser(900,800,vague(900,736),U),540,330,{dy:10,css:'filter:blur(3px) saturate(.4);opacity:.5'})
  +at(p,.05,`<div style="font-weight:800;font-size:420px;line-height:1;color:#6557E8;letter-spacing:-20px">?</div>`,540,380,{r:-12,css:'z-index:4'})
  +at(p,.45,'<div class="stamp">NO IDEA</div>',560,900,{r:-22,rr:-6,css:'z-index:5'}),
 // 3 people glance
 (p,t)=>{const sy=clamp(p*1.4);
  return lab('PEOPLE GLANCE')+at(p,0,phone(500,880,`<div style="transform:scale(.555);transform-origin:0 0;width:830px">${vague(830,1500)}</div><div style="position:absolute;left:0;right:0;top:${40+sy*640}px;height:120px;background:linear-gradient(transparent,rgba(185,166,255,.55),transparent)"></div>`),380,390,{r:-3})
  +at(p,.25,`<div style="font-size:150px">👀</div>`,820,470,{r:10})
  +at(p,.55,'<div class="chip" style="font-size:46px">stay?</div>',820,720,{r:-4})
  +at(p,.7,'<div class="chip" style="font-size:46px;background:#E5484D">or leave?</div>',820,850,{r:4})},
 // 4 three questions
 (p,t)=>lab('THE 5 SECOND TEST')+Q.map((q,i)=>at(p,.25+i*.12,qcard(i+1,'?',false,700),540,430+i*210,{r:i%2?2:-2})).join(''),
 // 5 questions reveal one by one
 (p,t)=>{const k=p<.36?0:p<.64?1:2;
  return lab('THE 5 SECOND TEST')+Q.map((q,i)=>at(p,i===0?0:[0,.36,.64][i]-.03,qcard(i+1,q,i===k),540,430+i*210,{r:i%2?2:-2,dy:i===0?20:60})).join('')},
 // 6 same business, here's the fix: wipe from vague to fixed
 (p,t)=>{const w=clamp((p-.35)*2);
  return lab('THE FIX')+at(p,0,`<div style="position:relative;width:900px;height:800px">${browser(900,800,vague(900,736),U)}<div style="position:absolute;inset:0;clip-path:inset(0 ${100-w*100}% 0 0)">${browser(900,800,fixed(900,736),U2)}</div><div style="position:absolute;top:-20px;bottom:-20px;left:${w*900-4}px;width:8px;background:#6557E8;border-radius:4px;opacity:${w>0&&w<1?1:0}"></div></div>`,540,380,{r:-1})},
 // 7 the fixed site with highlights
 (p,t)=>{const hi=p<.12?0:p<.42?1:p<.7?2:3;
  return at(p,0,browser(900,800,fixed(900,736,hi===1?1:hi===2?2:hi===3?3:0),U2),540,330,{dy:10})
  +[['✓ what','#6557E8',.12,200],['✓ where','#6557E8',.42,540],['✓ next step','#3C8A4A',.7,860]].map(c=>at(p,c[2],`<div class="chip" style="font-size:44px;background:${c[1]}">${c[0]}</div>`,c[3],1150,{r:-3})).join('')},
 // 8 passed
 (p,t)=>at(p,0,browser(900,800,fixed(900,736),U2),540,330,{dy:10,css:'opacity:.6'})
  +at(p,.05,ring('✓',1,300,'#3C8A4A').replace('rgba(255,255,255,.12)','#3C8A4A'),540,520,{r:-8,css:'z-index:4'})
  +at(p,.4,'<div class="stamp" style="border-color:#3C8A4A;color:#3C8A4A">PASSED</div>',540,900,{r:-18,rr:-5,css:'z-index:5'}),
 // 9 try it with a friend
 (p,t)=>{const left=Math.max(1,5-Math.floor(clamp((p-.3)*1.6)*5));
  return lab('TRY IT')+at(p,0,phone(460,820,`<div style="transform:scale(.475);transform-origin:0 0;width:888px">${vague(888,1600)}</div>`),330,380,{r:-4})
  +at(p,.3,ring(left,(p-.3)*1.6,200),800,440,{r:8})
  +at(p,.62,`<div class="card" style="padding:30px 40px;border-radius:40px 40px 40px 8px;font-size:48px;font-weight:700;width:520px">So... what do you actually do? 🤔</div>`,750,800,{r:3,css:'z-index:5'})},
 // 10 CTA
 (p,t)=>{let h='';Q.forEach((x,i)=>{const s=spring(p*3.6-i*.25);h+=`<div style="display:flex;align-items:center;gap:22px;margin:14px 0;font-weight:800;font-size:50px;opacity:${clamp(s*2)};transform:translateX(${(1-s)*-50}px)"><span style="width:56px;height:56px;border-radius:14px;border:5px solid #6557E8;flex:none"></span>${x}</div>`});
  return lab('DID YOUR SITE PASS?')+at(p,0,`<div class="card" style="width:820px;padding:40px 60px">${h}</div>`,540,350)+at(p,.3,'<div class="chip" style="font-size:46px;background:#6557E8">💬 tell me below</div>',540,790,{r:2})+at(p,.55,'<div class="chip" style="font-size:52px;padding:26px 56px">+ Follow <span style="color:#B9A6FF">@nexaweb_dev</span></div>',540,940,{r:-2})},
];
function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 const out=nx?clamp((t-(end-0.14))/0.14):0, inn=ease(lt/0.25);
 S.innerHTML=`<div style="position:absolute;inset:0;transform-origin:520px 330px;transform:scale(1.1)"><div style="position:absolute;inset:0;opacity:${inn*(1-out)};transform:translateY(${-out*40}px);filter:blur(${(1-inn)*8+out*8}px)">${SC[i](p,t)}</div></div>`;
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 const nc=ch.words.map(w=>w.w).join(' ').length;C.style.fontSize=(nc>26?70:82)+'px';
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop})">${w.w}</span>`}).join(' ');
};
</script></body></html>
