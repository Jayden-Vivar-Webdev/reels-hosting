<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans','Inter',sans-serif;color:#150C2B;background:#FAF9F6}
#stage{position:absolute;inset:0}
.I{color:#6557E8}
.lab{position:absolute;left:0;right:0;top:250px;text-align:center;font-weight:800;font-size:34px;letter-spacing:8px;color:#6557E8}
.h{font-weight:800;letter-spacing:-.045em;line-height:1;color:#150C2B}
.box{display:inline-block;background:#6557E8;color:#fff;padding:0 .14em .06em;border-radius:.12em}
.lav{display:inline-block;background:#B9A6FF;color:#150C2B;padding:0 .14em .06em;border-radius:.12em}
.card{background:#fff;border-radius:34px;box-shadow:0 30px 60px rgba(21,12,43,.13);border:2px solid rgba(21,12,43,.07)}
.navy{background:#150C2B;color:#fff;border-radius:34px;box-shadow:0 30px 60px rgba(21,12,43,.3)}
.chip{display:inline-block;background:#150C2B;color:#fff;border-radius:999px;padding:18px 40px;font-weight:800;font-size:44px;white-space:nowrap}
.stamp{display:inline-block;border:8px solid #E5484D;color:#E5484D;border-radius:20px;padding:4px 30px 10px;font-weight:800;font-size:96px;letter-spacing:4px}
.bar{height:22px;border-radius:11px;background:#ECEAF3}
#cap{position:absolute;left:80px;width:920px;top:1250px;text-align:center;font-weight:800;font-size:84px;letter-spacing:-.04em;line-height:1.14}
#cap span{display:inline-block;margin:0 .1em}
#cap span.k{background:#6557E8;color:#fff;padding:0 .12em .05em;border-radius:.12em}
#tag{position:absolute;left:880px;top:160px;font-weight:800;font-size:44px;letter-spacing:-2px}
#ser{position:absolute;left:90px;top:170px;font-weight:700;font-size:28px;letter-spacing:4px;color:rgba(21,12,43,.45)}
</style></head><body>
<div id="stage"></div>
<div id="ser">WEBSITE MYTHS</div>
<div id="tag">nexa<span class="I">.</span></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const S=document.getElementById('stage'),C=document.getElementById('cap');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const spring=x=>{x=clamp(x);return 1-Math.exp(-7*x)*Math.cos(8*x)};
function at(p,d,html,x,y,o={}){const s=spring((p-d)*3.4),ty=(1-s)*(o.dy??60);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${ty}px) scale(${0.9+0.1*s}) rotate(${(o.r||0)*(1-s)+(o.rr||0)}deg);opacity:${clamp(s*2.5)};${o.css||''}">${html}</div>`}
const SL=['linear-gradient(135deg,#6557E8,#B9A6FF)','linear-gradient(135deg,#150C2B,#6557E8)','linear-gradient(135deg,#B9A6FF,#F3EFFF)','linear-gradient(135deg,#2E2160,#9C8BF5)'];
const SLT=['Welcome to our site','Quality you can trust','Our services','Meet the team'];
// browser with homepage slider
function browser(w,h,inner,url='your-business.com.au'){return `<div class="card" style="position:relative;width:${w}px;height:${h}px;overflow:hidden"><div style="height:70px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:2px solid #EEECF4"><s style="width:16px;height:16px;border-radius:50%;background:#E5484D"></s><s style="width:16px;height:16px;border-radius:50%;background:#ECEAF3"></s><s style="width:16px;height:16px;border-radius:50%;background:#ECEAF3"></s><span style="margin-left:18px;font-size:24px;color:#8F8AA3;background:#F4F3F8;border-radius:12px;padding:6px 22px">${url}</span></div>${inner}</div>`}
function slider(w,h,t,label=true){const k=Math.floor(t/1.1)%4,f=clamp((t%1.1)/0.25);
 let dots='';for(let i=0;i<4;i++)dots+=`<span style="display:inline-block;width:16px;height:16px;border-radius:50%;margin:0 7px;background:${i==k?'#fff':'rgba(255,255,255,.45)'}"></span>`;
 return `<div style="position:relative;width:${w}px;height:${h}px;overflow:hidden"><div style="position:absolute;inset:0;background:${SL[(k+3)%4]}"></div><div style="position:absolute;inset:0;background:${SL[k]};clip-path:inset(0 0 0 ${(1-ease(f))*100}%)"></div>
 ${label?`<div style="position:absolute;left:50px;top:${h/2-50}px;color:#fff;font-weight:800;font-size:54px;letter-spacing:-2px;opacity:${f}">${SLT[k]}</div>`:''}
 <div style="position:absolute;left:0;right:0;bottom:24px;text-align:center">${dots}</div>
 <div style="position:absolute;left:18px;top:${h/2-30}px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.3);color:#fff;font-size:40px;text-align:center;line-height:58px">‹</div><div style="position:absolute;right:18px;top:${h/2-30}px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.3);color:#fff;font-size:40px;text-align:center;line-height:58px">›</div></div>`}
function lines(n,w=600){let h='';for(let i=0;i<n;i++)h+=`<div class="bar" style="width:${w*(i%2?0.7:1)}px;margin:18px 0"></div>`;return h}
function cursor(x,y,click=0){return `<div style="position:absolute;left:${x}px;top:${y}px;transform:scale(${1-0.15*click})"><svg width="60" height="72" viewBox="0 0 30 36"><path d="M2 2 L2 28 L9 21 L14 33 L19 31 L14 19 L24 19 Z" fill="#150C2B" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>`}
function phone(w,h,inner,o=''){return `<div style="position:relative;width:${w}px;height:${h}px;border-radius:70px;background:#150C2B;padding:22px;box-shadow:0 40px 80px rgba(21,12,43,.3);${o}"><div style="position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:#fff">${inner}<div style="position:absolute;left:50%;top:18px;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#150C2B"></div></div></div>`}
function phoneSite(){return `<div style="padding:90px 36px 0"><div style="height:220px;border-radius:24px;background:${SL[0]}"></div><div class="h" style="font-size:44px;margin:30px 0 10px">Fresh bread,<br>baked daily.</div>${lines(6,340)}</div>`}
function mythHead(n,txt,p){return `<div class="lab">MYTH ${n}</div>`+at(p,0,`<div class="h" style="font-size:112px;text-align:center;width:960px">${txt}</div>`,540,330)+at(p,.55,'<div class="stamp" style="background:#FAF9F6">MYTH</div>',830,1010,{r:-30,rr:-10,css:'z-index:5'})}
const SC=[
 // 0 hook: slider, cursor scrolls past
 (p,t)=>at(p,0,browser(900,700,slider(900,420,t)+`<div style="padding:10px 50px">${lines(4,700)}</div>`),540,330,{r:-2})
  +cursor(700-260*ease(p*1.4),620+300*ease(p*1.4))
  +at(p,.35,'<div class="h" style="font-size:96px;background:#FAF9F6;padding:16px 34px 26px;border-radius:30px;box-shadow:0 24px 50px rgba(21,12,43,.15);white-space:nowrap">almost <span class="box">nobody</span> clicks</div>',540,960,{r:3}),
 // 1 three myths
 (p,t)=>at(p,0,'<div class="h" style="font-size:150px;white-space:nowrap"><span class="box">3</span> website</div>',540,330)+at(p,.08,'<div class="h" style="font-size:150px">myths</div>',540,500)
  +['🎠 the slider','🪟 the pop-up','🖥️ the desktop'].map((x,i)=>at(p,.25+i*.12,`<div class="card" style="padding:26px 44px;font-weight:800;font-size:54px;white-space:nowrap">${x}</div>`,540,700+i*150,{r:i%2?3:-3,rr:i%2?2:-2})).join(''),
 // 2 myth one
 (p,t)=>mythHead('01','sliders look<br><span class="lav">premium</span>',p)+at(p,.25,browser(820,520,slider(820,450,t)),540,640,{r:2}),
 // 3 1% of visitors
 (p,t)=>{let g='';const n=Math.floor(clamp((p-.15)/.6)*100);for(let i=0;i<100;i++){const on=i==55&&p>.7;g+=`<div style="width:56px;height:56px;margin:5px;border-radius:50%;background:${on?'#6557E8':(i<n?'#D9D5E6':'#F0EEF5')};${on?'box-shadow:0 0 0 8px rgba(101,87,232,.25);transform:scale(1.25)':''}"></div>`}
  return '<div class="lab">2013 · A UNIVERSITY HOMEPAGE</div>'+at(p,0,`<div class="card" style="width:820px;padding:40px;display:flex;flex-wrap:wrap">${g}</div>`,540,330)
  +at(p,.62,'<div class="h" style="font-size:150px;background:#FAF9F6;padding:6px 40px 20px;border-radius:30px;box-shadow:0 24px 50px rgba(21,12,43,.18);white-space:nowrap"><span class="box">1%</span> clicked</div>',540,1000,{r:-3})},
 // 4 9 in 10 first slide
 (p,t)=>{const v=[89,4,3,4];let b='';v.forEach((x,i)=>{const hh=10+560*x/100*ease((p-.1-i*.06)*3);b+=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:150px;height:640px"><div style="font-weight:800;font-size:44px;margin-bottom:12px;color:${i?'#8F8AA3':'#6557E8'}">${i?'':'9 in 10'}</div><div style="width:120px;height:${hh}px;border-radius:20px 20px 8px 8px;background:${i?'#D9D5E6':'#6557E8'}"></div><div style="font-weight:700;font-size:30px;margin-top:14px;color:#8F8AA3">slide ${i+1}</div></div>`});
  return '<div class="lab">WHERE THE CLICKS WENT</div>'+at(p,0,`<div class="card" style="padding:50px 60px;display:flex;gap:30px;align-items:flex-end">${b}</div>`,540,330)},
 // 5 fix: one headline one button
 (p,t)=>{const cl=clamp((p-.65)/.1),pr=p>.72;return '<div class="lab">THE FIX</div>'+at(p,0,browser(880,640,`<div style="padding:70px 60px"><div class="h" style="font-size:86px">Fresh bread,<br>baked daily.</div><div style="font-size:36px;color:#8F8AA3;margin:24px 0 44px;font-weight:500">Order by 9pm for tomorrow.</div><div style="display:inline-block;background:${pr?'#4B3FC4':'#6557E8'};color:#fff;font-weight:800;font-size:46px;padding:26px 56px;border-radius:22px;transform:scale(${pr?0.95:1});box-shadow:0 ${pr?4:16}px 30px rgba(101,87,232,.35)">Order now</div></div>`),540,350)
  +cursor(560-120*ease(p*1.6),1100-150*ease(p*1.6),cl)+(pr?at(p,.72,'<div class="chip" style="background:#6557E8">✓ one job per page</div>',540,1040,{r:-2}):'')},
 // 6 myth two: pop-up
 (p,t)=>{const pu=ease((p-.3)*4);return '<div class="lab">MYTH 02</div>'+at(p,0,'<div class="h" style="font-size:96px;text-align:left;width:520px">instant<br>pop-ups =<br><span class="lav">sign-ups</span></div>',70,350,{c:false})
  +at(p,.1,phone(400,780,phoneSite()+`<div style="position:absolute;inset:0;background:rgba(21,12,43,${.55*pu})"></div><div style="position:absolute;left:24px;right:24px;top:${180+(1-pu)*700}px;height:500px;border-radius:30px;background:#fff;padding:40px 30px;text-align:center"><div style="position:absolute;right:18px;top:10px;font-size:22px;color:#C9C5D6">✕</div><div class="h" style="font-size:58px;margin-top:40px">WAIT!</div><div style="font-size:30px;font-weight:600;margin:20px 0 34px;color:#6B6680">Join our newsletter before you go</div><div style="background:#6557E8;color:#fff;font-weight:800;font-size:32px;padding:22px;border-radius:16px">Sign me up</div></div>`),820,330,{r:4,rr:3})
  +at(p,.6,'<div class="stamp" style="font-size:80px">MYTH</div>',300,820,{r:-30,rr:-10})},
 // 7 google warned 2017
 (p,t)=>{const r=['your-business.com.au','competitor-one.com.au','another-site.com.au'];const dr=ease((p-.45)*3);
  let rows='';[1,0,2].forEach((k,i)=>{const pos=k==0?i+dr*2:(i==2?2-dr:i==0?0:1-0);rows+=''});
  const order=[{n:r[0],y:0},{n:r[1],y:1},{n:r[2],y:2}];order[0].y=0+2*dr;order[1].y=1-dr;order[2].y=2-dr;
  rows=order.map((o,i)=>`<div style="position:absolute;left:40px;right:40px;top:${130+o.y*150}px;height:120px;border-radius:20px;background:${i==0?'#F3EFFF':'#F6F5F9'};padding:22px 30px;border:${i==0?'3px solid #6557E8':'none'}"><div style="font-size:26px;color:#3C8A4A;font-weight:600">${o.n}</div><div class="bar" style="width:${i==0?520:460}px;margin-top:16px;background:#E3E0EC"></div></div>`).join('');
  return '<div class="lab">GOOGLE · SINCE 2017</div>'+at(p,0,`<div class="card" style="position:relative;width:860px;height:620px;overflow:hidden"><div style="margin:36px 40px;height:64px;border-radius:32px;border:2px solid #E3E0EC;padding:12px 30px;font-size:30px;color:#8F8AA3">🔍 bakery near me</div>${rows}</div>`,540,340)
  +at(p,.5,'<div class="chip" style="background:#E5484D;font-size:46px">↓ rankings can drop</div>',540,1010,{r:-3})},
 // 8 fix small banner
 (p,t)=>{const b=ease((p-.25)*4);return '<div class="lab">THE FIX</div>'+at(p,0,phone(420,800,phoneSite()+`<div style="position:absolute;left:18px;right:18px;bottom:${18-(1-b)*200}px;border-radius:24px;background:#150C2B;color:#fff;padding:24px 26px;font-size:26px;font-weight:700;display:flex;align-items:center;gap:14px">10% off your first order <span style="margin-left:auto;background:#6557E8;padding:10px 18px;border-radius:12px">Get it</span><span style="color:#8F8AA3">✕</span></div>`),540,330)
  +at(p,.55,'<div class="chip" style="background:#6557E8">✓ small, skippable</div>',540,1060,{r:2})},
 // 9 myth three desktop
 (p,t)=>mythHead('03','they find you on a <span class="lav">computer</span>',p)+at(p,.25,`<div style="display:flex;flex-direction:column;align-items:center"><div class="navy" style="width:720px;height:440px;padding:22px;border-radius:30px"><div style="width:100%;height:100%;background:#fff;border-radius:14px;overflow:hidden">${slider(676,180,t,false)}<div style="padding:10px 30px">${lines(3,500)}</div></div></div><div style="width:120px;height:70px;background:#2E2160"></div><div style="width:320px;height:24px;border-radius:12px;background:#150C2B"></div></div>`,540,640),
 // 10 most traffic phones
 (p,t)=>{const m=ease((p-.2)*2);return '<div class="lab">WORLDWIDE WEB TRAFFIC</div>'+at(p,0,phone(300,580,phoneSite(),'transform:scale(1)'),330,360,{r:-4,rr:-4})
  +at(p,.1,'<div class="navy" style="width:400px;height:270px;padding:16px;border-radius:24px"><div style="width:100%;height:100%;background:#fff;border-radius:10px;padding:14px 24px"><div style="height:80px;border-radius:10px;background:linear-gradient(135deg,#6557E8,#B9A6FF)"></div><div class="bar" style="width:300px;margin-top:20px"></div><div class="bar" style="width:220px;margin-top:14px"></div></div></div>',780,520,{r:3})
  +at(p,.3,`<div class="card" style="width:880px;padding:36px 44px"><div style="display:flex;height:70px;border-radius:20px;overflow:hidden"><div style="width:${50+12*m}%;background:#6557E8"></div><div style="flex:1;background:#D9D5E6"></div></div><div style="display:flex;justify-content:space-between;margin-top:18px;font-weight:800;font-size:44px"><span class="I">📱 phones: most</span><span style="color:#8F8AA3">🖥️ the rest</span></div></div>`,540,990)},
 // 11 thumb first
 (p,t)=>{const a=ease((p-.2)*2.5);return '<div class="lab">DESIGN FOR THE THUMB</div>'+at(p,0,phone(440,860,phoneSite()+`<div style="position:absolute;left:-120px;bottom:-200px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(101,87,232,.45),rgba(101,87,232,.15) 65%,transparent 70%);opacity:${a}"></div><div style="position:absolute;left:30px;right:30px;bottom:40px;background:#6557E8;color:#fff;font-weight:800;font-size:36px;text-align:center;padding:26px;border-radius:20px;opacity:${clamp((p-.45)*4)}">📞 Tap to call</div>`),540,320)
  +at(p,.55,'<div class="chip">easy reach zone 👍</div>',540,1080,{r:-2})},
 // 12 CTA
 (p,t)=>{const it=['🎠 the slider','🪟 the pop-up','🖥️ desktop first'];let h='';it.forEach((x,i)=>{const s=spring(p*3.4-i*.35);h+=`<div style="display:flex;align-items:center;gap:22px;margin:18px 0;font-weight:800;font-size:54px;opacity:${clamp(s*2)};transform:translateX(${(1-s)*-50}px)"><span style="width:60px;height:60px;border-radius:16px;border:5px solid #6557E8;display:inline-block"></span>${x}</div>`});
  return '<div class="lab">WHICH ONE WAS YOURS?</div>'+at(p,0,`<div class="card" style="width:820px;padding:44px 60px">${h}</div>`,540,340)+at(p,.55,'<div class="chip" style="font-size:52px;padding:26px 56px">+ Follow <span style="color:#B9A6FF">@nexaweb_dev</span></div>',540,860,{r:-2})},
];
function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 const out=nx?clamp((t-(end-0.14))/0.14):0, inn=ease(lt/0.25);
 S.innerHTML=`<div style="position:absolute;inset:0;opacity:${inn*(1-out)};transform:translateY(${-out*40}px);filter:blur(${(1-inn)*8+out*8}px)">${SC[i](p,t)}</div>`;
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.filter(w=>t>=w.start-0.02).map(w=>`<span class="${w.k?'k':''}">${w.w}</span>`).join(' ');
};
</script></body></html>
