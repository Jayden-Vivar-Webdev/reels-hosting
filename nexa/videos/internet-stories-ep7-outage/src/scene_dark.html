<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'DM Sans',sans-serif;color:#fff;background:#0A0616}
#bg,#orbs,#grid,#parts,#stage,#vig{position:absolute;inset:0}
#bg{background:radial-gradient(1200px 900px at 50% 35%,#1B1036 0%,#110A24 45%,#0A0616 100%)}
#grid{perspective:900px;overflow:hidden}
#floor{position:absolute;left:-600px;right:-600px;top:1150px;height:1400px;transform-origin:50% 0;transform:rotateX(72deg);
 background-image:linear-gradient(rgba(140,120,255,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(140,120,255,.22) 2px,transparent 2px);background-size:90px 90px;
 -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 75%)}
#vig{background:radial-gradient(1100px 1500px at 50% 45%,transparent 55%,rgba(5,2,12,.75) 100%);pointer-events:none}
.lab{position:absolute;left:0;right:0;top:300px;text-align:center;font-weight:700;font-size:30px;letter-spacing:10px;color:#B9A6FF}
.lab i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#8B7BFF;margin-right:16px;vertical-align:4px;box-shadow:0 0 0 6px rgba(139,123,255,.18),0 0 24px #8B7BFF}
.h{font-weight:800;letter-spacing:-.045em;line-height:.98;color:#fff}
.grad{background:linear-gradient(100deg,#fff 10%,#CFC3FF 50%,#8B7BFF 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.box{display:inline-block;background:linear-gradient(135deg,#7C6CFF,#5845E0);color:#fff;padding:0 .16em .05em;border-radius:.14em;box-shadow:0 10px 40px rgba(101,87,232,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1.5px solid rgba(185,166,255,.22);border-radius:36px;
 box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.2),0 0 80px rgba(101,87,232,.18),inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden;backdrop-filter:blur(18px)}
.mono{font-family:'DejaVu Sans Mono',monospace}
.chip{display:inline-block;border-radius:999px;padding:16px 34px;font-weight:700;font-size:38px;white-space:nowrap;background:rgba(139,123,255,.16);border:1.5px solid rgba(185,166,255,.35);color:#DCD3FF;box-shadow:0 0 40px rgba(101,87,232,.25)}
.bar{height:78px;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1.5px solid rgba(185,166,255,.14);background:rgba(255,255,255,.03)}
.bar s{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-block}
.url{margin-left:16px;flex:1;height:44px;border-radius:12px;background:rgba(0,0,0,.25);display:flex;align-items:center;padding:0 18px;font-size:24px;color:#9C92C8}
.muted{color:#9C92C8}
.ok{color:#4BE39A}
.bad{color:#FF5C7A}
#cap{position:absolute;left:150px;width:780px;top:1385px;text-align:center;font-weight:800;font-size:80px;letter-spacing:-.04em;line-height:1.14;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#cap span{display:inline-block;margin:0 .1em}
#cap span.k{background:linear-gradient(135deg,#7C6CFF,#5845E0);color:#fff;padding:0 .12em .05em;border-radius:.12em;text-shadow:none;box-shadow:0 8px 30px rgba(101,87,232,.5)}
#tag{position:absolute;left:60px;top:232px;font-weight:700;font-size:26px;letter-spacing:5px;color:rgba(220,211,255,.55)}
#tag b{color:#8B7BFF}
#prog{position:absolute;left:60px;right:60px;top:276px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#prog i{display:block;height:100%;background:linear-gradient(90deg,#5845E0,#B9A6FF);box-shadow:0 0 12px #8B7BFF}
</style></head><body>
<div id="bg"></div><div id="orbs"></div><div id="grid"><div id="floor"></div></div><div id="parts"></div>
<div id="stage"></div><div id="vig"></div>
<div id="tag"><b>●</b> INTERNET STORIES · EP.7</div><div id="prog"><i></i></div>
<div id="cap"></div>
<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const S=$('stage'),C=$('cap'),O=$('orbs'),P=$('parts'),F=$('floor'),PR=$('prog').firstChild;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const spring=x=>{x=clamp(x);return 1-Math.exp(-6.5*x)*Math.cos(7.5*x)};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
// 3D entrance: rotateX flip-up + blur, then gentle float
function at(p,d,html,x,y,o={}){
 const s=spring((p-d)*3.2),e=ease((p-d)*4),tt=o.t||0;
 const fl=Math.sin((tt+d*7)*1.3)*(o.float??6);
 return `<div style="position:absolute;left:${x}px;top:${y}px;transform:translate(${o.c===false?0:'-50%'},${(1-s)*(o.dy??90)+fl}px) perspective(1400px) rotateX(${(1-s)*(o.rx??28)}deg) rotateZ(${(o.r||0)*(1-s)}deg) scale(${0.86+0.14*s});opacity:${clamp(e*1.6)};filter:blur(${(1-e)*14}px);transform-origin:50% 100%;${o.css||''}">${html}</div>`}
// moving light sweep over a card
const shine=(p,d=0)=>{const x=-60+clamp((p-d-.08)/.35)*220;return `<div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent ${x-18}%,rgba(255,255,255,.13) ${x}%,transparent ${x+18}%)"></div>`};
function lab(t,p){const e=ease(p*5);return `<div class="lab" style="opacity:${e};letter-spacing:${10+(1-e)*14}px"><i></i>${t}</div>`}
function typed(t,p,a,b){return t.slice(0,Math.floor(t.length*clamp((p-a)/(b-a))))}
const caret=t=>`<span style="display:inline-block;width:4px;height:1em;background:#B9A6FF;vertical-align:-.12em;box-shadow:0 0 10px #B9A6FF;opacity:${Math.floor(t*3)%2}"></span>`;
function browser(w,url,inner,p){return `<div class="glass" style="width:${w}px"><div class="bar"><s style="background:#FF5C7A"></s><s style="background:#FFC24B"></s><s style="background:#4BE39A"></s><div class="url mono">🔒 ${url}</div></div>${inner}${shine(p,0)}</div>`}
function search(q,res,p,t){return browser(900,'domains.google',`<div style="padding:46px"><div class="h" style="font-size:56px">Find your perfect domain</div><div style="margin-top:30px;border:2px solid rgba(185,166,255,.5);border-radius:20px;padding:22px 28px;font-size:46px;font-weight:700;background:rgba(0,0,0,.25);box-shadow:0 0 0 6px rgba(139,123,255,.12)" class="mono">${q}${res?'':caret(t)}</div>${res||''}</div>`,p)}
const RES=(s,t)=>`<div style="margin-top:30px;display:flex;align-items:center;justify-content:space-between;background:rgba(75,227,154,.08);border:1.5px solid rgba(75,227,154,.35);border-radius:22px;padding:24px 30px;transform:scale(${.9+.1*s});opacity:${clamp(s*2)};box-shadow:0 0 ${30+10*Math.sin(t*6)}px rgba(75,227,154,.25)"><div><div class="mono" style="font-size:40px;font-weight:700">google.com</div><div class="ok" style="font-size:32px;font-weight:700;margin-top:6px">● Available</div></div><div class="h" style="font-size:76px">$12</div></div>`;
function morph(p){const src='6,006.13'.split(''),L={0:'G',2:'O',3:'O',4:'G',6:'L',7:'E'};let h='',k=0;const m0=clamp((p-.6)/.1);
 src.forEach((c,i)=>{if(!(i in L)){h+=`<span style="display:inline-block;overflow:hidden;width:${(1-m0)*.6}em;opacity:${1-m0}">${c}</span>`;return}
  const m=clamp((p-.64-k*.035)/.12);k++;
  h+=`<span style="position:relative;display:inline-block;width:.62em;text-align:center"><span style="position:absolute;left:0;right:0;opacity:${1-m};filter:blur(${m*12}px);transform:translateY(${-m*30}px)">${c}</span><span class="grad" style="display:inline-block;opacity:${m};filter:blur(${(1-m)*12}px);transform:translateY(${(1-m)*30}px)">${L[i]}</span></span>`});return h}
function ring(x,y,p,d,col='139,123,255'){const q=clamp((p-d)/.35);return q<=0||q>=1?'':`<div style="position:absolute;left:${x}px;top:${y}px;width:${200+700*ease(q)}px;height:${200+700*ease(q)}px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(${col},${.7*(1-q)});box-shadow:0 0 40px rgba(${col},${.5*(1-q)})"></div>`}
const stamp=(txt,fs=64,col='255,92,122')=>`<div class="h" style="font-size:${fs}px;padding:14px 34px;border:7px solid rgb(${col});color:rgb(${col});border-radius:18px;letter-spacing:4px;white-space:nowrap;background:rgba(10,6,22,.6);box-shadow:0 0 40px rgba(${col},.35)">${txt}</div>`;
const APPS=[['Facebook','👍'],['Instagram','📷'],['WhatsApp','💬']];
function appRow(off,p,t){return `<div style="display:flex;gap:26px">${APPS.map(([n,e],i)=>{const o=clamp((off-i*.06)*5);const col=o>.5?'#FF5C7A':'#4BE39A';return `<div class="glass" style="width:280px;padding:34px 20px 30px;text-align:center;filter:grayscale(${o})"><div style="font-size:96px;opacity:${1-.6*o}">${e}</div><div class="h" style="font-size:40px;margin-top:12px;opacity:${1-.5*o}">${n}</div><div style="margin-top:16px;font-size:28px;font-weight:800;color:${col}"><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${col};box-shadow:0 0 14px ${col};margin-right:10px"></span>${o>.5?'OFFLINE':'ONLINE'}</div></div>`}).join('')}</div>`}
function term(lines,p,t,o={}){return `<div class="glass" style="width:${o.w||900}px;text-align:left"><div class="bar"><s style="background:#FF5C7A"></s><s style="background:#FFC24B"></s><s style="background:#4BE39A"></s><div class="url mono">backbone-ops</div></div><div class="mono" style="padding:36px 40px;font-size:36px;line-height:1.55">${lines}</div>${shine(p,0)}</div>`}
function phone(inner,o={}){return `<div style="width:${o.w||330}px;height:${o.h||600}px;border-radius:56px;background:#08050F;border:10px solid #2A2147;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 2px rgba(185,166,255,.25);position:relative;overflow:hidden"><div style="position:absolute;top:16px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000"></div><div style="position:absolute;inset:70px 22px 30px">${inner}</div></div>`}
const bub=(s,me,q,col)=>`<div style="display:flex;justify-content:${me?'flex-start':'flex-end'};margin:14px 0;opacity:${q};transform:translateY(${(1-q)*20}px)"><div style="max-width:560px;padding:20px 28px;border-radius:28px;font-size:38px;font-weight:700;line-height:1.25;background:${me?'linear-gradient(135deg,#7C6CFF,#5845E0)':(col||'rgba(255,255,255,.1)')};border:1.5px solid rgba(185,166,255,.25)">${s}</div></div>`;
function dns(ans,p,t,label){const q1=spring((p-.1)*3),q2=spring((p-.4)*3);return `<div style="display:flex;align-items:center;gap:40px">${phone(`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px"><div style="font-size:44px;font-weight:800">${ans==null?'⏳':ans?'✅':'⚠️'}</div><div class="mono" style="font-size:24px;color:#B9A6FF">facebook.com</div></div>`,{w:300,h:540})}<div style="width:560px">${bub('📱 Where does facebook.com live?',1,clamp(q1*1.5))}${bub(ans==null?'…':ans?'📖 Right here. Go!':'📖 …no answer',0,clamp(q2*1.5),ans===false?'rgba(255,92,122,.18)':ans?'rgba(75,227,154,.14)':null)}</div></div>`}
function nodes(cut,p,t){const N=[[200,560],[880,560],[540,440],[260,880],[820,880],[540,730]],E=[[0,2],[2,1],[0,5],[1,5],[5,3],[5,4],[3,4],[0,3],[1,4]];let h='';
 E.forEach(([a,b],i)=>{const [x1,y1]=N[a],[x2,y2]=N[b];const s=clamp((p-.02-i*.02)*5);const c=clamp((cut-i*.03)*6);const L=Math.hypot(x2-x1,y2-y1);
  h+=`<div style="position:absolute;left:${x1}px;top:${y1}px;width:${L*s}px;height:6px;border-radius:3px;transform-origin:0 50%;transform:rotate(${Math.atan2(y2-y1,x2-x1)}rad);background:${c>.5?'repeating-linear-gradient(90deg,#FF5C7A 0 18px,transparent 18px 34px)':'linear-gradient(90deg,#B9A6FF,#7C6CFF)'};box-shadow:0 0 16px ${c>.5?'rgba(255,92,122,.6)':'rgba(139,123,255,.7)'};opacity:${c>.5?.8:1}"></div>`;
  if(c>.3&&c<1) h+=`<div style="position:absolute;left:${(x1+x2)/2}px;top:${(y1+y2)/2}px;transform:translate(-50%,-50%) scale(${1+.5*(1-c)});font-size:50px">✂️</div>`;});
 N.forEach(([x,y],i)=>{const s=spring((p-i*.04)*3);h+=`<div class="glass" style="position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${clamp(s,0,1.2)});width:150px;height:150px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;${cut>.9?'border-color:rgba(255,92,122,.6)':''}"><div style="font-size:60px">🗄️</div><div style="font-size:20px;font-weight:800;letter-spacing:2px;color:#9C92C8">DC ${i+1}</div></div>`});return h}
const SC=[
 // 0 hook
 (p,t)=>lab('DID YOU KNOW',p)+at(p,0,'<div class="h" style="font-size:112px;text-align:left;width:940px">Facebook deleted<br>itself from the</div>',80,380,{c:false,t})
   +at(p,.2,'<div class="h" style="font-size:160px;white-space:nowrap"><span class="box">internet.</span></div>',80,640,{c:false,r:-4,t})
   +at(p,.62,stamp('BY ACCIDENT',80),540,960,{r:-6,t,dy:-60}),
 // 1 oct 4 all dark
 (p,t)=>lab('OCTOBER 4, 2021',p)+at(p,0,appRow(clamp((p-.35)*2),p,t),540,400,{t})
   +at(p,.55,'<div class="chip" style="font-size:46px">🌍 all at once, worldwide</div>',540,1020,{r:-3,t}),
 // 2 one command
 (p,t)=>lab('THE CAUSE',p)+at(p,0,term(`<span class="muted"># routine maintenance</span><br><span style="color:#4BE39A">$</span> ${typed('check network capacity',p,.15,.6)}${p<.62?caret(t):''}<br>${p>.7?'<span style="color:#FF9DB0">⚠ running on every link…</span>':''}`,p,t),540,380,{t})
   +at(p,.3,'<div class="h" style="font-size:120px;white-space:nowrap"><span class="box">1 command</span></div>',540,950,{r:-3,t}),
 // 3 cut links
 (p,t)=>lab('THE NETWORK',p)+nodes(clamp((p-.45)*1.8),p,t)
   +at(p,.75,'<div class="chip" style="font-size:44px;background:rgba(255,92,122,.14);border-color:rgba(255,92,122,.5);color:#FFC2CE">✂️ every link cut</div>',540,1080,{r:-3,t}),
 // 4 dns explained
 (p,t)=>lab('HOW IT WORKS',p)+at(p,0,dns(p>.5?true:null,p,t),540,380,{t})
   +at(p,.55,'<div class="chip" style="font-size:44px">📖 the internet\'s phone book</div>',540,1060,{r:-3,t}),
 // 5 silent
 (p,t)=>lab('THAT DAY',p)+at(p,0,dns(p>.3?false:null,p,t),540,380,{t})
   +at(p,.55,stamp('FACEBOOK.COM: NOT FOUND',56),540,1040,{r:-5,t,dy:-60}),
 // 6 badges
 (p,t)=>{const sw=ease((p-.25)*3),den=p>.5;return lab('LOCKED OUT',p)+at(p,0,`<div style="display:flex;align-items:center;gap:60px"><div class="glass" style="width:380px;height:240px;padding:30px;transform:translateX(${sw*70}px) rotate(-6deg);text-align:left"><div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#7C6CFF,#5845E0);display:flex;align-items:center;justify-content:center;font-size:50px">👤</div><div class="h" style="font-size:40px;margin-top:20px">STAFF</div><div class="mono muted" style="font-size:24px">ID 000417</div></div><div style="width:230px;height:380px;border-radius:30px;background:#1A1238;border:4px solid rgba(185,166,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;box-shadow:0 30px 70px rgba(0,0,0,.6)"><div style="width:70px;height:70px;border-radius:50%;background:${den?'#FF5C7A':'#3A2D6E'};box-shadow:0 0 ${den?40:0}px #FF5C7A"></div><div class="h" style="font-size:34px;color:${den?'#FF5C7A':'#9C92C8'}">${den?'DENIED':'TAP'}</div></div></div>`,540,420,{t})
  +at(p,.6,'<div class="chip" style="font-size:42px">🗞 reportedly, badges failed</div>',540,1060,{r:-3,t})},
 // 7 in person
 (p,t)=>{const g=clamp((p-.35)/.5);return lab('IN PERSON',p)+at(p,0,`<div class="glass" style="width:860px;padding:40px 50px;text-align:center"><div style="display:flex;justify-content:center;gap:24px">${[0,1,2].map(k=>`<div style="width:200px;height:300px;border-radius:18px;background:#120C26;border:3px solid rgba(185,166,255,.25);padding:20px 16px">${[0,1,2,3,4].map(j=>`<div style="height:36px;margin:8px 0;border-radius:6px;background:#1E1640;display:flex;align-items:center;padding-left:14px"><span style="width:12px;height:12px;border-radius:50%;background:${g>(k*5+j)/15?'#4BE39A':'#FF5C7A'};box-shadow:0 0 10px ${g>(k*5+j)/15?'#4BE39A':'#FF5C7A'}"></span></div>`).join('')}</div>`).join('')}</div><div style="margin-top:34px;height:24px;border-radius:12px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;width:${g*100}%;background:linear-gradient(90deg,#5845E0,#4BE39A)"></div></div><div class="h" style="font-size:44px;margin-top:20px">restarting… ${Math.round(g*100)}%</div>${shine(p,.2)}</div>`,540,360,{t})
  +at(p,.15,'<div style="font-size:130px">🧑‍🔧</div>',170,1050,{r:-8,t})+at(p,.25,'<div class="chip" style="font-size:42px">🔧 fixing it on-site</div>',600,1080,{r:3,t})},
 // 8 6 hours later
 (p,t)=>{const h=Math.min(6,6*eio((p-.05)/.5));return lab('BACK ONLINE',p)+at(p,0,`<div class="glass" style="width:860px;padding:44px;text-align:center"><div class="muted" style="font-size:30px;font-weight:700;letter-spacing:8px">TIME OFFLINE</div><div class="h grad mono" style="font-size:150px;margin-top:10px;letter-spacing:-6px">~${h.toFixed(1)}h</div>${shine(p,.6)}</div>`,540,340,{t})
  +at(p,.45,appRow(1-clamp((p-.5)*4),p,t),540,760,{t})},
 // 9 businesses
 (p,t)=>{const e=p>.4;return lab('THE COST',p)+at(p,0,phone(`<div style="text-align:center"><div style="width:150px;height:150px;margin:20px auto 0;border-radius:50%;background:${e?'#2A2147':'linear-gradient(135deg,#FF9DB0,#B9A6FF)'};display:flex;align-items:center;justify-content:center;font-size:80px">${e?'':'💐'}</div><div style="font-size:40px;font-weight:800;margin-top:20px">${e?'<span style="display:inline-block;width:240px;height:34px;border-radius:10px;background:#2A2147"></span>':'Bloom &amp; Co'}</div><div style="font-size:26px;color:#9C92C8;margin-top:10px">${e?'':'florist · DMs for orders'}</div>${e?`<div style="margin-top:60px;font-size:80px">⚠️</div><div style="font-size:34px;font-weight:800;color:#FF9DB0;margin-top:14px">Couldn't load.<br>Try again later.</div>`:`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:40px">${Array(9).fill(0).map((_,i)=>`<div style="height:110px;border-radius:8px;background:hsl(${280+i*12},50%,${30+i%3*8}%)"></div>`).join('')}</div>`}</div>`,{w:460,h:860}),540,280,{t,float:3})
  +at(p,.55,'<div class="chip" style="font-size:40px;background:rgba(255,92,122,.14);border-color:rgba(255,92,122,.5);color:#FFC2CE">no website = no backup</div>',540,1180,{r:-3,t})},
 // 10 rented land
 (p,t)=>{const card=(e,a,b,ok)=>`<div class="glass" style="width:420px;padding:44px 30px;text-align:center;${ok?'border-color:rgba(75,227,154,.5)':''}"><div style="font-size:120px">${e}</div><div class="h" style="font-size:52px;margin-top:16px">${a}</div><div class="h" style="font-size:46px;margin-top:12px;color:${ok?'#4BE39A':'#FF9DB0'}">${b}</div></div>`;
  return lab('THE LESSON',p)+at(p,0,card('📱','Social media','rented land',0),290,400,{t,r:-3})+at(p,.45,card('🌐','Your website','land you own',1),790,400,{t,r:3})
  +at(p,.7,'<div class="h" style="font-size:90px;white-space:nowrap">Build on <span class="box">yours.</span></div>',540,1020,{t})},
 // 11 CTA
 (p,t)=>lab('YOUR CALL',p)+at(p,0,'<div class="h" style="font-size:94px;text-align:center;width:960px">If Instagram went<br>down tomorrow…</div>',540,360,{t})
   +at(p,.2,'<div class="h grad" style="font-size:80px;text-align:center;width:960px">could customers<br>still find you?</div>',540,620,{t})
   +at(p,.5,'<div class="glass" style="border-radius:999px;padding:26px 54px;font-size:50px;font-weight:800;white-space:nowrap;background:linear-gradient(135deg,#7C6CFF,#5845E0);border-color:rgba(255,255,255,.3);box-shadow:0 20px 60px rgba(101,87,232,.6)">+ Follow @nexaweb_dev</div>',540,1000,{t}),
];

function lineAt(t){let i=0;for(let k=0;k<DATA.lines.length;k++)if(t>=DATA.lines[k].start-0.05)i=k;return i}
window.render=function(t){
 const i=lineAt(t),L=DATA.lines[i],nx=DATA.lines[i+1];
 const end=nx?nx.start:DATA.total,d=end-L.start,lt=t-L.start+0.05,p=clamp(lt/d);
 // background motion
 O.innerHTML=[[30,22,'101,87,232',.55,900],[78,60,'139,80,255',.38,800],[20,80,'60,120,255',.25,700]].map(([x,y,c,a,r],k)=>{const X=x+8*Math.sin(t*.25+k*2),Y=y+6*Math.cos(t*.2+k);return `<div style="position:absolute;left:${X}%;top:${Y}%;width:${r}px;height:${r}px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(${c},${a}),transparent 65%);filter:blur(30px)"></div>`}).join('');
 F.style.backgroundPosition=`0 ${(t*40)%90}px`;
 let ph='';for(let k=0;k<38;k++){const x=rnd(k)*1080,sp=10+rnd(k+50)*30,y=(1920-((rnd(k+9)*1920+t*sp)%1920)),sz=2+rnd(k+3)*4,a=.15+.5*rnd(k+7)*(.6+.4*Math.sin(t*2+k));ph+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-radius:50%;background:#CFC3FF;opacity:${a};box-shadow:0 0 ${sz*3}px #8B7BFF"></div>`}
 P.innerHTML=ph;
 PR.style.width=(100*t/DATA.total)+'%';
 const out=nx?clamp((t-(end-0.16))/0.16):0, inn=ease(lt/0.3), zoom=1+0.03*p;
 S.innerHTML=`<div style="position:absolute;inset:0;opacity:${inn*(1-out)};transform:scale(${zoom*(1+out*.06)}) translateY(${-out*30}px);transform-origin:540px 760px;filter:blur(${(1-inn)*10+out*12}px)">${SC[i](p,t)}</div>`
  +(lt<.18&&i>0?`<div style="position:absolute;inset:0;background:radial-gradient(800px 600px at 50% 40%,rgba(139,123,255,${.22*(1-lt/.18)}),transparent 70%)"></div>`:'');
 const ch=DATA.chunks.find(c=>t>=c.start&&t<c.end+0.25);
 if(!ch){C.innerHTML='';return}
 C.innerHTML=ch.words.map(w=>{const a=t-(w.start-0.03),on=a>=0,pop=on?0.85+0.15*ease(a/0.12):1;return `<span class="${w.k?'k':''}" style="opacity:${on?1:0};transform:scale(${pop}) translateY(${on?(1-ease(a/0.15))*14:0}px)">${w.w}</span>`}).join(' ');
};
</script></body></html>
