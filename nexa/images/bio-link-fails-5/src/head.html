<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ind:#6557E8;--lav:#B9A6FF;--navy:#150C2B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#444}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--navy);color:#fff}
.s:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(700px 520px at 85% 72%,rgba(101,87,232,.30),transparent 70%),radial-gradient(500px 400px at 0% 100%,rgba(185,166,255,.10),transparent 70%)}
.ph{position:absolute;left:0;right:0;top:0;height:640px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,12,43,.15) 0%,rgba(21,12,43,.35) 45%,#150C2B 98%)}
.num{position:absolute;left:62px;top:150px;font:800 260px/1 'DM Sans';letter-spacing:-.06em;color:transparent;-webkit-text-stroke:3px rgba(185,166,255,.85);z-index:2}
.h{position:absolute;left:80px;right:80px;top:420px;font:800 74px/1.02 'DM Sans';letter-spacing:-.035em;z-index:3}
.h em{font-style:normal;color:var(--lav)}
.sub{position:absolute;left:80px;right:80px;top:510px;font-size:32px;line-height:1.35;color:#C9C2E6;z-index:3}
.card{position:absolute;left:80px;right:80px;top:600px;background:#fff;color:#1f1d24;border-radius:30px;z-index:4;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.bar{height:60px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid #eeedf2;font:600 19px Inter;color:#55525d;background:#fbfbfd}
.bar .d{width:12px;height:12px;border-radius:50%;background:#e2e0e8;box-shadow:20px 0 0 #e2e0e8,40px 0 0 #e2e0e8;margin-right:46px}
.bar .url{flex:1;height:36px;border-radius:18px;background:#efeef3;display:flex;align-items:center;padding:0 18px;font:500 18px Inter;color:#7a7783}
.bar .url b{filter:blur(4px);font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;padding:27px 34px;border-bottom:1px solid #f0eff4;font-size:29px}
.row .k{color:#8a8794;font-size:24px}
.row .v{font-weight:600;text-align:right}
.why{position:absolute;left:80px;right:80px;top:1135px;font-size:32px;line-height:1.4;color:#D9D3F2;z-index:3}
.why b{color:var(--lav);font-weight:700}
.ft{position:absolute;left:80px;right:80px;bottom:46px;display:flex;justify-content:space-between;align-items:center;font:500 25px Inter;color:#8C84AD;z-index:3}
.dots{display:flex;gap:9px}.dots span{width:10px;height:10px;border-radius:5px;background:#3A2F5E}.dots span.on{width:34px;background:var(--lav)}
.note{position:absolute;font:700 34px 'DM Sans';color:var(--lav);z-index:6}
.chk{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font:800 20px Inter;color:#fff;background:#2fb36d}
.chk.no{background:#fff;border:2.5px solid #d6d3de;color:transparent}
.li{display:flex;align-items:center;gap:22px;padding:25px 34px;border-bottom:1px solid #f0eff4;font-size:27px}
.li small{display:block;font-size:20px;color:#8a8794;margin-top:3px}
svg.sc{position:absolute;overflow:visible;pointer-events:none;z-index:6}

.mini{border-radius:18px;overflow:hidden;border:1px solid #e9e7ee;background:#fff}
.mini .nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font:700 17px 'DM Sans';color:#3b2a1e;border-bottom:1px solid #f0eee9}
.mini .nav i{font:500 11px Inter;font-style:normal;color:#8a8794}
.mini .hero{position:relative;height:230px;background-size:cover;background-position:center}
.mini .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.mini .hero span{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:#fff;font:700 21px/1.15 Georgia}
.mini .btn{margin:12px 16px 14px;display:inline-block;background:#3b2a1e;color:#fff;font:600 14px Inter;padding:9px 16px;border-radius:18px}
.tag{position:absolute;font:800 20px Inter;letter-spacing:.06em;padding:7px 14px;border-radius:10px;color:#fff;z-index:5}
.file{display:flex;align-items:center;gap:22px;padding:24px 30px}
.file .th{width:120px;height:90px;border-radius:12px;background-size:cover;background-position:center;flex:none}
.file .nm{font:600 27px Inter}
.file .mt{font-size:22px;color:#8a8794;margin-top:4px}
.file .sz{margin-left:auto;font:800 30px Inter}
.fld{margin:0 30px;border:1.5px solid #e4e2ea;border-radius:14px;padding:15px 18px;font-size:25px;line-height:1.35}
.lbl{padding:20px 30px 9px;font:600 19px Inter;color:#8a8794}
.rv{display:flex;gap:18px;padding:22px 30px;border-bottom:1px solid #f0eff4}
.av{width:54px;height:54px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 22px Inter;color:#fff}
.stars{color:#f5a623;font-size:22px;letter-spacing:2px}
.blur{filter:blur(5px)}
.chip{display:inline-block;font:600 19px Inter;padding:8px 14px;border-radius:10px;background:#f1effa;color:#3d3480;margin:0 8px 8px 0}
</style></head><body>
